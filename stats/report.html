<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>旋转飞刀 · 试玩数据</title>
<style>*{box-sizing:border-box}body{font:16px/1.55 system-ui,sans-serif;color:#262522;background:#f6f4ef;margin:auto;max-width:940px;padding:24px}h1{font-size:30px;margin:8px 0}h2{font-size:18px;margin:0 0 12px}section{background:#fff;border-radius:15px;padding:18px;margin:16px 0;overflow:auto}p{color:#53534d}button,select,input{font:inherit;padding:7px 12px;margin:4px 5px 4px 0;border:1px solid #bbb9b0;border-radius:8px;background:white}button{cursor:pointer}button:active{background:#ddd8ca;transform:scale(.97)}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:7px 11px 7px 0;border-bottom:1px solid #ebe8de}th{font-size:13px;color:#625d53}#hero{font-size:19px;font-weight:650}</style>
<h1>旋转飞刀 · 试玩数据</h1>
<form id="login" hidden><label>报表口令 <input type="password" id="key" required></label><button>查看</button></form>
<label>时间 <select id="days"><option value="1">近 24 小时</option><option value="7" selected>近 7 天</option><option value="30">近 30 天</option></select></label>
<label>设备 <select id="device"><option value="all">全部设备</option><option value="android">安卓手机 / 平板</option><option value="ios">苹果手机 / 平板</option><option value="mobile">其他移动设备</option><option value="desktop">桌面设备</option></select></label><label>版本 <select id="build"><option value="p2" selected>无尽版</option><option value="p1">旧版</option><option value="all">全部</option></select></label><button id="refresh">刷新</button>
<p id="hero" aria-live="polite"></p><main></main>
<script>
const el=id=>document.getElementById(id);
let token=location.hash.slice(1);history.replaceState(null,'',location.pathname+location.search);
if(token)sessionStorage.setItem('reportKey',token);else token=sessionStorage.getItem('reportKey');
const labels={android:'Android',ios:'iOS / iPadOS',desktop:'桌面',mobile:'其他移动设备',slip:'滑落',spike:'尖刺',void:'落空',other:'其他',buy:'金币购买',short:'金币不足',daily:'签到',power:'使用库存道具',ad_off:'点击未开放的广告奖励',revive:'广告复活',supply:'补给',run:'局内道具',double:'结算翻倍',chef:'小刀',cleaver:'大刀',santoku:'水果刀',bread:'面包刀',katana:'银月刀',ice:'寒冰刀',willow:'柳叶刀',gold:'烈焰刀',neon:'闪电刀',comet:'流星刀',rainbow:'彩虹刀',obsidian:'黑龙刀',carrot:'萝卜刀',popsicle:'冰棒刀',banana:'香蕉刀',fish:'小鱼刀',watermelon:'西瓜刀',rocket:'火箭刀',star:'星星刀',steady:'稳刃石',feather:'风羽',gild:'聚金币',goldrush:'金币雨',triple:'三段跳',rain:'万剑归宗',revival:'复活药水'};
Object.assign(labels,{claim_trophy:'领取成就',challenge_start:'开始每日挑战',challenge_win:'每日挑战成功',challenge_fail:'每日挑战失败',
  share_result:'系统分享战绩',copy_result:'复制战绩',wheel_spin:'转盘抽奖',coins:'金币',fruit:'水果连切',precision:'金靶落点',air:'空中拦截',sprint:'限时冲刺',
  achievement:'成就','free-spin':'每日免费','coin-spin':'金币抽奖',citrus:'橘刃',glass:'琉璃刀',bubble:'泡泡刀',kite:'风筝刀',dawn:'晨曦刀',
  aurora:'极光刀',thousand:'魔刀千刃','gilded-wheel':'星轮刀','azure-dragon':'苍龙刀'});
const label=v=>labels[v]||v,percent=(n,d)=>d?(100*n/d).toFixed(0)+'%':'—';
function table(title,head,rows){
 const section=document.createElement('section'),h=document.createElement('h2');h.textContent=title;section.append(h);
 if(rows.length){const t=document.createElement('table');for(const [i,row] of [head,...rows].entries()){const r=t.insertRow();for(const text of row){const c=document.createElement(i?'td':'th');c.textContent=text;r.append(c);}}section.append(t);}
 else section.append('暂无数据');document.querySelector('main').append(section);
}
async function load(){
 if(!token){el('login').hidden=false;return;}
 try{const u=new URL('/summary',location.href);for(const k of ['device','days','build'])u.searchParams.set(k,el(k).value);
 if(new URLSearchParams(location.search).get('qa')==='1')u.searchParams.set('qa',1);
 const r=await fetch(u,{headers:{Authorization:'Bearer '+token}});if(r.status===401){el('login').hidden=false;throw Error('请输入有效口令');}if(!r.ok)throw Error('暂时无法读取报表');
 const {levels,endless,failures,performance,actions,equipment}=await r.json();el('login').hidden=true;document.querySelector('main').replaceChildren();
 const sum=k=>levels.reduce((n,x)=>n+x[k],0);el('hero').textContent=(u.searchParams.has('qa')?'验收数据 · ':'')+(sum('starts')+(endless?.starts||0))+' 局试玩　'+sum('wins')+' 局通关';
 table('关卡表现',['关卡','开局','首次出刀率','通关率','首次失败','广告复活率¹','广告复活后通关','药水复活','主动重试','平均游玩','离开时进度²','通关金币'],levels.map(x=>[x.level,x.starts,percent(x.launched,x.starts),percent(x.wins,x.starts),x.firstFails,percent(x.revives,x.firstFails),percent(x.rescued,x.revives),x.itemRevives,x.retries,x.seconds+' 秒',x.exitProgress===null?'—':x.exitProgress+'%',x.income??'—']));
 if(endless?.starts)table('无尽挑战',['开局','结算','广告复活','药水复活','结算平均柱数','最远柱数','平均结算金币'],
  [[endless.starts,endless.settled,endless.revives,endless.itemRevives,endless.distance??'—',endless.best??'—',endless.income??'—']]);
 const focus=[];
 for(const x of levels){if(x.starts>=20&&x.wins/x.starts<.35){const f=failures.find(v=>v.level===x.level);focus.push(['第 '+x.level+' 关',percent(x.wins,x.starts)+' 通关',f?'优先复查第 '+f.pad+' 根柱子后的'+label(f.reason)+'，调整后用同口径重测':'检查离开进度及关卡引导']);}}
 for(const x of performance)if(x.n>=10&&x.slow>=5)focus.push([label(x.platform),x.slow+'% 长帧','在该类设备重测连续切割和碎片落地']);
 for(const x of actions)if(x.kind==='short'&&x.n>=10){const buys=actions.find(v=>v.kind==='buy'&&v.item===x.item)?.n||0;if(x.n>2*buys)focus.push([label(x.item),x.n+' 次余额不足','对照通关金币与购买价，检查是否需要调整价格']);}
 table('优先复查',['范围','观察','下一步'],focus);
 table('失败位置',['关卡','最后落稳的柱子','死因','次数'],failures.map(x=>[x.level,x.pad===0?'起点':x.pad,label(x.reason),x.n]));
 table('流畅度',['设备','有采样的局数','平均帧率','超过 33 毫秒的帧'],performance.map(x=>[label(x.platform),x.n,x.fps,x.slow+'%']));
 table('玩法与道具',['操作','内容','次数'],actions.map(x=>[label(x.kind),label(x.item),x.n]));
 table('出战武器',['武器','使用局数','每局平均切割'],equipment.map(x=>[label(x.gear),x.n,x.cuts]));
 const note=document.createElement('p');note.textContent='¹ 广告复活率以至少失败过一次的局为分母。每次重新开局单独计数。仅汇总开启匿名统计的试玩，首页演示和后台停留不计入游玩时长。统计按开局时间归档。² 离开时进度包括主动离开和暂时切后台，回到同一局后更新。复查建议从每关 20 局、每类设备 10 局或 10 次余额不足起显示。';document.querySelector('main').append(note);
 }catch(e){el('hero').textContent=e.message;}
}
el('login').onsubmit=e=>{e.preventDefault();token=el('key').value;el('key').value='';sessionStorage.setItem('reportKey',token);load();};el('refresh').onclick=el('days').onchange=el('device').onchange=el('build').onchange=load;load();
</script></html>
