#stage>canvas {position:absolute;inset:0;width:100%;height:100%;display:block}
#fx {pointer-events:none}
#stage:is([data-screen=levels],[data-screen=settings],[data-screen=shop],[data-screen=supplies]) #fx {display:none}
#stage.flash::after {content:"";position:absolute;inset:0;background:#fff;animation:flash .4s ease-out forwards;pointer-events:none}
@keyframes flash {from{opacity:.75}to{opacity:0}}
.screen {position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none}
.hidden {display:none!important}
button,.scroll,.sheet,.dim {pointer-events:auto}
button {font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button[aria-disabled=true] {cursor:default}
button:focus-visible {outline:2px solid #fff0a8;outline-offset:3px}
.screen button[data-act] {transform-origin:center;transition:scale .13s,translate .13s,filter .13s}
.screen button[data-act]:is(:active,.is-pressed) {scale:.965;translate:0 3px;filter:brightness(.88);transition-duration:.045s}
/* Icons have a fixed slot within each control size. Labels never inherit the SVG baseline. */
.glyph {display:block;flex:none;width:var(--glyph-size,var(--icon-action));height:var(--glyph-size,var(--icon-action));pointer-events:none}
.glyph svg {display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ui-label {min-width:0;line-height:1.18}
.round,.view-switch,.dialog-medal {--glyph-size:var(--icon-nav)}
.round,.view-switch,.icon-link,.action.soft,.carry {
  border:1px solid #8ca6dc85;background:var(--grain),var(--blue);box-shadow:var(--blue-depth);color:#f6f4e7;
}
.round,.icon-link {width:max(44px,calc(var(--u)*11.5));height:max(44px,calc(var(--u)*11.5));display:grid;place-items:center;border-radius:13px}
.round.sm {font-size:14px}
.toprow,.topbar {padding:0 var(--gutter);margin-top:var(--safe-top);display:grid;align-items:center;min-height:48px;gap:8px;position:relative;z-index:2}
.toprow {grid-template-columns:1fr auto;justify-items:start}
.topbar {grid-template-columns:minmax(54px,1fr) auto minmax(54px,1fr)}
.topbar>.round {justify-self:start}
.topbar>:last-child {justify-self:end}
.ttl {margin:0;text-align:center;font-size:clamp(20px,calc(var(--u)*6.3),32px);font-weight:900;line-height:1.15;letter-spacing:.035em;
  color:#fff5dd;text-shadow:0 2px #192847,0 4px 6px #0a163f85}
.pill {display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:4px 10px 4px 5px;border:1px solid #84a8df9c;
  border-radius:99px;background:var(--grain),linear-gradient(#24365d,#142540);box-shadow:inset 0 1px 0 #b6ccff55,0 3px 0 #132649;white-space:nowrap}
.pill b {line-height:1;min-width:1.15em;font-weight:850;text-align:right;font-size:clamp(12px,calc(var(--u)*3.7),18px);font-variant-numeric:tabular-nums}
.coin-token {--glyph-size:13px;display:grid;place-items:center;flex:none;width:22px;height:22px;border:1px solid #ffe98f;border-radius:50%;color:#764315;
  background:var(--gold);box-shadow:inset 0 0 0 2px #e4a32f,0 2px 0 #8f531c}
.pill.bump,.bump {animation:bump .2s ease-out}
@keyframes bump {40%{scale:1.12}}

/* Home and in-game controls */
#scr-home::before {content:"";position:absolute;inset:54% 0 0;background:linear-gradient(transparent,#101a3688 56%,#101a36de)}
.logo {position:relative;text-align:center;margin-top:calc(var(--u)*10);margin-top:clamp(22px,6.2dvh,58px);line-height:1.02}
.l1,.l2 {font-weight:900;letter-spacing:.035em;-webkit-text-stroke:calc(var(--u)*.68) #39223b;paint-order:stroke fill}
.l1 {font-size:calc(var(--u)*18);color:#fff4dc;text-shadow:0 .055em #b86c4b,0 .10em #733b36,0 .15em #402a3f,0 .22em .21em #132143a0}
.l2 {font-size:calc(var(--u)*23.5);color:#ffdf63;text-shadow:0 .05em #d58923,0 .10em #9b4d20,0 .155em #4c2e34,0 .21em .2em #142143a0}
.l3 {margin-top:calc(var(--u)*4);font-size:clamp(10px,calc(var(--u)*3.2),15px);letter-spacing:.25em;color:#fff4df;text-shadow:0 2px 4px #16274a}
.homebot {position:relative;margin-top:auto;padding:0 var(--gutter) var(--safe-bottom);display:grid;justify-items:center;gap:clamp(13px,3.2dvh,26px)}
.btn.big,.action.primary,.kit-actions button[data-act=buySupply],.lv.cur,.day.today:not(.past) {
  border:1px solid #ffea97;color:var(--gold-ink);background:var(--grain),var(--gold);box-shadow:var(--gold-depth);
}
.btn.big {width:min(100%,360px);min-height:clamp(56px,calc(var(--u)*18),90px);border-radius:clamp(14px,calc(var(--u)*5),24px);
  display:flex;align-items:center;justify-content:center;gap:12px;font-size:calc(var(--u)*8.2);font-weight:900}
.btn.big {--glyph-size:clamp(25px,calc(var(--u)*7.7),34px)}
.btn.big .glyph {filter:drop-shadow(0 1px 0 #fffac080)}
.btn .pt {display:grid;text-align:left;line-height:1.09}
.btn small {font-size:.43em;font-weight:800;margin-top:3px}
.row3 {width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(5px,2%,12px);padding:7px;
  border:1px solid #8194bf7d;border-radius:17px;background:var(--grain),linear-gradient(#253b65f2,#172441f5);box-shadow:inset 0 1px 0 #93bdf32e,0 4px 0 #0f1831,0 8px 20px #12182759}
.sq {display:grid;justify-items:center;align-content:center;gap:4px;border-radius:11px;min-height:clamp(53px,calc(var(--u)*15.6),77px);padding:4px 1px;
  border:1px solid #779cdb5c;background:var(--grain),linear-gradient(#3b5789,#2a406b);box-shadow:var(--blue-depth);font-size:clamp(10px,calc(var(--u)*3.36),17px);line-height:1.1}
.sq {--glyph-size:clamp(22px,calc(var(--u)*6.45),29px);grid-template-rows:var(--glyph-size) auto}
.sq .glyph {color:#c9e7fb;filter:drop-shadow(0 1px 1px #101a32a0)}
.sq .ui-label {align-self:center;text-align:center}
.pausebtn {position:absolute;top:var(--safe-top);left:var(--gutter)}
.hudcoin {position:absolute;top:calc(var(--safe-top) + 4px);right:var(--gutter)}
.lvlbar {position:absolute;top:calc(var(--safe-top) + 3px);left:50%;translate:-50% 0;width:min(40%,230px);text-align:center}
.lvlname {font-size:clamp(12px,calc(var(--u)*3.75),18px);font-weight:880;text-shadow:0 2px 2px #152850,0 0 6px #142850}
.bar {height:9px;margin-top:5px;border:1px solid #99b9e78a;border-radius:99px;overflow:hidden;background:#172342;box-shadow:inset 0 2px 1px #0d162c}
.bar i {display:block;height:100%;width:0;background:var(--gold);border-radius:inherit;box-shadow:inset 0 1px 0 #fff3c3}
.hint {position:absolute;inset:auto calc(var(--gutter) + 5px) max(60px,11%) calc(var(--gutter) + 5px);text-align:center}
.hand {--glyph-size:clamp(33px,calc(var(--u)*10.7),50px);width:max-content;margin:auto;color:#ffe28c;
  animation:tap 1s ease-in-out infinite;filter:drop-shadow(0 2px 2px #1b294c)}
.hand svg {stroke-width:1.55}
@keyframes tap {50%{translate:0 -7px;scale:.9}}
.htxt {display:inline-block;margin-top:6px;max-width:86%;padding:9px 14px;border-radius:12px;border:1px solid #90aed57d;background:#152544e8;font-size:clamp(12px,calc(var(--u)*4.3),21px);box-shadow:0 3px 0 #101b306e}
.hud-pack {position:absolute;right:var(--gutter);bottom:calc(var(--safe-bottom) + 14px);width:max(44px,calc(var(--u)*12.5));height:max(44px,calc(var(--u)*12.5));
  display:grid;place-items:center;border:1px solid #c5f4e8;border-radius:13px;color:#193b40;background:var(--grain),linear-gradient(#b7f2db,#61bfae);
  box-shadow:inset 0 2px 0 #e4ffea,0 4px 0 #2b6166,0 5px 0 #142e41}
.hud-pack {--glyph-size:calc(var(--icon-nav) + 2px)}
.hud-pack small {position:absolute;right:-5px;top:-5px;min-width:19px;border:1px solid #ffe094;border-radius:99px;background:#5c3c22;color:#ffecb9;font-size:12px}
#live-powers {position:absolute;inset:calc(var(--safe-top) + 57px) var(--gutter) auto;display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.effect-chip {position:relative;display:flex;align-items:center;gap:6px;padding:5px 8px 7px;overflow:hidden;border-radius:9px;background:#132240f3;border:1px solid #817fb6;color:var(--paper);box-shadow:0 2px 6px #121d3a37}
.effect-chip {--glyph-size:17px}.effect-chip .glyph {color:var(--accent)}.effect-chip .effect-text {display:grid;line-height:1.16;gap:2px}
.effect-chip b {font-size:12px}.effect-chip small {font-size:10px;color:var(--mist);font-weight:560}.effect-chip time {font-size:12px;color:var(--accent);font-weight:800}
.effect-chip .effect-bar {position:absolute;bottom:0;left:0;width:100%;height:2px;transform-origin:left;transform:scaleX(var(--remaining,1));background:var(--accent)}

/* Coloured bezels, inset slots and small highlights give the panels physical edges. */
#scr-levels,#scr-settings,#scr-supplies,#scr-shop.catalog {
  background:linear-gradient(180deg,#132445f4,#142746f2 52%,#161d39fb);
}
.scroll {flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:17px var(--gutter) calc(var(--safe-bottom) + 6px);touch-action:pan-y;scrollbar-width:thin;scrollbar-color:#6384ae55 transparent}
.screen .scroll button {touch-action:pan-y}
.sheet {background:var(--grain),var(--panel);border:1px solid var(--rim);border-radius:17px;color:var(--paper);box-shadow:inset 0 2px 0 #b6caff3e,inset 0 0 0 3px #0d264d3d,0 4px 0 #111c38,0 8px 17px #0b17375b}
.sheet h2,.sheet p {margin:0}
.lvgrid,.supply-scroll {display:grid;gap:17px;align-content:start}
.lvgrid {grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.days {display:grid;gap:clamp(4px,2.5%,10px)}
.lv {min-height:76px;display:grid;align-content:center;justify-items:center;gap:5px;border-radius:10px;
  border:1px solid #849be3;background:var(--grain),linear-gradient(#5e7cbb,#385291);box-shadow:var(--blue-depth)}
.lv b {font-size:clamp(17px,calc(var(--u)*5.9),29px);line-height:1;font-weight:900}
.lv small {font-size:10px;line-height:1}
.lv.lock {color:#a1b1d1;border-color:#51678d;background:var(--grain),var(--well);box-shadow:inset 0 2px 2px #091c3e8c,0 1px 0 #6e8dc54a}
.lv.lock b {font-size:clamp(13px,calc(var(--u)*4.35),21px)}
.lk {--glyph-size:13px;opacity:.88}
.lv.gate:not(.cur):not(.lock) {background:var(--grain),linear-gradient(#805390,#51416c);border-color:#a981af}
.lv.gate.lock {border-color:#966ca2}
.ss,.result-stars {display:flex;align-items:center;justify-content:center}
.st {color:#111e3e}
.ss .st {--glyph-size:clamp(9px,calc(var(--u)*3),15px)}
.st.on svg {fill:currentColor}
.st.on {color:#ffdc68;filter:drop-shadow(0 2px 0 #9f5826)}
.lv.cur .st {color:#c68a35}.lv.cur .st.on {color:#fff3a8}
.lv.cur {outline:1px solid #ffffff73;outline-offset:2px}

/* Armory. Keep the live bench clear and tuck its controls into one bottom plate. */
.armory-wallet {display:flex;align-items:center;gap:6px;justify-content:flex-end}
#scr-shop .topbar {grid-template-columns:48px 1fr auto}
#scr-shop .ttl {text-align:left}
.view-switch {display:grid;place-items:center;min-width:44px;min-height:44px;border-radius:12px;font-size:17px}
.weapon-test {position:absolute;inset:calc(var(--safe-top) + 55px) 0 max(148px,23%)}
.preview-footer {position:absolute;bottom:var(--safe-bottom);left:var(--gutter);right:var(--gutter);padding:11px;display:grid;gap:9px}
.name-pager {display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;text-align:center}
.name-pager .round {width:44px;height:44px}
.name-pager h2 {font-size:clamp(21px,calc(var(--u)*7.1),35px);font-weight:900;text-shadow:0 2px #172345}
.gear-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(7px,2.65vw,13px)}
.gear-cell {display:grid;align-content:start;justify-items:center;gap:4px;min-height:118px;padding:7px 3px 9px;line-height:1.1;color:var(--paper);
  border:1px solid #6e88ba;border-radius:13px;background:var(--grain),radial-gradient(ellipse at 50% 25%,#6079a6,#314a79 57%,#203353 85%);box-shadow:var(--blue-depth)}
.gear-cell.current {border-color:#ffdf83;box-shadow:inset 0 0 0 1px #eab344,0 3px 0 #503324}
.gear-cell canvas {display:block;width:100%;height:auto;pointer-events:none}
.gear-cell b {font-size:clamp(12px,calc(var(--u)*3.8),18px)}
.catalog-price,.gear-cell small {--glyph-size:var(--icon-small);display:flex;align-items:center;gap:4px;font-size:clamp(10px,calc(var(--u)*3),15px);color:#f9db88}
.gear-cell small {color:#d0e0fa}.gear-cell[data-owned=true] small {color:#afeed3}

/* Supply trays and settings */
.supply-sheet,.settings-sheet {padding:14px;display:grid;gap:13px;min-width:0}
.section-name {--glyph-size:var(--icon-nav);display:flex;align-items:center;gap:9px;font-size:clamp(17px,calc(var(--u)*5.3),25px);font-weight:900}
.section-name .glyph {color:#ffda76}
.days {grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day {display:grid;place-items:center;gap:2px;min-height:clamp(40px,calc(var(--u)*12),55px);border-radius:8px;padding:3px;
  border:1px solid #5d7aa7;background:var(--grain),var(--well);box-shadow:inset 0 2px 1px #122346;font-size:12px;color:#d2e0f7}
.day .glyph {--glyph-size:17px;color:#bcd2ff}
.day.today .glyph,.day.past .glyph {color:inherit}.day.past {color:#b1efd3}
.supply-sheet .daily-prize {font-size:13px;color:var(--mist)}
.supply-tabs {display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid #486393;border-radius:12px;background:#172946}
.supply-tabs button {min-height:43px;padding:4px;border-radius:8px;color:var(--mist);font-size:clamp(12px,calc(var(--u)*3.7),18px)}
.supply-tabs button[aria-pressed=true] {background:var(--grain),var(--blue);box-shadow:inset 0 1px 0 #bcd6ff68,0 2px 0 #0c1932;color:#fff2d5}
.supply-tiles {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.supply-tile {position:relative;min-width:0;display:grid;justify-items:center;gap:3px;padding:4px 1px 8px;border:1px solid #6c87b4;border-radius:10px;
  background:var(--grain),radial-gradient(ellipse at 50% 33%,#677fac,#294369 75%);box-shadow:var(--blue-depth);line-height:1.15;font-size:clamp(11px,calc(var(--u)*3.55),17px)}
.supply-tile.chosen {border-color:#ffe19a;background:var(--grain),radial-gradient(ellipse at 50% 33%,#7790b9,#364c73 76%);box-shadow:inset 0 0 0 1px #efaf49,0 3px 0 #573c30}
.supply-tile small {color:var(--mist);font-size:11px}
.kit-model {display:block;max-width:100%;height:auto;width:100%;pointer-events:none}
.supply-tile .kit-model {width:min(100%,132px)}
.kit-check {--glyph-size:var(--icon-small);position:absolute;top:5px;right:5px;color:#b6efce}
.selected-kit,.kit-actions {display:flex;align-items:center;gap:8px}
.selected-kit {min-height:30px}
.selected-kit p {flex:1;font-size:clamp(12px,calc(var(--u)*3.6),16px);line-height:1.35;color:#dae5fc}
.carry {--glyph-size:16px;display:flex;align-items:center;justify-content:center;gap:5px;min-height:44px;border-radius:9px;padding:0 9px;font-size:12px;flex:none}
.carry.selected {color:#bef1d6;background:#245658}
.kit-actions>* {flex:1;min-width:0}
.kit-actions button {--glyph-size:18px;min-height:44px;padding:5px 4px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:clamp(11px,calc(var(--u)*3.5),16px)}
.kit-actions button:only-child {grid-column:1/-1}
.kit-actions button[data-act=adSupply] {border:1px solid #61779f;color:#cbd8ef;background:#223555}
.settings-sheet {gap:0}
.setrow {display:flex;align-items:center;justify-content:space-between;gap:9px;text-align:left;min-height:55px;border-bottom:1px solid #7b95c744;font-size:clamp(13px,calc(var(--u)*4),19px);padding:4px 1px}
.setting-label {--glyph-size:var(--icon-action);display:flex;align-items:center;gap:9px;min-width:0}.setting-label .glyph {color:#c6dcfb}
.sw {position:relative;flex:none;width:48px;height:25px;border:1px solid #738cb6;border-radius:99px;background:#162544;box-shadow:inset 0 2px 0 #101a35}
.sw.on {background:#307e78;border-color:#88cfc0}
.sw u {position:absolute;top:3px;left:4px;width:17px;height:17px;background:linear-gradient(#fff7df,#c4d2eb);border-radius:50%;box-shadow:0 2px 0 #10234485;transition:translate .15s}
.sw.on u {translate:21px 0}
.segs {display:flex;gap:3px;padding:3px;border-radius:9px;background:var(--well);flex:none}
.segs button {padding:4px clamp(5px,calc(var(--u)*1.9),10px);min-height:44px;border-radius:7px;color:#c2d2ee;font-size:clamp(11px,calc(var(--u)*3.25),15px)}
.segs button.on {background:var(--blue);box-shadow:inset 0 1px 0 #b3c7ef72;color:#fff5dc}
.setting-foot {display:flex;justify-content:space-between;align-items:center;gap:5px;margin-top:8px;color:var(--mist);font-size:12px}
#scr-daily-challenge {z-index:2}

/* Result, revive and pause share the outer shell. The header conveys the state. */
.dim {position:absolute;inset:0;background:#080e22a8}
:is(#scr-fail,#scr-result,#scr-pause,#scr-powers) {align-items:center;justify-content:center;padding:var(--safe-top) var(--gutter) var(--safe-bottom)}
.modal {position:relative;width:min(100%,410px);max-height:100%;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;
  display:grid;gap:0;border-color:#829bcd;animation:panel-in .22s cubic-bezier(.20,.75,.27,1.04) both}
@keyframes panel-in {from{opacity:0;scale:.95;translate:0 8px}to{opacity:1;scale:1}}
.dialog-head {position:relative;isolation:isolate;display:grid;justify-items:center;gap:5px;padding:13px 17px 16px;text-align:center;overflow:hidden;
  border-block-end:1px solid #9ab7ed77;background:var(--grain),radial-gradient(ellipse at 50% 0%,#607eba,#2f4c84 77%)}
.dialog-head::after {position:absolute;content:"";inset:0;z-index:-1;opacity:.28;mask-image:linear-gradient(#000,transparent 90%);
  background:repeating-conic-gradient(at 50% 110%,transparent 0deg 16deg,#e4f0ff38 16deg 25deg)}
.dialog-head.failure {background:var(--grain),radial-gradient(ellipse at 50% 0%,#ad626f,#603b5c 82%);border-color:#b07a94}
.dialog-head.victory {background:var(--grain),radial-gradient(ellipse at 50% 0%,#416f96,#2a496f 82%)}
.dialog-head.powers {background:var(--grain),radial-gradient(ellipse at 50% 0%,#408582,#28466c 82%)}
.dialog-head h2 {font-size:clamp(24px,calc(var(--u)*8.7),43px);font-weight:900;line-height:1.14;letter-spacing:.02em;text-shadow:0 3px 0 #1521408c,0 5px 9px #1521407d}
.dialog-head.victory h2 {color:#ffe2a0}
.eyebrow {font-size:12px;color:#f5e6d8;font-weight:760}
.dialog-medal {display:grid;place-items:center;width:43px;height:43px;border:1px solid #a7c4f5;border-radius:12px;background:var(--grain),var(--blue);
  box-shadow:var(--blue-depth);font-size:20px;color:#e3efff}
.failure .dialog-medal {color:#ffe9cf;background:var(--grain),linear-gradient(#a85f6d,#71465d);border-color:#e9a2a0}
.result-stars {gap:6px;margin:3px 0}
.result-stars .st {--glyph-size:clamp(29px,calc(var(--u)*11),52px);filter:drop-shadow(0 2px 0 #0e203f)}
.result-stars .st.on {filter:drop-shadow(0 3px 0 #8b542c) drop-shadow(0 0 7px #ffb84e75)}
.dialog-body {display:grid;gap:11px;padding:14px 15px 16px}
.dialog-body p {text-align:center;color:#e0eaff;font-size:clamp(13px,calc(var(--u)*3.85),18px)}
.action {width:100%;min-height:46px;display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 7px;border-radius:10px;
  font-size:clamp(13px,calc(var(--u)*4.2),21px);font-weight:850;line-height:1.12}
.action.quiet,.action[aria-disabled=true] {border:1px solid #6d84b174;background:#25385b;color:#c1cfe5;box-shadow:inset 0 2px 0 #14274674}
.icon-dock {display:flex;justify-content:center;gap:9px;padding-top:1px}
.icon-dock .icon-link {--glyph-size:var(--icon-action);font-size:16px}
.icon-dock .icon-link.wide {width:auto;padding:0 12px;display:flex;gap:7px;min-width:86px;justify-content:center;font-size:clamp(12px,calc(var(--u)*3.7),17px)}
.earnings {display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;padding:10px 11px;border:1px solid #627eb3;border-radius:10px;background:var(--grain),var(--well);box-shadow:inset 0 2px 0 #142141}
.earnings>span {color:#d8e5fb;font-size:14px}
.earnings b {display:flex;align-items:center;gap:6px;color:#ffe394;font-size:clamp(22px,calc(var(--u)*8.1),37px);line-height:1;font-variant-numeric:tabular-nums}
.earnings b .glyph {--glyph-size:var(--icon-nav)}
.finish-badge {justify-self:center;display:flex;align-items:center;gap:6px;font-size:clamp(11px,calc(var(--u)*3.5),17px);color:#f0ebdb;font-weight:750}
.finish-badge .glyph {color:var(--hit)}.finish-badge b {border:1px solid var(--hit);border-radius:6px;padding:1px 8px;background:#172748;color:#fff0c5}
.crit-receipt {grid-column:1/-1;text-align:right;font-size:11px;color:#f7d288}
.power-choice {width:100%;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:7px;align-items:center;text-align:left;padding:5px 6px;
  min-height:62px;border:1px solid #6684b2;border-radius:10px;background:var(--grain),linear-gradient(#364f7a,#223956);box-shadow:var(--blue-depth)}
.power-choice .power-description {display:grid;gap:3px;min-width:0}.power-choice b {font-size:clamp(13px,calc(var(--u)*4.1),19px)}.power-choice small {font-size:clamp(10px,calc(var(--u)*3.1),13px);color:#d3e0f8;font-weight:550;line-height:1.25}
.power-choice em {--glyph-size:var(--icon-small);font-style:normal;text-align:center;display:flex;align-items:center;justify-content:center;gap:4px;
  max-width:104px;padding:5px 6px;border-radius:7px;font-size:clamp(9px,calc(var(--u)*2.7),12px);color:#bfcee5;background:#162641}
.power-choice.ready em {color:#eaf9df;background:#256164}
#toast {position:absolute;left:50%;bottom:calc(var(--safe-bottom) + 72px);translate:-50% 0;max-width:92%;text-align:center;padding:9px 13px;border:1px solid #8e9dbdae;border-radius:11px;
  background:#142342f7;color:#fff5e0;box-shadow:0 3px 0 #111b33;font-size:14px;opacity:0;pointer-events:none;z-index:9}
#toast.show {animation:toast 1.6s ease both}
@keyframes toast {0%,100%{opacity:0;transform:translateY(4px)}12%,82%{opacity:1;transform:none}}
#nogl {position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:#152544}
@media(max-height:580px) {
  .logo {margin-top:22px}.l1 {font-size:calc(var(--u)*15.5)}.l2 {font-size:calc(var(--u)*20)}

}
@media(max-width:350px) {
  #scr-shop .armory-wallet {gap:4px}.gear-grid {gap:7px}.setrow {font-size:12px}
  .power-choice {grid-template-columns:43px minmax(0,1fr) auto}
}
@container(max-width:300px) {
  .topbar {gap:5px}
  #scr-shop .topbar {grid-template-columns:44px minmax(0,1fr) auto}
  #scr-shop .ttl {font-size:16px}
  #scr-shop .armory-wallet .pill {padding-right:5px}
  .setting-label {--glyph-size:18px;gap:6px}
  .segs button {padding-inline:4px;font-size:10px}
  .icon-dock {gap:5px}
  .icon-dock .icon-link.wide {min-width:0;padding-inline:7px}
}
@media(prefers-reduced-motion:reduce) {
  .modal,.hand {animation:none}
  .screen button[data-act] {transition:none}
  .screen button[data-act]:is(:active,.is-pressed) {scale:1;translate:none;filter:brightness(.76)}
}

.homebot {gap:clamp(9px,2.4dvh,18px)}
.endless-entry {width:min(100%,360px);min-height:44px;display:flex;justify-content:center;align-items:center;gap:8px;padding:4px 10px;border-radius:11px;
  color:#f2f7ff;border:1px solid #8ca6dcc0;background:var(--grain),var(--blue);box-shadow:var(--blue-depth)}
.endless-entry .glyph {color:#a5e7eb}
.endless-entry small {margin-left:auto;color:#dcf3f8;padding:3px 7px;border-radius:7px;background:#233d64;font-size:11px}
.endless-entry .ui-label {font-size:clamp(13px,calc(var(--u)*3.85),19px);font-weight:850}
.dialog-head.endless {background:var(--grain),radial-gradient(ellipse at 50% 0%,#56948e,#2e4b78 80%)}
.dialog-head.endless .dialog-medal {background:var(--grain),linear-gradient(#468c93,#2d5874);color:#dcffee;border-color:#b5e2df}
.endless-tally {font-size:13px;text-align:center;color:#dce8fa}
.endless-steps {display:none;color:#e9f3ff;font-size:12px;line-height:1.1;margin-top:4px;text-shadow:0 2px 2px #152850}
#stage[data-run=endless] .lvlbar .bar {display:none}
#stage[data-run=endless] .endless-steps {display:block}
.supply-tiles.special-grid {grid-template-columns:repeat(4,minmax(0,1fr))}
.special-grid .supply-tile {padding-block:6px;font-size:clamp(10px,calc(var(--u)*3.27),15px)}
.special-grid .kit-model {width:100%;max-width:118px}
:is(#scr-endless,#scr-endless-result) {align-items:center;justify-content:center;padding:var(--safe-top) var(--gutter) var(--safe-bottom)}
.receipt-lines {grid-column:1/-1;display:grid;gap:3px;color:#bfd1ed;font-size:12px;border-top:1px solid #6a86b64f;padding-top:6px;margin-top:4px}
.receipt-lines span {display:flex;justify-content:space-between;gap:10px}
.receipt-lines strong {color:#ffe4a0}
@media(max-height:480px){

.endless-quota {display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;
  border:1px solid #6c88b480;border-radius:9px;background:var(--well);color:#d6e5fa;font-size:clamp(11px,calc(var(--u)*3.1),14px)}
.endless-quota span:last-child {font-variant-numeric:tabular-nums;white-space:nowrap;color:#bce8df}
.dialog-body .share-help {font-size:12px;color:#c5d5ef;line-height:1.35}
.share-url {width:100%;min-width:0;-webkit-user-select:text;-webkit-touch-callout:default;padding:8px;border:1px solid #879cc8;border-radius:8px;color:var(--paper);
  background:#1a2a4b;user-select:text;font:inherit;font-size:12px;pointer-events:auto;touch-action:manipulation}
.action[aria-busy=true] {filter:brightness(.78);cursor:progress}

/* Daily events and the trophy cabinet share the compact arcade controls. */
.event-rack {width:min(100%,360px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.event-tile {position:relative;display:flex;align-items:center;justify-content:center;gap:5px;min-height:44px;padding:3px 3px 5px;
  --glyph-size:16px;border:1px solid #80a1d377;border-radius:10px;background:var(--grain),linear-gradient(#3a5482,#233959);
  box-shadow:var(--blue-depth);font-size:clamp(10px,calc(var(--u)*3.15),15px);line-height:1.12}
.event-tile .glyph {color:#addceb}.event-tile.trophy .glyph {color:#ffdc8b}.event-tile.wheel .glyph {color:#e2c2fc}
.event-tile .event-dot {position:absolute;top:-3px;right:0;min-width:10px;height:10px;border:1px solid #ffeac0;border-radius:12px;
  background:#ffc356;box-shadow:0 1px 4px #1b2641;color:#492718}
.event-tile .event-dot.count {height:17px;padding:0 4px;display:grid;place-items:center;font-size:9px;font-weight:900}
.event-screen {background:linear-gradient(175deg,#243a62fa,#111e39fc 75%);--rim:#6987b7a0}
.event-screen .topbar {flex:none;grid-template-columns:minmax(44px,1fr) auto minmax(44px,1fr)}
.event-screen .topbar .ttl {font-size:clamp(17px,calc(var(--u)*5.75),29px)}
.achievement-summary {display:grid;gap:8px;margin-bottom:12px;padding:12px 13px}
.achievement-summary-head {display:flex;align-items:center;gap:7px;color:#fff0ba;font-size:14px;--glyph-size:18px}
.achievement-summary-head>b {margin-left:auto;font-variant-numeric:tabular-nums;color:#f6f8ff}
.achievement-filters {display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:2px}
.achievement-filters button {min-height:42px;display:flex;align-items:center;justify-content:center;gap:6px;padding:3px 5px;--glyph-size:16px}
.achievement-list {display:grid;gap:9px}
.achievement-card {min-width:0;display:grid;grid-template-columns:37px minmax(0,1fr) auto;align-items:start;gap:9px;padding:11px 9px;
  border-radius:12px;background:var(--grain),linear-gradient(#2f476f,#233657);border:1px solid #7895ce54;box-shadow:inset 0 1px 0 #b3ccf522}
.achievement-card.ready {border-color:#ffc97cbd;background:var(--grain),linear-gradient(#514937,#293853)}
.achievement-card.mythic {border-color:#ae92ed8c;background:var(--grain),linear-gradient(130deg,#4c3c72,#273b61)}
.achievement-card.mythic.ready {border-color:#ffd78f}
.achievement-card .medal-icon {width:37px;height:37px;display:grid;place-items:center;border-radius:10px;color:#b6cde9;
  background:var(--well);border:1px solid #8da8d468;--glyph-size:20px}
.achievement-card:is(.ready,.claimed) .medal-icon {background:#665025;color:#ffe5a1;border-color:#e6b86b93}
.achievement-card.mythic .medal-icon {color:#e9d8ff;background:#3a2c65;border-color:#bd9af0ac}
.achievement-detail {min-width:0;display:grid;gap:6px}
.achievement-detail h3 {margin:0;font-size:clamp(13px,calc(var(--u)*4.15),18px);line-height:1.2}
.achievement-goal {display:grid;gap:3px;font-size:clamp(10px,calc(var(--u)*3.05),13px);color:#c3d5ed}
.achievement-goal>span {display:flex;justify-content:space-between;gap:5px;align-items:baseline}
.achievement-goal b {color:#eeedfa;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.meter {height:5px;overflow:hidden;border-radius:4px;background:#121f3c;box-shadow:inset 0 1px 0 #0b1933}
.meter>i {display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#69b3cf,#99ebd9)}
.ready .meter>i,.claimed .meter>i {background:var(--gold)}
.achievement-reward {display:flex;align-items:center;gap:5px;min-width:0;min-height:23px;color:#ffe0a0;font-size:clamp(10px,calc(var(--u)*3.3),14px);--glyph-size:14px}
button.achievement-reward {text-align:left;justify-self:start;border-radius:4px}
.achievement-cta {min-height:42px;padding:4px 7px;line-height:1.17;border-radius:8px;min-width:44px;font-size:clamp(10px,calc(var(--u)*3.3),14px);
  display:flex;align-items:center;justify-content:center;gap:4px;--glyph-size:15px}
.achievement-cta.claim {background:var(--grain),var(--gold);color:var(--gold-ink);border:1px solid #ffdf93;box-shadow:var(--gold-depth)}
.achievement-cta.shared {color:#d5e7ff;border:1px solid #6c84ad;background:var(--blue);box-shadow:var(--blue-depth)}
.achievement-cta.is-locked {color:#a6b9d6}
.event-screen .share-url {margin-top:10px}
@container(max-width:315px) {
  .achievement-card {grid-template-columns:30px minmax(0,1fr) auto;gap:7px;padding-inline:7px}
  .achievement-card .medal-icon {width:30px;height:33px;--glyph-size:18px}
  .event-tile {--glyph-size:14px;gap:3px}
}
:is(#scr-daily-challenge,#scr-daily-result) {align-items:center;justify-content:center;padding:var(--safe-top) var(--gutter) var(--safe-bottom)}
.dialog-head.daily-event {background:var(--grain),radial-gradient(ellipse at 50% 0%,#457992,#2d4b78 78%)}
.dialog-head.daily-event .dialog-medal {color:#ffecaf;border-color:#e2ca97;background:var(--grain),linear-gradient(#5d6d82,#354c68)}
.daily-prizes {display:grid;grid-template-columns:1fr 1fr;gap:7px}
.daily-prize {display:grid;align-content:center;justify-items:center;gap:3px;min-height:58px;padding:5px 3px;border-radius:9px;
  border:1px solid #7797bc80;background:var(--grain),var(--well);font-size:11px;color:#c6d8f4}
.daily-prize strong {display:flex;align-items:center;gap:4px;--glyph-size:16px;font-size:18px;color:#ffe5a3;line-height:1.15}
.daily-objective {display:grid;gap:5px;text-align:center;padding:8px;border-radius:9px;background:#162c47;border:1px solid #759ac072}
.daily-objective>strong {font-size:clamp(14px,calc(var(--u)*4.6),20px);color:#fff0c7}
.daily-objective>small,.rule-line {font-size:clamp(10px,calc(var(--u)*3.15),13px);color:#c3d5f3}
.daily-best {text-align:center;font-size:13px;color:#a8e5d8}
.rule-line {text-align:center}
.daily-hud {position:absolute;top:calc(var(--safe-top) + 49px);left:50%;translate:-50% 0;display:flex;align-items:center;justify-content:center;gap:6px;
  width:max-content;max-width:92%;padding:4px 9px;border:1px solid #9cadd394;border-radius:8px;background:#172844ef;
  --glyph-size:15px;font-size:clamp(10px,calc(var(--u)*3.45),14px);color:#f4e2b9}
.daily-hud b {font-variant-numeric:tabular-nums;color:#fff2c8;min-width:3em;text-align:center}
.daily-hud.done {border-color:#8adbb1;background:#174544;color:#b5f5d2}
#stage[data-run=daily] :is(.hudcoin,#power-button) {display:none}
#scr-wheel {background:radial-gradient(ellipse at 50% 27%,#614468,#302d50 44%,#161c36 86%);--rim:#b6a0cb75}
.wheel-body {display:grid;align-content:start;justify-items:center;gap:clamp(10px,2.1dvh,19px);padding-top:clamp(25px,5dvh,46px)}
.wheel-assembly {position:relative;isolation:isolate;width:min(96%,354px,50dvh);aspect-ratio:1;padding:11px;margin:0 auto 5px;border-radius:50%;
  border:1px solid #ffebba;background:var(--grain),conic-gradient(from 17deg,#b27140,#ffe5ab,#a65937,#f6c784,#8a4f36,#ffe5ab,#b27140);
  box-shadow:inset 0 0 0 2px #fff1be9c,inset 0 0 0 7px #58312670,0 5px 0 #683e42,0 8px 0 #35243c,0 17px 28px #151329a3}
.wheel-assembly::before {content:"";position:absolute;z-index:-1;inset:auto -9% -23px;height:18%;border-radius:50%;
  background:radial-gradient(ellipse,#101125db,#10112569 52%,transparent 72%)}
.wheel-disc {position:relative;isolation:isolate;width:100%;height:100%;border-radius:50%;border:1px solid #764538;overflow:hidden;
  background:var(--grain),radial-gradient(circle,#fff2bb1c,#17213629 65%,#1513267a),
    repeating-conic-gradient(from -22.5deg,#ffdd9d8c 0 .45deg,transparent .5deg 44.55deg,#12182993 44.6deg 45deg),var(--sectors);
  box-shadow:inset 0 0 0 4px #2a193c5c;transform:rotate(var(--wheel-angle))}
.wheel-body:is([data-phase=spin],[data-phase=coast],[data-phase=linger]) .wheel-disc {will-change:transform}
.wheel-disc::after {content:"";position:absolute;inset:8%;border:1px solid #ffe4b632;border-radius:50%;pointer-events:none}
.wheel-wedge-light {position:absolute;inset:0;background:conic-gradient(from -22.5deg,#fff5c263 0 45deg,transparent 45deg);
  transform:rotate(var(--wheel-focus));opacity:.34;
  mask-image:radial-gradient(circle,transparent 17%,#000 46%,#000 95%);transition:opacity .2s;pointer-events:none}
.wheel-body[data-phase=spin] .wheel-wedge-light {opacity:0}
.wheel-body[data-phase=coast] .wheel-wedge-light {opacity:.65}
.wheel-body[data-phase=linger] .wheel-wedge-light {opacity:.91}
.wheel-body:is([data-phase=settled],[data-phase=won]) .wheel-wedge-light {animation:wheel-selected .62s ease-out both}
@keyframes wheel-selected {0%,26%{opacity:1}100%{opacity:.64}}
.wheel-stud,.wheel-piece {position:absolute;left:var(--left);top:var(--top);translate:-50% -50%}
.wheel-stud {width:5px;height:5px;border-radius:50%;background:radial-gradient(circle at 38% 28%,#fff5c9,#ffcb83 46%,#9b5f43 80%);
  box-shadow:0 1px 2px #231729}
.wheel-piece {z-index:1;display:grid;justify-items:center;gap:3px;--glyph-size:clamp(14px,calc(var(--u)*5.75),24px);
  font-size:clamp(9px,calc(var(--u)*3.4),15px);line-height:1.12;white-space:nowrap;
  color:#fff8e6;text-shadow:0 1px 2px #160f23,0 2px 3px #160f23a0;font-weight:850;rotate:calc(0deg - var(--wheel-angle))}
.wheel-piece .glyph {color:var(--prize-metal);filter:drop-shadow(0 1px 1px #211526)}
.wheel-piece .glyph svg {stroke-width:1.75}
.wheel-piece.active {color:#fff8df}
.wheel-crown {position:absolute;z-index:3;top:-18px;left:50%;translate:-50% 0;width:56px;height:22px;border:1px solid #ffefbd;
  border-radius:11px 11px 7px 7px;background:var(--grain),linear-gradient(#fff0bd,#e3ad69 60%,#ae6944);
  box-shadow:inset 0 2px #fff2cb,0 4px 6px #2c1b32}
.wheel-crown::before {content:"";position:absolute;inset:5px 17px 7px;border-radius:10px;background:#573850;
  box-shadow:inset 0 1px 2px #392642}
.wheel-lamp {position:absolute;inset:5px 17px 7px;border-radius:10px;background:var(--wheel-accent,#ffdd9e);
  box-shadow:0 0 13px 2px var(--wheel-accent,#ffdd9e);opacity:.18;transition:opacity .2s}
.wheel-body[data-phase=coast] .wheel-lamp {opacity:.58}
.wheel-body:is([data-phase=linger],[data-phase=settled],[data-phase=won]) .wheel-lamp {opacity:1}
.wheel-pointer {position:absolute;top:14px;left:50%;translate:-50% 0;width:27px;height:30px;transform-origin:50% 10%;
  background:linear-gradient(110deg,#ab663b,#ffda83 26%,#fff1bd 48%,#e9a755 65%,#8e4b32);clip-path:polygon(6% 0,94% 0,100% 33%,50% 100%,0 33%)}
.wheel-hub {position:absolute;z-index:2;left:50%;top:50%;translate:-50% -50%;width:24%;aspect-ratio:1;display:grid;place-items:center;border-radius:50%;
  --glyph-size:44%;border:1px solid #ffeac2;color:#fff4bd;background:radial-gradient(circle,#4a3a59 36%,#23233d 61%,#e4aa6d 63%,#fff0ad 68%,#a35937 74%);
  box-shadow:0 3px 7px #18152baf,inset 0 0 0 2px #ffe4a491}
.wheel-hub::after {content:"";position:absolute;inset:11%;border-radius:50%;border:1px solid var(--wheel-accent,#ffdd9e);opacity:.38}
.wheel-body[data-phase=spin] .wheel-hub::after {animation:wheel-hub .65s ease-in-out alternate infinite}
.wheel-body:is([data-phase=settled],[data-phase=won]) .wheel-hub::after {animation:wheel-hub-burst .55s ease-out both}
@keyframes wheel-hub {to{opacity:1;scale:1.17}}
@keyframes wheel-hub-burst {from{opacity:1;scale:.8}to{opacity:0;scale:2.25}}
.wheel-receipt {position:relative;width:min(100%,354px);min-height:62px;display:grid;place-content:center;justify-items:center;gap:3px;padding:7px 27px;
  text-align:center;border:1px solid #c4a17c69;border-radius:13px;overflow:hidden;background:var(--grain),linear-gradient(#2a2341,#201d35);
  box-shadow:inset 0 2px 6px #1816298a,0 3px 0 #1b182e}
.wheel-receipt::before,.wheel-receipt::after {content:"";position:absolute;top:50%;width:6px;height:6px;
  background:var(--wheel-accent,#f1c293);translate:0 -50%;rotate:45deg;opacity:.45}
.wheel-receipt::before {left:14px}.wheel-receipt::after {right:14px}
.wheel-receipt small {font-size:11px;color:#dccde5;line-height:1.25}
.wheel-readout {display:flex;align-items:center;justify-content:center;gap:6px;font-size:clamp(14px,calc(var(--u)*5),21px);line-height:1.2;
  font-variant-numeric:tabular-nums;color:var(--wheel-accent,#ffe3ab);min-height:1.2em}
.wheel-readout>.glyph {--glyph-size:19px}
.wheel-readout.payout {animation:wheel-payout .52s cubic-bezier(.17,.76,.26,1.14) both}
@keyframes wheel-payout {0%{opacity:.25;scale:.84;translate:0 6px}56%{scale:1.11}100%{opacity:1;scale:1;translate:0}}
.wheel-idle-dots {display:flex;gap:8px;opacity:.56}
.wheel-idle-dots i {width:5px;height:5px;border-radius:50%;background:#f0c799}
.wheel-body[data-phase=spin] .wheel-idle-dots i {animation:wheel-dots .7s ease-in-out infinite alternate}
.wheel-body[data-phase=spin] .wheel-idle-dots i:nth-child(2) {animation-delay:.15s}
.wheel-body[data-phase=spin] .wheel-idle-dots i:nth-child(3) {animation-delay:.3s}
@keyframes wheel-dots {from{opacity:.25}to{opacity:1}}
.wheel-actions {display:grid;gap:8px;width:min(100%,354px)}
.wheel-actions [aria-busy=true] {filter:saturate(.55) brightness(.85)}
:is(#scr-notice,#scr-trial-pin,#scr-trial-settings) {align-items:center;justify-content:center;padding:var(--safe-top) var(--gutter) var(--safe-bottom)}
#scr-notice {z-index:8}
.dialog-head.warning {background:var(--grain),radial-gradient(ellipse at 50% 0%,#916244,#4c4160 84%)}
.dialog-head.warning .dialog-medal {color:#ffe2a4;border-color:#e9af7f}
.notice-detail {min-height:24px;line-height:1.5;text-align:center;color:#e3ebf9;font-size:14px}
.notice-detail b {color:#ffe39b;font-variant-numeric:tabular-nums}
.notice-buttons {display:grid;gap:8px}
.notice-buttons.two {grid-template-columns:1fr 1fr}

const BLADE_STATIONS=new Map();
function bladeStations(shape){
  if(BLADE_STATIONS.has(shape))return BLADE_STATIONS.get(shape);
  const outline=BLADES[shape],xs=[...new Set([...outline.map(p=>p[0]),.22,.65,1.18])].sort((a,b)=>a-b);
  const stations=xs.map(x=>{
    const ys=[];
    for(let i=0;i<outline.length;i++){
      const a=outline[i],b=outline[(i+1)%outline.length];
      if(a[0]===b[0]){if(a[0]===x)ys.push(a[1],b[1]);continue;}
      const f=(x-a[0])/(b[0]-a[0]);if(f>=0&&f<=1)ys.push(lerp(a[1],b[1],f));
    }
    return [x,Math.min(...ys),Math.max(...ys)];
  });
  BLADE_STATIONS.set(shape,stations);return stations;
}

    if(type==='pencils')prop.n=5+Math.floor(rn()*4);

    if (!B.plan) {
      B.plan = planHop(K, G.W, { quick:G.demo }) || { delay: 0, tau: null };
      const p = padAt(G.W,K.sp), beat = (p.crum || nextHasMover(G.W, K.sp) || B.plan.delay > 0) ? 0 : 0.3;

    case 'respawn': tone('sine', 260, 900, t, 0.3, 0.2); tone('triangle', 520, 1500, t + 0.05, 0.25, 0.1); break;
    case 'checkpoint': [0, 5, 9, 14].forEach((s, i) => tone('triangle', NOTE(67 + s), NOTE(67 + s), t + i * 0.07, 0.26, 0.2)); break;

      break;

    }

    case 'back': tone('triangle', 560, 420, t, 0.07, 0.16); break;

    case 'no': tone('square', 200, 150, t, 0.12, 0.12); break;
  }
}
/* ---- music: slow pentatonic arpeggio over a 4-chord loop, root depends on the world ---- */
const M_CH = [[0,4,7,11],[9,12,16,19],[5,9,12,16],[7,11,14,17]];
const MELODY = [2,-1,1,-1,3,2,-1,-1,1,-1,0,2,-1,1,-1,-1];
function musicTick() {
  const c = AUD.ctx; if (!c || !AUD.music) return;
  const bench=UI.screen==='shop',beat=60/(bench?82:G.idx===9&&!G.demo?120:100+AUD.world*2)/2;                                   // eighth notes
  if (AUD.mNext < c.currentTime - 0.2) AUD.mNext = c.currentTime + 0.05;   // after a pause / toggle: don't replay the missed beats in one burst
  while (AUD.mNext < c.currentTime + 0.25) {
    const t = Math.max(AUD.mNext, c.currentTime), s = AUD.mStep, ch = M_CH[(s >> 4) & 3], root = 55 + AUD.world * 2;
    const phase = s & 15, offset = (s & 1) * beat * 0.065;
    const pitch = NOTE(root + 12 + ch[[0,1,2,1,3,2,1,2][s & 7]]);
    if(bench){
      if(phase%4===0){
        tone('sine',pitch,pitch,t,beat*2.8,.20,AUD.musG);
        tone('triangle',pitch*2.01,pitch*2,t+.012,beat*.62,.052,AUD.musG);
        tone('sine',pitch*1.5,pitch*1.5,t+beat*.72,beat*1.8,.065,AUD.musG);
      }
      AUD.mNext+=beat;AUD.mStep++;continue;
    }
    if(phase%4!==3){
      tone('triangle',pitch,pitch,t+offset,beat*1.45,phase%4?.095:.15,AUD.musG);
      tone('sine',pitch*2.005,pitch*2,t+offset+.009,beat*.65,.038,AUD.musG);
    }
    if (phase % 4 === 0) {
      const bass = NOTE(root - 12 + ch[phase === 12 ? 2 : 0]);
      tone('sine',bass,bass,t,beat*2.7,.33,AUD.musG);
      tone('sine',78,41,t,.11,.18,AUD.musG);
    }
    if (phase % 4 === 2) noiseBurst(t+offset,.052,.047,3000,1600,.65,'bandpass',AUD.musG);
    const note = MELODY[(phase + ((s >> 4) & 1)*4) % 16];
    if (note >= 0 && ((s >> 4) & 1 || phase < 9)) {
      const lead = NOTE(root+24+ch[note]);
      tone('sine',lead,lead,t+offset,beat*1.9,.115,AUD.musG);
      tone('sine',lead*2,lead*2,t+offset+.055,beat*.7,.022,AUD.musG);
    }
    AUD.mNext += beat; AUD.mStep++;
  }
}
function musicStart(world) {
  AUD.world = world || 0; if (!AUD.ctx || AUD.mTimer) return;
  AUD.mNext = AUD.ctx.currentTime + 0.1; AUD.mStep = 0; AUD.mTimer = setInterval(musicTick, 90); audApply();
}
function musicStop() { if (AUD.mTimer) { clearInterval(AUD.mTimer); AUD.mTimer = 0; } }

function endlessQuota(today=calendarDay()){
  let quota=TRIAL.base?TRIAL.quota:endlessQuotaCache;

function duelDay(id){

  const hex=()=>newEndlessSeed().toString(16).padStart(8,'0');

  if(score===undefined||score===null){

  if(q.shares.includes(id)||q.shares.length>=ENDLESS_DAILY_SHARE_LIMIT)return {...card,kind:'claimed'};

async function startEndless(){

  const view=UI.view;
  try{
    return await withEndlessQuota(()=>{
      if(UI.screen!=='endless'||UI.view!==view)return false;
      const quota=endlessQuota();
      if(!endlessRemaining(quota)){renderEndless();return false;}

      Game.start(0,{endlessSeed:newEndlessSeed()});
      quota.started++;saveEndlessQuota(quota);
      enterRun('endless');
      return true;
    });
  }finally{UI.endlessStarting=false;}
}

function settleFrenzy(f,day=calendarDay()){
  if(f.result)return f.result;
  const record=SAVE.frenzy,full=frenzyFullLeft(day)>0;
  const amount=clamp(f.coins+Math.floor(f.score/30),20,280);
  const earned=full?amount:Math.max(10,Math.floor(amount*.3));
  const newBest=f.score>record.bestScore;
  if(day!==record.day){record.day=day;record.runsToday=0;}
  record.runsToday++;record.bestScore=Math.max(record.bestScore,f.score);
  record.bestCombo=Math.max(record.bestCombo,f.maxCombo);record.totalSlices+=f.slices;
  SAVE.progression.cuts+=f.slices;SAVE.progression.fruit+=f.fruit;SAVE.coins+=earned;
  f.result={score:f.score,combo:f.maxCombo,slices:f.slices,best:record.bestScore,newBest,earned,full,reply:completeDuel(f)};
  saveWrite();return f.result;
}
function finishFrenzy(f){
  if(f.settled)return;
  f.settled=true;G.mode='frenzy-result';

    UI.frenzyResult=result;showScreen('frenzy-result');announceAchievements(before);sfx('star');

}

function updateFrenzyHud(f){
  const h=f.hud;if(!h)return;
  const write=(el,value)=>{if(el.textContent!==value)el.textContent=value;},hot=f.feverLeft>0,ice=f.freezeLeft>0;
  write(h.time,(Math.ceil(f.timeLeft*10)/10).toFixed(1)+'s');
  h.clock.classList.toggle('urgent',f.timeLeft<=10);h.clock.classList.toggle('icy',ice);h.clock.classList.toggle('hot',hot);
  const fill=hot?Math.ceil(f.feverLeft/6*100):f.fever;
  if(h.lastFill!==fill){h.fill.style.transform='scaleX('+fill/100+')';h.lastFill=fill;}
  write(h.energy,tr(hot?'frenzyFever':'frenzyEnergy'));
  write(h.score,String(f.score));write(h.coins,String(f.coins));
  write(h.combo,(f.combo?tr('frenzyCombo',{n:f.combo})+' · ':'')+'×'+frenzyMultiplier(f.combo));
  const effects=(ice?tr('frenzyFreeze'):'')+(ice&&f.rainLeft>0?' · ':'')+(f.rainLeft>0?tr('frenzyRain'):'');
  write(h.effects,effects);h.hint.classList.toggle('hidden',f.tapped||f.elapsed>=2);

function prepareDailySettlement(reached){
  if(G.dailySettlement)return G.dailySettlement;
  const spec=G.dailyChallenge,knife=G.K,score=dailyRunScore(spec,G.fin?.elapsed??dailyElapsed());
  const won=reached&&(spec.id==='sprint'?score<=spec.goal*1000:score>=spec.goal);
  const before=achievementReadyCount();
  const summary={spec,score,won,reached,reason:knife.why};
  const pending=withRewardSave(()=>{
    if(G.K===knife)bankRunProgress();
    return settleDailyChallenge(spec,summary);
  });
  G.dailySettlement={pending,knife,before};return G.dailySettlement;

function markWheelSector(disc,sector){
  disc.querySelector('.wheel-piece.active')?.classList.remove('active');
  disc.querySelectorAll('.wheel-piece')[sector].classList.add('active');

const WHEEL_COAST=2480,WHEEL_LINGER=3180,WHEEL_DURATION=4570;
function wheelMotion(previous,result){
  const start=wheelStop(previous),end=wheelStop(result)+4*360,span=end-start;
  // Time, angle and angular velocity. The closing stages are tied to physical wedge boundaries.
  return [[0,start,0],[620,start+span*.145,span*.000464],[1440,start+span*.53,span*.000450],
    [WHEEL_COAST,end-108,.124],[WHEEL_LINGER,end-44,.064],[3720,end-21,.034],[WHEEL_DURATION,end,0]];
}
function wheelAngleAt(motion,ms){
  let i=1;
  while(i<motion.length-1&&ms>motion[i][0])i++;

async function playWheel(){

function usePocketPower(id){

// Search with the same fixed physics steps that will consume the inputs. Backtrack if a
// good landing would leave the following platform unreachable. Yield to painting while planning.
function* courseInputs(knife,world,pace=Math.random){
  if(knife.mode==='done')return [];
  const pad=padAt(world,knife.sp);
  const moving=pad.mv||world.pl.slice(knife.sp+1,knife.sp+3).some(p=>p.mv);
  // Let the blade finish a cut after landing; moving and crumbling pads also allow immediate launch.
  const restTicks=knife.sp>0&&!moving&&!pad.crum?18:0;
  // A quick takeoff is common, with occasional pauses up to about 2.6 seconds.
  const delays=new Set();
  if(pace)delays.add(Math.round(3+310*pace()**2.4));
  for(let delay=restTicks;delay<=(moving?420:restTicks);delay+=15)delays.add(delay);
  for(const delay of delays){
    const ready=cloneKnife(knife);
    for(let tick=0;tick<delay&&ready.mode==='stuck';tick++)stepKnife(ready,PHYS.DT,world,false);
    if(ready.mode!=='stuck')continue;
    const candidates=[];
    for(let boost=-1;boost<=100;boost+=2){
      if((boost+1)%16===0)yield;
      const tau=boost<0?null:boost*PHYS.DT-1e-10;
      const hop=simHop(ready,world,0,tau,3);
      if(!hop.ok)continue;
      const end=hop.K,finished=end.mode==='done';
      if(!finished&&end.sp<=knife.sp)continue;
      // Prefer a central landing on the next pad so the blade passes through its targets.
      const skipped=end.sp-knife.sp-1;
      const score=finished?1000+end.mult:end.ev.at(-1).rating-skipped
        -3*Math.abs(end.sx-padAt(world,end.sp).land)+Math.min(1,hopMargin(end,world));
      candidates.push({end,boost,score});
    }
    candidates.sort((a,b)=>b.score-a.score);
    const seen=new Set();
    for(const {end,boost} of candidates){
      const landing=[end.sp,Math.round(end.sx*8),Math.round(end.lean*5),Math.round(end.t*8)].join('/');
      if(seen.has(landing))continue;
      seen.add(landing);
      const rest=yield* courseInputs(end,world,pace);
      if(rest){
        const launch=Math.round(knife.t/PHYS.DT)+delay;
        return boost<0?[launch,...rest]:[launch,launch+1+boost,...rest];
      }
    }
  }
  return null;
}
// Replay the winning taps to find takeoffs where a missed or mistimed boost really fails.
function* webRoundInputs(knife,world,randomOutcome,random=Math.random){
  const search=courseInputs(knife,world);
  let route;
  // Bound randomized backtracking on awkward moving platforms; keep the proven fallback.
  for(let slice=0;slice<2400;slice++){
    const part=search.next();
    if(part.done){route=part.value;break;}
    yield;
  }
  if(!route)route=yield* courseInputs(knife,world,null);
  if(!route||!randomOutcome||random()<.78)return route;
  const taps=new Set(route), launches=[];
  const replay=cloneKnife(knife);
  for(let tick=Math.round(replay.t/PHYS.DT);tick<=route.at(-1);tick++){
    if(taps.has(tick)&&replay.mode==='stuck')launches.push({tick,knife:cloneKnife(replay)});
    stepKnife(replay,PHYS.DT,world,taps.has(tick));
    if(tick%120===0)yield;
  }
  const first=Math.floor(random()*launches.length);
  for(let i=0;i<launches.length;i++){
    const launch=launches[(first+i)%launches.length];
    const boosts=[null,8,20,40,65,95];
    const offset=Math.floor(random()*boosts.length);
    for(let j=0;j<boosts.length;j++){
      yield;
      const boost=boosts[(offset+j)%boosts.length];
      const trial=cloneKnife(launch.knife);
      stepKnife(trial,PHYS.DT,world,true);
      for(let t=0;trial.mode==='air'||trial.mode==='slip';t++){
        stepKnife(trial,PHYS.DT,world,t===boost);
      }
      if(trial.mode==='dead'){
        const inputs=route.filter(t=>t<launch.tick);
        inputs.push(launch.tick);
        if(boost!==null)inputs.push(launch.tick+1+boost);
        return inputs;
      }
    }
  }
  return route;
}
function planWebCourse(){
  let world=G.W;
  // The animated bands exchange rewards before the final impact.
  if(world.tower.change){
    const {a,b}=world.tower.change,blocks=world.tower.blocks.map(block=>({...block}));
    [blocks[a].m,blocks[b].m]=[blocks[b].m,blocks[a].m];
    world={...world,tower:{...world.tower,blocks}};
  }
  webAuto.inputs=null;webAuto.resultTime=0;
  webAuto.search=webRoundInputs(cloneKnife(G.K),world,SAVE.opts.randomOutcome===true);
}
function webCourseReady(){
  if(!webAuto.search)return true;
  const deadline=performance.now()+Math.min(6,MAIN.refreshMs*.35);
  do{
    const part=webAuto.search.next();
    if(part.done){
      webAuto.search=null;
      if(part.value){webAuto.inputs=new Set(part.value);return true;}
      clearWebAuto();Game.pause();showScreen('pause');
      toast(LANG==='zh'?'当前装备未找到通关路线':'No route found for this loadout');
      return false;
    }
  }while(performance.now()<deadline);
  return false;
}

  if (name !== 'shop') shopDraw.theme = -1;

  if (name === 'shop') {
    UI.shopGrid=false;UI.shopFromGrid=false;UI.shopScroll=0;UI.sampleIndex=-1;
    selectWeapon(weaponIndex??Math.max(0,KNIVES.findIndex(k=>k.id===SAVE.knife)),false);

  if(name==='achievements')renderAchievements(achievementId);
  if(name==='daily-challenge')renderDailyChallenge();

      const prize = claimDaily(); renderSupplies();

    case 'carry': case 'buySupply': case 'adSupply': {

const BENCH = { top:-.27, socket:.86, flight:.97, pause:.73, sink:.115 };
let benchMesh, horizonMesh;
function buildWorkbench() {

  const cyl=(a,b,r0,r1,c)=>hPrism({axis:'y',a,b,r0,r1,seg:n,col:c});
  const top=BENCH.top, h=[cyl(-7,top-.08,1.63,1.98,bark),cyl(top-.09,top,1.98,1.91,wood)];
  const face=h[0].polys;
  for(let i=0;i<n;i++){
    const q=face[i]; for(let j=0;j<4;j++){
      q[j*PS+10]=(130+(j<2?0:60))/1024;q[j*PS+11]=(962+(j===0||j===3?0:60))/1024;
    }
  }
  for(let i=0;i<n;i++) {
    const shade=.89+.065*Math.sin(i*2.8)+.052*Math.cos(i);
    bandShade(face[i],shade*1.13,shade*.63);
  }
  h.push(cyl(top-.61,top-.49,1.982,1.982,iron),cyl(top-.495,top-.475,1.984,1.984,hexc('#9ba9b2')));
  for (let i=0;i<n;i+=3) {

    h.push(hSphere(.041,4,7,hexc('#c5cdd5'),null,iron,1.978*Math.cos(a),top-.55,1.978*Math.sin(a)));
  }
  const grain=[];
  for(let j=1;j<=10;j++) {
    const r=j*.165;
    for(let i=0;i<48;i++){
      const p=(k,dr)=>{const a=k*TAU/48, rad=r*(1+.03*Math.sin(3*a+j*.06)+.025*Math.sin(5*a))+dr;
        return [-.13+rad*Math.cos(a),top+.004,.06+rad*Math.sin(a)*.94];};
      grain.push(mkPoly([p(i,0),p(i+1,0),p(i+1,.011),p(i,.011)],[0,1,0],hexc(j%3?'#cd9c85':'#be8d79')));
    }
  }

    grain.push(mkPoly([[x-.15,top+.008,-.016],[x+.18,top+.008,-.036],[x+.06,top+.008,.020],[x-.10,top+.008,.028]],[0,1,0],hexc('#74503b')));

function benchPose(s) {
  const dir=-s.side, u=s.phase==='ready'?0:s.phase==='flight'?clamp(s.t/BENCH.flight,0,1):1;
  const lean=.23, start=-Math.PI/2+dir*lean, end=-Math.PI/2-dir*lean;

  const sx=lerp(s.side*BENCH.socket,dir*BENCH.socket,sstep(.035,.64,u));

function queueSampleContacts(s,old,pose,weapon){

      p.y+b[3]<Math.min(old.y,pose.y)-reach||p.y+b[1]>Math.max(old.y,pose.y)+reach)continue;

function updateSample(dt) {

    if(s.phase==='flight'){
      const old=benchPose(s);
      s.t=Math.min(s.t+step,BENCH.flight);
      const pose=benchPose(s);
      queueSampleContacts(s,old,pose,weapon);
      if(s.t>BENCH.flight*.7&&pose.y+KNIFE_TIP*Math.sin(pose.a)<=BENCH.top){

        p.x*p.x+p.z*p.z>(1.91+p.rad)**2)continue;

const PARAMS = (() => { try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(''); } })();
const MAIN = {
  cv: null, fx: null, fctx: null, fd: 1, last: 0, qScale: 1, lowN: 0, fastN: 0, accT: 0, accN: 0, errs: 0, errT: 0, clearedFx: false, lastL: null, dead: false,

/* ---------------- layout: a centred portrait stage; canvases scale with devicePixelRatio and the quality setting ---------------- */
function layout() {
  MAIN.frozenView=-1;
  const iw = window.innerWidth || document.documentElement.clientWidth || 360, ih = window.innerHeight || document.documentElement.clientHeight || 640;
  const sw = Math.round(Math.max(180, Math.min(iw, ih * 0.62))), sh = Math.max(240, ih);
  const st = UI.stage; st.style.width = sw + 'px'; st.style.height = sh + 'px';
  document.documentElement.style.setProperty('--u', (sw / 100) + 'px');
  UI.w = sw; UI.h = sh;
  if (!MAIN.cv) return;
  const nat = window.devicePixelRatio || 1, q = SAVE.opts.q | 0;
  const normal=Math.min(nat,q===1?2:1.65);
  let dpr=q===2?Math.min(1,normal):q===1?normal:normal*MAIN.qScale;
  const maxPix=q===1?2200000:1400000;
  if (sw * sh * dpr * dpr > maxPix) dpr = Math.sqrt(maxPix / (sw * sh));
  dpr = Math.max(0.65, dpr);
  GFX.resize(sw, sh, dpr);
  MAIN.fd = Math.min(dpr, 1.5);
  MAIN.fx.width = Math.round(sw * MAIN.fd); MAIN.fx.height = Math.round(sh * MAIN.fd);
  MAIN.fctx.setTransform(MAIN.fd, 0, 0, MAIN.fd, 0, 0);
  UI.q = dpr;
}

/* ---------------- input ---------------- */
function bindInput() {
  const st = UI.stage;
  // A short tap must show its down state before an action replaces the whole screen.
  const minimumPress = 75, held = new Map(), states = new WeakMap();
  function press(el, id) {
    if (!el || held.has(id)) return;
    let state = states.get(el);
    if (!state) { state = { until:0, release:0, pending:false, down:0 }; states.set(el,state); }
    clearTimeout(state.release); state.swiped=false; state.until = performance.now() + minimumPress; state.down++;
    held.set(id,el); el.classList.add('is-pressed');
    if(el.dataset.act==='sampleRandom') UI.modelPressed=true;
    if (SAVE.opts.vib && navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(8);
  }
  function release(id, cancel = false) {
    const el = held.get(id); if (!el) return;
    held.delete(id);
    const state = states.get(el); if (--state.down > 0) return;
    clearTimeout(state.release);
    const lift=()=>{el.classList.remove('is-pressed'); if(el.dataset.act==='sampleRandom') UI.modelPressed=false;};
    if (cancel) { state.until=0; lift(); return; }
    state.release=setTimeout(lift, Math.max(0,state.until-performance.now()));
  }
  function activate(el) {
    if (!el) return;
    if (!states.has(el) || (!el.classList.contains('is-pressed') && !el.matches(':active'))) { press(el,'activation'); release('activation'); }
    const state = states.get(el);
    if (el.getAttribute('aria-disabled') === 'true' || el.disabled || state.pending) return;
    state.pending = true;
    const view = UI.view;
    const run = () => {
      state.pending = false;
      if (UI.view === view && el.isConnected && !el.closest('.screen.hidden') && el.getAttribute('aria-disabled') !== 'true') act(el.dataset.act,el.dataset);
    };
    const remaining = state.until - performance.now();
    const needsActivation=['shareEndless','copyEndlessLink','shareAchievement','shareDailyScore','shareFrenzyScore','replyDuel'].includes(el.dataset.act);
    if(remaining>0&&!needsActivation)setTimeout(run,remaining);else run();
  }
  const shortcut = action => activate(st.querySelector('.screen:not(.hidden) button[data-act="'+action+'"]'));
  st.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    audInit(); kickMusic();
    const button = e.target.closest?.('button[data-act]');
    if (button) {
      press(button,e.pointerId);
      if (button.dataset.act==='sampleRandom') MAIN.swipe={x:e.clientX,y:e.clientY,id:e.pointerId,button,done:false};
      return;
    }
    if(UI.notice)return;
    if (UI.screen === 'play') {
      e.preventDefault();
      if(G.frenzy){const rect=st.getBoundingClientRect();Game.tapFrenzy((e.clientX-rect.left)/rect.width,(e.clientY-rect.top)/rect.height);}
      else Game.tap();
    }
    else if (UI.screen === 'shop' && !UI.shopGrid) MAIN.swipe = { x:e.clientX,y:e.clientY,id:e.pointerId,done:false };
  }, { passive:false });
  st.addEventListener('pointerout', e => {
    const el = held.get(e.pointerId);
    if (el && !el.contains(e.relatedTarget)) release(e.pointerId,true);
  });
  window.addEventListener('pointerup', e => release(e.pointerId));
  window.addEventListener('pointercancel', e => release(e.pointerId,true));
  window.addEventListener('blur', () => { for (const id of held.keys()) release(id,true); });
  st.addEventListener('pointermove', (e) => {
    const s = MAIN.swipe; if (!s || s.done || e.pointerId !== s.id) return;
    const dx = e.clientX - s.x;
    if (Math.abs(dx)>UI.w*.12 && Math.abs(dx)>Math.abs(e.clientY-s.y)) {

    }
  });
  const endSwipe = () => { MAIN.swipe = null; };
  st.addEventListener('pointerup', endSwipe); st.addEventListener('pointercancel', endSwipe);
  st.addEventListener('click', (e) => {
    if(UI.screen==='daily-challenge' && !e.target.closest?.('.modal') && !UI.notice){act('cancelDaily');return;}
    const el = e.target.closest?.('button[data-act]');
    if (!el) return;
    e.preventDefault(); if(!states.get(el)?.swiped) activate(el);
  });
  window.addEventListener('keyup', e => release(e.code || e.key));
  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key, scr = UI.screen;
    audInit(); kickMusic();
    const focused = e.target.closest?.('button[data-act]');
    if (focused && !focused.closest('.screen.hidden') && (k === 'Enter' || k === ' ')) {
      if (e.repeat) e.preventDefault(); else press(focused,e.code || k);
      return;
    }
    if(UI.notice){
      if(k==='Escape'){e.preventDefault();shortcut('noticeClose');}
      return;
    }
    if(scr==='trial-pin'&&k==='Enter'){e.preventDefault();if(!e.repeat)shortcut('trialUnlock');return;}
    const tapKey = k === ' ' || k === 'Spacebar' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'Enter';
    if (tapKey) {
      if (scr === 'play') { e.preventDefault(); if (!e.repeat) Game.tap(); return; }
      if (e.repeat) return;
      if (k === 'Enter' || k === ' ') {
        if (scr === 'home') { e.preventDefault(); shortcut('play'); }
        else if (scr === 'pause') { e.preventDefault(); shortcut('resume'); }
        else if(scr==='fail'){e.preventDefault();shortcut(G.endless?'cashOutEndless':'retry');}
        else if(scr==='endless'){e.preventDefault();shortcut('startEndless');}
        else if(scr==='endless-result'){e.preventDefault();shortcut('endless');}
        else if(scr==='frenzy-result'){e.preventDefault();shortcut('startFrenzy');}
        else if(scr==='daily-challenge'||scr==='daily-result'){e.preventDefault();shortcut(scr==='daily-result'?'home':'startDailyChallenge');}
        else if(scr==='wheel'){e.preventDefault();shortcut('spinWheel');}
        else if (scr === 'result') { e.preventDefault(); shortcut($('#scr-result [data-act="next"]') ? 'next' : 'retry'); }
        else if (scr === 'shop') { e.preventDefault(); shortcut('sampleRandom'); }
      }
      return;
    }
    if (k === 'p' || k === 'P') { if (scr === 'play') shortcut('pause'); else if (scr === 'pause') shortcut('resume'); return; }
    if (k === 'Escape') {
      if (scr === 'play') shortcut('pause'); else if (scr === 'pause') shortcut('resume'); else if(scr==='powers')shortcut('powerBack');
      else if (scr === 'shop') shortcut('shopBack'); else if(scr==='settings')shortcut('settingsBack');
      else if(scr==='daily-challenge')shortcut('cancelDaily');
      else if(scr==='fail'&&G.endless)shortcut('cashOutEndless');
      else if((scr==='achievements'&&UI.achievementReturn==='shop')||(scr==='wheel'&&UI.wheelReturn==='shop'))shortcut('backToPrize');
      else if(['levels','supplies','fail','result','endless','endless-result','daily-result','frenzy-result',...EVENT_PAGES].includes(scr))shortcut('home');
      else if(scr==='trial-pin')shortcut('home');
      else if(scr==='trial-settings')shortcut('home');
      return;
    }
    if (scr === 'shop') { if (k === 'ArrowLeft') shortcut('kprev'); else if (k === 'ArrowRight') shortcut('knext'); }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { autoPause(); try { if (AUD.ctx) AUD.ctx.suspend(); } catch (e) { /* ignore */ } }
    else { audResume(); MAIN.last = performance.now(); }
  });
  window.addEventListener('blur', autoPause);
  window.addEventListener('pagehide', autoPause);
  window.addEventListener('storage',e=>{
    if(e.key===ENDLESS_QUOTA_KEY||e.key===null){endlessQuotaCache=null;refreshEndlessEntry();}
    if(e.key===SAVE_KEY&&e.newValue){
      saveLoad(false);
      if(UI.screen==='home')renderHome();
      else if(UI.screen==='achievements')renderAchievements();
      else if(UI.screen==='daily-challenge')renderDailyChallenge();
      else if(UI.screen==='wheel'&&!UI.wheelBusy)renderWheel();
      else if(UI.screen==='shop')renderShop();
    }
  });
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 250));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);

  /* keep the page itself still: no rubber-band scrolling, pinch zoom, long-press menus */
  document.addEventListener('touchmove', (e) => { if (!(e.target.closest && e.target.closest('.scroll, .modal'))) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('contextmenu',e=>{if(!e.target.closest?.('.share-url'))e.preventDefault();});
  MAIN.cv.addEventListener('webglcontextlost', e=>{
    e.preventDefault();
    MAIN.graphicsLost=true;
    autoPause();
    toast(tr('graphicsRestoring'));
  });
  MAIN.cv.addEventListener('webglcontextrestored', ()=>{
    try {
      if(!GFX.init(MAIN.cv,{pdb:PARAMS.has('pdb')}))throw new Error('WebGL restore');
      MAIN.graphicsLost=false;MAIN.last=performance.now();MAIN.errs=0;layout();
    }catch(error){console.error(error);showFatal(tr('graphicsUnavailable'));}
  });
}

/* ---------------- frame loop ---------------- */
function onFrameError(e) {
  try { console.error(e); } catch (_) { /* ignore */ }
  const now = performance.now(); if (now - MAIN.errT > 2000) MAIN.errs = 0; MAIN.errT = now; MAIN.errs++;
  if (MAIN.errs === 4 && UI.screen === 'play') { try { act('home'); } catch (_) { /* ignore */ } }
  if (MAIN.errs > 60) showFatal(LANG === 'zh' ? '出错了，请刷新页面重试。' : 'Something went wrong. Please reload the page.');
}
const webPrevPose={knife:null,t:0,mode:null,x:0,y:0,a:0};
const webRenderPose={x:0,y:0,a:0};
function recordWebKnife(k){
  const p=webPrevPose;
  p.knife=k;p.t=k.t;p.mode=k.mode;p.x=k.x;p.y=k.y;p.a=k.a;
}
function webKnifePose(k,remainder){
  const p=webPrevPose;
  if(p.knife!==k||p.mode!==k.mode||Math.abs(k.t-p.t-PHYS.DT)>1e-7)return k;
  const alpha=clamp(remainder/PHYS.DT,0,1);
  webRenderPose.x=lerp(p.x,k.x,alpha);
  webRenderPose.y=lerp(p.y,k.y,alpha);
  webRenderPose.a=lerp(p.a,k.a,alpha);
  return webRenderPose;
}
// Use the fastest sustained frame intervals to estimate the display cadence.
function observeRefresh(dt){
  const ms=dt*1000;
  if(ms<1||ms>50)return;
  MAIN.cadence.push(ms);
  if(MAIN.cadence.length<60)return;
  MAIN.cadence.sort((a,b)=>a-b);
  const interval=MAIN.cadence[8];
  MAIN.cadence.length=0;
  // Menus can recalibrate after moving between displays. A busy level may only
  // raise the target, so dropped frames do not become the new quality target.
  if(!MAIN.measuredRefresh||UI.screen!=='play'||interval<MAIN.refreshMs*.95){
    MAIN.refreshMs=interval;MAIN.measuredRefresh=true;
  }
}
function adaptQuality(dt) {
  if(MAIN.noadapt||SAVE.opts.q!==0||UI.screen!=='play'||document.hidden||dt<=0||dt>.12)return;
  MAIN.accT+=dt;MAIN.accN++;
  if(MAIN.accT<1.3)return;
  const ms=1000*MAIN.accT/MAIN.accN;
  MAIN.accT=MAIN.accN=0;UI.fps=1000/ms;
  MAIN.lowN=ms>MAIN.refreshMs*1.14?MAIN.lowN+1:0;MAIN.fastN=ms<MAIN.refreshMs*1.045?MAIN.fastN+1:0;
  let scale=MAIN.qScale;
  if(MAIN.lowN>=2){scale=Math.max(.6,scale-.12);MAIN.lowN=0;}
  if(MAIN.fastN>=10){scale=Math.min(1,scale+.06);MAIN.fastN=0;}
  if(scale!==MAIN.qScale){MAIN.qScale=scale;layout();}
}
function frame(now) {
  requestAnimationFrame(frame);
  if (MAIN.dead || MAIN.graphicsLost || document.hidden) return;
  let dt = (now - MAIN.last) / 1000; MAIN.last = now;
  observeRefresh(dt);
  if (!(dt > 0) || (dt > 0.25&&G.mode!=='frenzy')) dt = MAIN.refreshMs/1000;
  try {
    if (UI.screen === 'shop') {
      MAIN.frozenView=-1;
      if(!UI.shopGrid)shopDraw(dt);
      if (!MAIN.clearedFx) { MAIN.fctx.clearRect(0, 0, UI.w, UI.h); MAIN.clearedFx = true; }
    } else {
      if (G.L !== MAIN.lastL) { MAIN.lastL = G.L; applyTheme(); }
      if((UI.screen==='home'||UI.screen==='play') && (UI.screen!=='play'||webCourseReady()))Game.update(dt);
      advanceWebCourse(dt);
      const frozen=UI.screen!=='home'&&UI.screen!=='play';
      if(!frozen||MAIN.frozenView!==UI.view){
        Game.draw();fxOverlay(MAIN.fctx, UI.w, UI.h);MAIN.clearedFx=false;
      }
      MAIN.frozenView=frozen?UI.view:-1;
    }
    uiFrame();
  } catch (e) { onFrameError(e); }
  adaptQuality(dt);
}

/* ---------------- boot ---------------- */
function boot() {
  SAVE.opts.q=0;
  saveLoad();
  LANG = SAVE.opts.lang === 'en' ? 'en' : 'zh';
  AUD.on = SAVE.opts.sfx !== false; AUD.music = SAVE.opts.music !== false;
  UI.stage = $('#stage'); MAIN.cv = $('#gl'); MAIN.fx = $('#fx'); MAIN.fctx = MAIN.fx.getContext('2d');
  let ok = false;
  try { ok = GFX.init(MAIN.cv, { pdb: PARAMS.has('pdb') }); } catch (e) { try { console.error(e); } catch (_) { /* ignore */ } }
  if (!ok) { layout(); showFatal(LANG === 'zh' ? '你的浏览器不支持 WebGL，请换用最新版 Chrome / Safari / Edge / Firefox。' : 'Your browser does not support WebGL. Please use a recent Chrome, Safari, Edge or Firefox.'); return; }
  layout();
  uiBuild();
  Game.onFinish = showResult; Game.onFail = showFail;
  bindInput();
  UI.demoIdx = 0;
  showScreen('home');
  const lvl = PARAMS.get('lvl');
  if (lvl !== null && lvl !== '' && Number.isInteger(+lvl) && isOpen(+lvl)) startLevel(+lvl);
  const scr = PARAMS.get('screen');
  if (scr && ['levels', 'shop', 'settings', 'supplies', 'endless',...EVENT_PAGES].includes(scr)) showScreen(scr);
  if(PARAMS.has('duel')){
    const open=()=>{UI.duelCard=openDuel(PARAMS.get('duel'),PARAMS.get('score'));showScreen('duel');};
    withEndlessQuota(open);
  }
  MAIN.last = performance.now();
  requestAnimationFrame(frame);
}
try { boot(); } catch (e) { try { console.error(e); } catch (_) { /* ignore */ } showFatal(String(e && e.message || e)); }

</script>
