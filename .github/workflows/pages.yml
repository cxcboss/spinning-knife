name: 发布试玩版
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - run: node --test tests/*.test.cjs
      - uses: actions/configure-pages@v5
      - run: |
          mkdir site
          cp '旋转飞刀.html' site/index.html
          cp playtest.js site/
          cp '微信小游戏图标-144-AI版.png' site/icon.png
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
