name: 发布试玩版
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@v6
      - run: node wechat/tools/build-wechat.cjs --check
      - run: node wechat/tools/init-config.cjs
      - run: node --test web/tests/*.test.cjs wechat/tests/*.test.cjs tests/*.test.cjs
      - uses: actions/configure-pages@v6
      - run: |
          mkdir site
          sed 's/data-build="release"/data-build="playtest"/' web/index.html > site/index.html
          cp web/icon.png site/icon.png
      - id: package
        run: echo "name=github-pages-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: ${{ steps.package.outputs.name }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
