#fx {pointer-events:none}
#stage:is([data-screen=levels],[data-screen=settings],[data-screen=shop],[data-screen=supplies]) #fx {display:none}
#stage.flash::after {content:"";position:absolute;inset:0;background:#fff;animation:flash .4s ease-out forwards;pointer-events:none}
@keyframes flash {from{opacity:.75}to{opacity:0}}
.screen {position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none}
.hidden {display:none!important}
button,.scroll,.sheet,.dim {pointer-events:auto}
button {font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button[aria-disabled=true] {cursor:default}
button:focus-visible {outline:2px solid #fff0a8;outline-offset:3px}
.screen button[data-act] {transform-origin:center;transition:scale .13s,translate .13s,filter .13s}
.screen button[data-act]:is(:active,.is-pressed) {scale:.965;translate:0 3px;filter:brightness(.88);transition-duration:.045s}
/* Icons have a fixed slot within each control size. Labels never inherit the SVG baseline. */
.glyph {display:block;flex:none;width:var(--glyph-size,var(--icon-action));height:var(--glyph-size,var(--icon-action));pointer-events:none}
.glyph svg {display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ui-label {min-width:0;line-height:1.18}
.round,.view-switch,.dialog-medal {--glyph-size:var(--icon-nav)}
.round,.view-switch,.icon-link,.action.soft,.carry {
  border:1px solid #8ca6dc85;background:var(--grain),var(--blue);box-shadow:var(--blue-depth);color:#f6f4e7;
}
.round,.icon-link {width:max(44px,calc(var(--u)*11.5));height:max(44px,calc(var(--u)*11.5));display:grid;place-items:center;border-radius:13px}
.round.sm {font-size:14px}
.toprow,.topbar {padding:0 var(--gutter);margin-top:var(--safe-top);display:grid;align-items:center;min-height:48px;gap:8px;position:relative;z-index:2}
.toprow {grid-template-columns:1fr auto;justify-items:start}
.topbar {grid-template-columns:minmax(54px,1fr) auto minmax(54px,1fr)}
.topbar>.round {justify-self:start}
.topbar>:last-child {justify-self:end}
.ttl {margin:0;text-align:center;font-size:clamp(20px,calc(var(--u)*6.3),32px);font-weight:900;line-height:1.15;letter-spacing:.035em;
  color:#fff5dd;text-shadow:0 2px #192847,0 4px 6px #0a163f85}
.pill {display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:4px 10px 4px 5px;border:1px solid #84a8df9c;
  border-radius:99px;background:var(--grain),linear-gradient(#24365d,#142540);box-shadow:inset 0 1px 0 #b6ccff55,0 3px 0 #132649;white-space:nowrap}
.pill b {line-height:1;min-width:1.15em;font-weight:850;text-align:right;font-size:clamp(12px,calc(var(--u)*3.7),18px);font-variant-numeric:tabular-nums}
.coin-token {--glyph-size:13px;display:grid;place-items:center;flex:none;width:22px;height:22px;border:1px solid #ffe98f;border-radius:50%;color:#764315;
  background:var(--gold);box-shadow:inset 0 0 0 2px #e4a32f,0 2px 0 #8f531c}
.pill.bump,.bump {animation:bump .2s ease-out}
@keyframes bump {40%{scale:1.12}}

/* Home and in-game controls */
#scr-home::before {content:"";position:absolute;inset:54% 0 0;background:linear-gradient(transparent,#101a3688 56%,#101a36de)}
.logo {position:relative;text-align:center;margin-top:calc(var(--u)*10);margin-top:clamp(22px,6.2dvh,58px);line-height:1.02}
.l1,.l2 {font-weight:900;letter-spacing:.035em;-webkit-text-stroke:calc(var(--u)*.68) #39223b;paint-order:stroke fill}
.l1 {font-size:calc(var(--u)*18);color:#fff4dc;text-shadow:0 .055em #b86c4b,0 .10em #733b36,0 .15em #402a3f,0 .22em .21em #132143a0}
.l2 {font-size:calc(var(--u)*23.5);color:#ffdf63;text-shadow:0 .05em #d58923,0 .10em #9b4d20,0 .155em #4c2e34,0 .21em .2em #142143a0}
.l3 {margin-top:calc(var(--u)*4);font-size:clamp(10px,calc(var(--u)*3.2),15px);letter-spacing:.25em;color:#fff4df;text-shadow:0 2px 4px #16274a}
.homebot {position:relative;margin-top:auto;padding:0 var(--gutter) var(--safe-bottom);display:grid;justify-items:center;gap:clamp(13px,3.2dvh,26px)}
.btn.big,.action.primary,.kit-actions button[data-act=buySupply],.lv.cur,.day.today:not(.past) {
  border:1px solid #ffea97;color:var(--gold-ink);background:var(--grain),var(--gold);box-shadow:var(--gold-depth);
}
.btn.big {width:min(100%,360px);min-height:clamp(56px,calc(var(--u)*18),90px);border-radius:clamp(14px,calc(var(--u)*5),24px);
  display:flex;align-items:center;justify-content:center;gap:12px;font-size:calc(var(--u)*8.2);font-weight:900}
.btn.big {--glyph-size:clamp(25px,calc(var(--u)*7.7),34px)}
.btn.big .glyph {filter:drop-shadow(0 1px 0 #fffac080)}
.btn .pt {display:grid;text-align:left;line-height:1.09}
.btn small {font-size:.43em;font-weight:800;margin-top:3px}
.row3 {width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(5px,2%,12px);padding:7px;
  border:1px solid #8194bf7d;border-radius:17px;background:var(--grain),linear-gradient(#253b65f2,#172441f5);box-shadow:inset 0 1px 0 #93bdf32e,0 4px 0 #0f1831,0 8px 20px #12182759}
.sq {display:grid;justify-items:center;align-content:center;gap:4px;border-radius:11px;min-height:clamp(53px,calc(var(--u)*15.6),77px);padding:4px 1px;
  border:1px solid #779cdb5c;background:var(--grain),linear-gradient(#3b5789,#2a406b);box-shadow:var(--blue-depth);font-size:clamp(10px,calc(var(--u)*3.36),17px);line-height:1.1}
.sq {--glyph-size:clamp(22px,calc(var(--u)*6.45),29px);grid-template-rows:var(--glyph-size) auto}
.sq .glyph {color:#c9e7fb;filter:drop-shadow(0 1px 1px #101a32a0)}
.sq .ui-label {align-self:center;text-align:center}
.pausebtn {position:absolute;top:var(--safe-top);left:var(--gutter)}
.hudcoin {position:absolute;top:calc(var(--safe-top) + 4px);right:var(--gutter)}
.lvlbar {position:absolute;top:calc(var(--safe-top) + 3px);left:50%;translate:-50% 0;width:min(40%,230px);text-align:center}
.lvlname {font-size:clamp(12px,calc(var(--u)*3.75),18px);font-weight:880;text-shadow:0 2px 2px #152850,0 0 6px #142850}
.bar {height:9px;margin-top:5px;border:1px solid #99b9e78a;border-radius:99px;overflow:hidden;background:#172342;box-shadow:inset 0 2px 1px #0d162c}
.bar i {display:block;height:100%;width:0;background:var(--gold);border-radius:inherit;box-shadow:inset 0 1px 0 #fff3c3}
.hint {position:absolute;inset:auto calc(var(--gutter) + 5px) max(60px,11%) calc(var(--gutter) + 5px);text-align:center}
.hand {--glyph-size:clamp(33px,calc(var(--u)*10.7),50px);width:max-content;margin:auto;color:#ffe28c;
  animation:tap 1s ease-in-out infinite;filter:drop-shadow(0 2px 2px #1b294c)}
.hand svg {stroke-width:1.55}
@keyframes tap {50%{translate:0 -7px;scale:.9}}
.htxt {display:inline-block;margin-top:6px;max-width:86%;padding:9px 14px;border-radius:12px;border:1px solid #90aed57d;background:#152544e8;font-size:clamp(12px,calc(var(--u)*4.3),21px);box-shadow:0 3px 0 #101b306e}
.hud-pack {position:absolute;right:var(--gutter);bottom:calc(var(--safe-bottom) + 14px);width:max(44px,calc(var(--u)*12.5));height:max(44px,calc(var(--u)*12.5));
  display:grid;place-items:center;border:1px solid #c5f4e8;border-radius:13px;color:#193b40;background:var(--grain),linear-gradient(#b7f2db,#61bfae);
  box-shadow:inset 0 2px 0 #e4ffea,0 4px 0 #2b6166,0 5px 0 #142e41}
.hud-pack {--glyph-size:calc(var(--icon-nav) + 2px)}
.hud-pack small {position:absolute;right:-5px;top:-5px;min-width:19px;border:1px solid #ffe094;border-radius:99px;background:#5c3c22;color:#ffecb9;font-size:12px}
#live-powers {position:absolute;inset:calc(var(--safe-top) + 57px) var(--gutter) auto;display:flex;flex-wrap:wrap;justify-content:center;gap:5px}
.effect-chip {position:relative;display:flex;align-items:center;gap:6px;padding:5px 8px 7px;overflow:hidden;border-radius:9px;background:#132240f3;border:1px solid #817fb6;color:var(--paper);box-shadow:0 2px 6px #121d3a37}
.effect-chip {--glyph-size:17px}.effect-chip .glyph {color:var(--accent)}.effect-chip .effect-text {display:grid;line-height:1.16;gap:2px}
.effect-chip b {font-size:12px}.effect-chip small {font-size:10px;color:var(--mist);font-weight:560}.effect-chip time {font-size:12px;color:var(--accent);font-weight:800}
.effect-chip .effect-bar {position:absolute;bottom:0;left:0;width:100%;height:2px;transform-origin:left;transform:scaleX(var(--remaining,1));background:var(--accent)}

/* Coloured bezels, inset slots and small highlights give the panels physical edges. */
#scr-levels,#scr-settings,#scr-supplies,#scr-shop.catalog {
  background:linear-gradient(180deg,#132445f4,#142746f2 52%,#161d39fb);
}
.scroll {flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:17px var(--gutter) calc(var(--safe-bottom) + 6px);touch-action:pan-y;scrollbar-width:thin;scrollbar-color:#6384ae55 transparent}
.screen .scroll button {touch-action:pan-y}
.sheet,.world {background:var(--grain),var(--panel);border:1px solid var(--rim);border-radius:17px;color:var(--paper);box-shadow:inset 0 2px 0 #b6caff3e,inset 0 0 0 3px #0d264d3d,0 4px 0 #111c38,0 8px 17px #0b17375b}
.sheet h2,.sheet p {margin:0}
.lvgrid,.supply-scroll {display:grid;gap:17px;align-content:start}
.world {padding:11px 12px 14px;overflow:hidden}
.whead {position:relative;isolation:isolate;display:flex;align-items:center;gap:8px;margin:-11px -12px 12px;padding:12px 13px;overflow:hidden;
  border-bottom:1px solid #a1bafb43;background:var(--grain),linear-gradient(108deg,#263a6a 25%,color-mix(in srgb,var(--ac) 52%,#263a6a));font-size:clamp(15px,calc(var(--u)*4.8),23px);text-shadow:0 2px 2px #13203e}
.whead::before {content:"";position:absolute;inset:0 0 0 60%;z-index:-1;opacity:.4;background:#c9e0ff4d;
  clip-path:polygon(0 100%,0 64%,17% 64%,17% 36%,40% 36%,40% 54%,54% 54%,54% 16%,79% 16%,79% 34%,91% 34%,91% 59%,100% 59%,100% 100%)}
.whead::after {content:"";z-index:-1;position:absolute;inset:0 0 0 51%;opacity:.45;background:repeating-linear-gradient(121deg,transparent 0 8px,#def0ff25 8px 9px,transparent 9px 16px);mask-image:linear-gradient(to right,transparent,#000)}
.world-mark {width:8px;height:8px;rotate:45deg;border:1px solid #ffffffa0;border-radius:2px;background:var(--ac);box-shadow:0 2px 0 #142442}
.wrow,.days {display:grid;gap:clamp(4px,2.5%,10px)}
.wrow {grid-template-columns:repeat(5,minmax(0,1fr))}
.lv {min-height:48px;aspect-ratio:1.08;display:grid;align-content:center;justify-items:center;gap:5px;border-radius:10px;
  border:1px solid #849be3;background:var(--grain),linear-gradient(#5e7cbb,#385291);box-shadow:var(--blue-depth)}
.lv b {font-size:clamp(17px,calc(var(--u)*5.9),29px);line-height:1;font-weight:900}
.lv small {font-size:10px;line-height:1}
.lv.lock {color:#a1b1d1;border-color:#51678d;background:var(--grain),var(--well);box-shadow:inset 0 2px 2px #091c3e8c,0 1px 0 #6e8dc54a}
.lv.lock b {font-size:clamp(13px,calc(var(--u)*4.35),21px)}
.lk {--glyph-size:13px;opacity:.88}
.lv.gate:not(.cur):not(.lock) {background:var(--grain),linear-gradient(#805390,#51416c);border-color:#a981af}
.lv.gate.lock {border-color:#966ca2}
.ss,.result-stars {display:flex;align-items:center;justify-content:center}
.st {color:#111e3e}
.ss .st {--glyph-size:clamp(9px,calc(var(--u)*3),15px)}
.st.on svg {fill:currentColor}
.st.on {color:#ffdc68;filter:drop-shadow(0 2px 0 #9f5826)}
.lv.cur .st {color:#c68a35}.lv.cur .st.on {color:#fff3a8}
.lv.cur {outline:1px solid #ffffff73;outline-offset:2px}

/* Armory. Keep the live bench clear and tuck its controls into one bottom plate. */
.armory-wallet {display:flex;align-items:center;gap:6px;justify-content:flex-end}
#scr-shop .topbar {grid-template-columns:48px 1fr auto}
#scr-shop .ttl {text-align:left}
.view-switch {display:grid;place-items:center;min-width:44px;min-height:44px;border-radius:12px;font-size:17px}
.weapon-test {position:absolute;inset:calc(var(--safe-top) + 55px) 0 max(148px,23%)}
.preview-footer {position:absolute;bottom:var(--safe-bottom);left:var(--gutter);right:var(--gutter);padding:11px;display:grid;gap:9px}
.name-pager {display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;text-align:center}
.name-pager .round {width:44px;height:44px}
.name-pager h2 {font-size:clamp(21px,calc(var(--u)*7.1),35px);font-weight:900;text-shadow:0 2px #172345}
.gear-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(7px,2.65vw,13px)}
.gear-cell {display:grid;align-content:start;justify-items:center;gap:4px;min-height:118px;padding:7px 3px 9px;line-height:1.1;color:var(--paper);
  border:1px solid #6e88ba;border-radius:13px;background:var(--grain),radial-gradient(ellipse at 50% 25%,#6079a6,#314a79 57%,#203353 85%);box-shadow:var(--blue-depth)}
.gear-cell.current {border-color:#ffdf83;box-shadow:inset 0 0 0 1px #eab344,0 3px 0 #503324}
.gear-cell canvas {display:block;width:100%;height:auto;pointer-events:none}
.gear-cell b {font-size:clamp(12px,calc(var(--u)*3.8),18px)}
.catalog-price,.gear-cell small {--glyph-size:var(--icon-small);display:flex;align-items:center;gap:4px;font-size:clamp(10px,calc(var(--u)*3),15px);color:#f9db88}
.gear-cell small {color:#d0e0fa}.gear-cell[data-owned=true] small {color:#afeed3}

/* Supply trays and settings */
.supply-sheet,.settings-sheet {padding:14px;display:grid;gap:13px;min-width:0}
.section-name {--glyph-size:var(--icon-nav);display:flex;align-items:center;gap:9px;font-size:clamp(17px,calc(var(--u)*5.3),25px);font-weight:900}
.section-name .glyph {color:#ffda76}
.days {grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day {display:grid;place-items:center;gap:2px;min-height:clamp(40px,calc(var(--u)*12),55px);border-radius:8px;padding:3px;
  border:1px solid #5d7aa7;background:var(--grain),var(--well);box-shadow:inset 0 2px 1px #122346;font-size:12px;color:#d2e0f7}
.day .glyph {--glyph-size:17px;color:#bcd2ff}
.day.today .glyph,.day.past .glyph {color:inherit}.day.past {color:#b1efd3}
.supply-sheet .daily-prize {font-size:13px;color:var(--mist)}
.supply-tabs {display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid #486393;border-radius:12px;background:#172946}
.supply-tabs button {min-height:43px;padding:4px;border-radius:8px;color:var(--mist);font-size:clamp(12px,calc(var(--u)*3.7),18px)}
.supply-tabs button[aria-pressed=true] {background:var(--grain),var(--blue);box-shadow:inset 0 1px 0 #bcd6ff68,0 2px 0 #0c1932;color:#fff2d5}
.supply-tiles {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.supply-tile {position:relative;min-width:0;display:grid;justify-items:center;gap:3px;padding:4px 1px 8px;border:1px solid #6c87b4;border-radius:10px;
  background:var(--grain),radial-gradient(ellipse at 50% 33%,#677fac,#294369 75%);box-shadow:var(--blue-depth);line-height:1.15;font-size:clamp(11px,calc(var(--u)*3.55),17px)}
.supply-tile.chosen {border-color:#ffe19a;background:var(--grain),radial-gradient(ellipse at 50% 33%,#7790b9,#364c73 76%);box-shadow:inset 0 0 0 1px #efaf49,0 3px 0 #573c30}
.supply-tile small {color:var(--mist);font-size:11px}
.kit-model {display:block;max-width:100%;height:auto;width:100%;pointer-events:none}
.supply-tile .kit-model {width:min(100%,132px)}
.kit-check {--glyph-size:var(--icon-small);position:absolute;top:5px;right:5px;color:#b6efce}
.selected-kit,.kit-actions {display:flex;align-items:center;gap:8px}
.selected-kit {min-height:30px}
.selected-kit p {flex:1;font-size:clamp(12px,calc(var(--u)*3.6),16px);line-height:1.35;color:#dae5fc}
.carry {--glyph-size:16px;display:flex;align-items:center;justify-content:center;gap:5px;min-height:44px;border-radius:9px;padding:0 9px;font-size:12px;flex:none}
.carry.selected {color:#bef1d6;background:#245658}
.kit-actions>* {flex:1;min-width:0}
.kit-actions button {--glyph-size:18px;min-height:44px;padding:5px 4px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:clamp(11px,calc(var(--u)*3.5),16px)}
.kit-actions button[data-act=adSupply] {border:1px solid #61779f;color:#cbd8ef;background:#223555}
.settings-sheet {gap:0}
.setrow {display:flex;align-items:center;justify-content:space-between;gap:9px;text-align:left;min-height:55px;border-bottom:1px solid #7b95c744;font-size:clamp(13px,calc(var(--u)*4),19px);padding:4px 1px}
.setting-label {--glyph-size:var(--icon-action);display:flex;align-items:center;gap:9px;min-width:0}.setting-label .glyph {color:#c6dcfb}
.sw {position:relative;flex:none;width:48px;height:25px;border:1px solid #738cb6;border-radius:99px;background:#162544;box-shadow:inset 0 2px 0 #101a35}
.sw.on {background:#307e78;border-color:#88cfc0}
.sw u {position:absolute;top:3px;left:4px;width:17px;height:17px;background:linear-gradient(#fff7df,#c4d2eb);border-radius:50%;box-shadow:0 2px 0 #10234485;transition:translate .15s}
.sw.on u {translate:21px 0}
.segs {display:flex;gap:3px;padding:3px;border-radius:9px;background:var(--well);flex:none}
.segs button {padding:4px clamp(5px,calc(var(--u)*1.9),10px);min-height:44px;border-radius:7px;color:#c2d2ee;font-size:clamp(11px,calc(var(--u)*3.25),15px)}
.segs button.on {background:var(--blue);box-shadow:inset 0 1px 0 #b3c7ef72;color:#fff5dc}
.setting-foot {display:flex;justify-content:space-between;align-items:center;gap:5px;margin-top:8px;color:var(--mist);font-size:12px}
.reset-link {min-height:44px;color:#ffc1b8}

/* Result, revive and pause share the outer shell. The header conveys the state. */
.dim {position:absolute;inset:0;background:#080e22a8}
:is(#scr-fail,#scr-result,#scr-pause,#scr-powers) {align-items:center;justify-content:center;padding:var(--safe-top) var(--gutter) var(--safe-bottom)}
.modal {position:relative;width:min(100%,410px);max-height:100%;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;
  display:grid;gap:0;border-color:#829bcd;animation:panel-in .22s cubic-bezier(.20,.75,.27,1.04) both}
@keyframes panel-in {from{opacity:0;scale:.95;translate:0 8px}to{opacity:1;scale:1}}
.dialog-head {position:relative;isolation:isolate;display:grid;justify-items:center;gap:5px;padding:13px 17px 16px;text-align:center;overflow:hidden;
  border-block-end:1px solid #9ab7ed77;background:var(--grain),radial-gradient(ellipse at 50% 0%,#607eba,#2f4c84 77%)}
.dialog-head::after {position:absolute;content:"";inset:0;z-index:-1;opacity:.28;mask-image:linear-gradient(#000,transparent 90%);
  background:repeating-conic-gradient(at 50% 110%,transparent 0deg 16deg,#e4f0ff38 16deg 25deg)}
.dialog-head.failure {background:var(--grain),radial-gradient(ellipse at 50% 0%,#ad626f,#603b5c 82%);border-color:#b07a94}
.dialog-head.victory {background:var(--grain),radial-gradient(ellipse at 50% 0%,#416f96,#2a496f 82%)}
.dialog-head.powers {background:var(--grain),radial-gradient(ellipse at 50% 0%,#408582,#28466c 82%)}
.dialog-head h2 {font-size:clamp(24px,calc(var(--u)*8.7),43px);font-weight:900;line-height:1.14;letter-spacing:.02em;text-shadow:0 3px 0 #1521408c,0 5px 9px #1521407d}
.dialog-head.victory h2 {color:#ffe2a0}
.eyebrow {font-size:12px;color:#f5e6d8;font-weight:760}
.dialog-medal {display:grid;place-items:center;width:43px;height:43px;border:1px solid #a7c4f5;border-radius:12px;background:var(--grain),var(--blue);
  box-shadow:var(--blue-depth);font-size:20px;color:#e3efff}
.failure .dialog-medal {color:#ffe9cf;background:var(--grain),linear-gradient(#a85f6d,#71465d);border-color:#e9a2a0}
.result-stars {gap:6px;margin:3px 0}
.result-stars .st {--glyph-size:clamp(29px,calc(var(--u)*11),52px);filter:drop-shadow(0 2px 0 #0e203f)}
.result-stars .st.on {filter:drop-shadow(0 3px 0 #8b542c) drop-shadow(0 0 7px #ffb84e75)}
.dialog-body {display:grid;gap:11px;padding:14px 15px 16px}
.dialog-body p {text-align:center;color:#e0eaff;font-size:clamp(13px,calc(var(--u)*3.85),18px)}

function mulberry32(a) {
  return function () {
    let t = (a += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);

function polyAreaNormal(p) {

  {id:'fruit',zh:'水果连切',en:'Fruit Rush',icon:'fruit',goalKey:'goalFruit',goals:[4,5],reward:280},
  {id:'precision',zh:'金靶落点',en:'Gold Marks',icon:'target',goalKey:'goalPrecision',goals:[3,4],reward:320},
  {id:'air',zh:'空中拦截',en:'Air Delivery',icon:'plane',goalKey:'goalAir',goals:[2,3],reward:310},
  {id:'sprint',zh:'限时冲刺',en:'Rooftop Sprint',icon:'clock',goalKey:'goalSprint',goals:[29,35],reward:290},
];
const DAILY_CONSOLATION=35;
function dailyChallengeFor(day=calendarDay()){
  // Shuffle each block of four days, so every rule gets a turn.
  const block=Math.floor(day/DAILY_COURSES.length),order=DAILY_COURSES.slice(),shuffle=mulberry32(block^0x5840b79d);
  for(let i=order.length-1;i>0;i--){
    const j=Math.floor(shuffle()*(i+1));[order[i],order[j]]=[order[j],order[i]];
  }
  const rule=order[day-block*order.length],rn=mulberry32(day^0x659c8477);
  return {...rule,day,seed:day,hops:9+Math.floor(rn()*3),world:Math.floor(rn()*THEMES.length),
    goal:rule.goals[Math.floor(rn()*rule.goals.length)]};
}
function generateDailyCourse(spec){
  const sprint=spec.id==='sprint',precision=spec.id==='precision';
  const L=genLevel(2,spec.seed,{hops:spec.hops,wMin:3.25,wMax:4.12,dyMax:precision?.49:.76,
    extP:sprint?.28:0,extMax:2.12,spike:0,chim:0,mover:0,crum:0,cpEvery:99});
  const rn=mulberry32(spec.seed^0x124bfd),pads=L.W.pl;
  L.world=spec.world;L.theme=THEMES[spec.world];
  L.W.angleScale=precision?.64:.80;
  if(spec.id==='fruit')L.objs=pads.slice(1).map(p=>({...makePropDef('fruit',p.land-.42+rn()*.25,p.top,2,rn),dailyTarget:true}));
  if(spec.id==='air'){
    L.objs=[];
    for(let i=1;i<pads.length;i++){
      const p=pads[i],prev=pads[i-1];
      if(i%2===0){
        const x=lerp(prev.land,p.land,.48+rn()*.15);
        const y=ballisticHopY(prev.land,prev.top,x,null)-.46;
        const t=rn()<.72?'plane':'bird';
        L.objs.push({t,x,y,air:true,dailyTarget:true,float:{amp:.14,sp:2.1,ph:rn()*TAU}});
      }else L.objs.push(makePropDef(i%3?'pudding':'piggy',p.land+.24,p.top,2,rn));
    }
  }
  return L;
}

/* Endless terrain is seeded once per run. Sections are small enough to bake ahead of the knife. */
const ENDLESS_SECTION_SIZE=6;
const ENDLESS_LOOKAHEAD=46;
const ENDLESS_KEEP_BEHIND=58;
const ENDLESS_PROPS=['fruit','pudding','piggy','crayon','stack','tires','pencils','rings','lego','money','emoji'];

function newEndlessLevel(seed){
  const rn=mulberry32(seed),world=Math.floor(rn()*THEMES.length);
  const start={id:0,x0:-lerp(5.5,7.7,rn()),x1:lerp(1.25,1.85,rn()),top:lerp(-.17,.17,rn()),land:lerp(-.60,-.25,rn()),mv:null,crum:false,chim:false};
  const W={firstPi:0,pl:[start],angleScale:.78,zones:[],spk:[],cps:[],tower:null,voidY:-19};
  const track={rn,sections:[],checkpointAt:8+Math.floor(rn()*4),flyAt:6+Math.floor(rn()*4),pickupAt:4+Math.floor(rn()*3),bag:[]};
  const level={idx:0,world,seed,W,endless:track,theme:THEMES[world],hints:[],clouds:[]};
  const clouds=mulberry32(seed^0x516bbd);
  for(let x=-20;x<90;x+=6+clouds()*8){
    level.clouds.push({x,y:4+clouds()*9,z:-34-clouds()*26,s:3.2+clouds()*2.4,v:Math.floor(clouds()*2)});
  }
  while(W.pl[W.pl.length-1].x1<ENDLESS_LOOKAHEAD)extendEndlessLevel(level);
  return level;
}

function endlessPlatform(previous,track,section){
  const rn=track.rn,id=previous.id+1,difficulty=Math.min(1,id/72);
  const recovery=previous.mv||previous.spikes||previous.crum||previous.needTap;
  const checkpoint=id>=track.checkpointAt&&!recovery;
  if(checkpoint)track.checkpointAt=id+7+Math.floor(rn()*5);
  const canChallenge=id>3&&!recovery&&!checkpoint;
  const roll=rn(),longGap=canChallenge&&roll<.10+difficulty*.09;
  const moving=canChallenge&&roll>.39&&roll<.48+difficulty*.06;
  const crum=canChallenge&&roll>.64&&roll<.69+difficulty*.06;
  const spikes=canChallenge&&id>8&&roll>.87;
  const maxRise=lerp(.52,1.10,difficulty);
  let dy=(rn()+rn()-1)*maxRise;
  if(id<=2||checkpoint||recovery)dy*=.35;
  if(previous.spikes)dy=Math.min(dy,.05);
  const top=clamp(previous.top+dy,-3.4,4.1);
  const mv=moving?{k:rn()<.64?'y':'x',amp:lerp(.32,.58,rn()),per:lerp(2.8,4.6,rn()),ph:rn()*TAU}:null;
  const oldSweep=previous.mv?.k==='x'?previous.mv.amp:0,ownSweep=mv?.k==='x'?mv.amp:0;
  const jumpTime=longGap?lerp(.31,.42,rn()):null;
  const aimed=ballisticHop(previous.land,previous.top,top-previous.top,jumpTime,[]).x;
  const nominal=longGap?ballisticHop(previous.land,previous.top,top-previous.top,null,[]).x:aimed;
  const width=checkpoint||recovery||id<=2?lerp(3.55,3.95,rn()):lerp(2.72-difficulty*.38,3.64,rn());
  const gapStart=previous.x1+oldSweep+ownSweep+.87;
  const x0=Math.max(gapStart,aimed-width*.46,longGap?nominal+.44:-Infinity);
  const target=Math.max(aimed,x0+.68);
  const x1=spikes?target+2.62:Math.max(x0+width,target+1.24);
  const pad={id,x0,x1,top,land:target,mv,crum,chim:false,cp:checkpoint,needTap:longGap};
  if(spikes){
    pad.spikes={x0:x1-1.16,x1:x1-.13};
    section.spk.push({...pad.spikes,y0:top,y1:top+.42,pi:id});
  }
  if(checkpoint)section.cps.push({pi:id});
  return pad;
}

function fillEndlessSection(section,track){
  const rn=track.rn;
  for(const pad of section.pl){
    if(!pad.id||pad.mv||pad.crum||pad.spikes||pad.cp)continue;
    if(!track.bag.length){
      track.bag.push(...ENDLESS_PROPS);
      for(let j=track.bag.length-1;j>0;j--){
        const other=Math.floor(rn()*(j+1));
        [track.bag[j],track.bag[other]]=[track.bag[other],track.bag[j]];
      }
    }
    const type=track.bag.pop(),x=pad.land+lerp(-.21,.21,rn());
    const prop=makePropDef(type,x,pad.top,8,rn);
    if(type==='stack')prop.n=5+Math.floor(rn()*5);
    if(type==='tires')prop.n=pad.x1-pad.x0>3.15?2:1;
    if(type==='pencils')prop.n=5+Math.floor(rn()*4);
    if(type==='rings'||type==='lego')prop.n=2+Math.floor(rn()*2);
    const half=propHalfWidth(prop);
    if(pad.x1-pad.x0>=2*half+.27){
      prop.x=clamp(x,pad.x0+half+.12,pad.x1-half-.12);
      section.objs.push(prop);
    }else{
      section.objs.push(makePropDef('fruit',pad.land,pad.top,8,rn));
    }
    if(pad.id>=track.pickupAt){
      const item=TIMED_POWERS[Math.floor(rn()*TIMED_POWERS.length)];
      section.pickups.push({id:item.id,x:pad.land-.72,y:pad.top+1.80+rn()*.66,phase:rn()*TAU,taken:false});
      track.pickupAt=pad.id+3+Math.floor(rn()*4);
    }
    if(pad.id>=track.flyAt){
      const type=rn()<.5?'bird':'plane';
      section.objs.push({t:type,x:pad.land+7.5,y:pad.top+1.48+rn()*.75,air:true,
        fly:{trigger:pad.land-1.5,start:null,phase:rn()*TAU,speed:8.4+rn()*1.25}});
      track.flyAt=pad.id+7+Math.floor(rn()*6);
    }else if(pad.id>3&&rn()<.14){
      const y=pad.top+2.0+rn()*.68;
      section.objs.push({...makePropDef('emoji',pad.land-1.24,y,8,rn),floatY:y,air:true});
    }
  }
}

function extendEndlessLevel(level){
  const {W,endless:track}=level,rn=track.rn,initial=track.sections.length===0;
  const start=W.pl[W.pl.length-1];
  const section={pl:initial?[start]:[],spk:[],cps:[],objs:[],bg:[],pickups:[],x0:initial?start.x0:start.x1};
  let prev=start;
  for(let i=0;i<ENDLESS_SECTION_SIZE;i++){
    const pad=endlessPlatform(prev,track,section);
    W.pl.push(pad);section.pl.push(pad);prev=pad;
  }
  section.x1=prev.x1;
  W.spk.push(...section.spk);W.cps.push(...section.cps);
  fillEndlessSection(section,track);
  const city=mulberry32((level.seed^Math.imul(prev.id,0x45d9f3b))>>>0);
  section.bg=makeSkyline(city,initial?section.x0-55:section.x0,section.x1,initial);
  track.sections.push(section);
  return section;
}

// Keep complete sections behind the closest possible respawn, and preserve absolute pad IDs.
function trimEndlessLevel(level,x,protectedPi){
  const {W,endless:track}=level,protectedPad=padAt(W,protectedPi);
  const boundary=Math.min(x,protectedPad?.x0??x)-ENDLESS_KEEP_BEHIND,removed=[];
  while(track.sections.length>2&&track.sections[0].x1<boundary){
    const part=track.sections.shift();
    W.pl.splice(0,part.pl.length);W.firstPi+=part.pl.length;
    W.spk.splice(0,part.spk.length);W.cps.splice(0,part.cps.length);
    removed.push(part);
  }
  return removed;
}

/* ==== 05b_bot.js ==== */
/* ============================================================
 *  05b_bot.js — model-predictive "player": simulates tap policies on a cloned knife and picks the most robust one
 *  Used (1) to validate every level in Node, (2) for the attract-mode demo on the title screen.
 * ============================================================ */
/* simulate one hop: wait `delay` s while stuck, launch, optional air-tap at `tau` s. returns the resulting clone + info */
function simHop(K0, W, delay, tau, maxT) {
  const K = cloneKnife(K0), dt = PHYS.DT, p0 = K.sp; let tl = 0, tapped = false, tw = 0;
  while (tw < delay - 1e-9) { stepKnife(K, dt, W, false); tw += dt; if (K.mode !== 'stuck') return { K, ok: false }; }
  stepKnife(K, dt, W, true);                                // launch
  K.ev.length = 0;
  while (K.mode === 'air' && tl < maxT) {
    const tap = tau !== null && !tapped && tl >= tau; if (tap) tapped = true;
    stepKnife(K, dt, W, tap); tl += dt;
  }
  const ok = (K.mode === 'stuck' && K.sp !== p0) || K.mode === 'done';
  return { K, ok, T: tl };
}
/* score of a finished hop: margin from the platform edges / spike mat */
function hopMargin(K, W) {
  if (K.mode === 'done') return 2;
  const p = padAt(W,K.sp), b = platBox(p, K.t, [0, 0, 0]), x = K.sx + (b[0] - p.x0);
  let m = Math.min(x - b[0], b[1] - x);
  if (p.spikes) { const s = p.spikes; const dx = s.x0 - (b[0] - p.x0) <= x ? 0 : 0; const d = Math.min(Math.abs(x - (s.x0 + (b[0] - p.x0))), Math.abs(x - (s.x1 + (b[0] - p.x0)))); const inside = x > s.x0 + (b[0] - p.x0) && x < s.x1 + (b[0] - p.x0); m = inside ? -1 : Math.min(m, d); }
  return m;
}
/* choose the best plan for the next hop. returns { delay, tau, width, margin } or null */
function planHop(K, W, opts) {
  opts = opts || {};
  const p = padAt(W,K.sp), movers = !!(p.mv) || nextHasMover(W, K.sp) || p.crum;
  const delays = movers ? [] : [0]; if (movers) for (let d = 0; d <= 3.6; d += 0.12) delays.push(d);
  const taus = [null]; for (let t = 0.05; t <= 0.76; t += 0.025) taus.push(t);
  let best = null;
  for (const d of delays) {
    // crumbling platform: must launch before it falls
    if (p.crum && d > PHYS.CRUMB - 0.1 - (K.cr[p.id] === undefined ? 0 : K.t - K.cr[p.id])) continue;
    const res = [];
    for (const tau of taus) {
      const r = simHop(K, W, d, tau, 3); const mg = r.ok ? hopMargin(r.K, W) : -9;
      res.push({ tau, ok: r.ok && mg > 0.12, mg, pi: r.ok ? (r.K.mode === 'done' ? 999 : r.K.sp) : 1e9, mult: r.K.mult || 0 });
    }
    // prefer the NEAREST platform that can be reached, then the longest contiguous ok-run of tap timings that lands on it
    let minPi = 1e9; for (const r of res) if (r.ok && r.pi < minPi) minPi = r.pi;
    if (minPi >= 1e9) continue;
    if (minPi === 999) {                                       // finale: aim for the tallest multiplier block
      let bm = -1, bj = 0; for (let i = 0; i < res.length; i++) if (res[i].ok && res[i].mult > bm) { bm = res[i].mult; bj = i; }
      let lo = bj, hi = bj; while (lo > 0 && res[lo - 1].ok && res[lo - 1].mult === bm) lo--; while (hi < res.length - 1 && res[hi + 1].ok && res[hi + 1].mult === bm) hi++;
      const mid = res[(lo + hi) >> 1]; best = { delay: d, tau: mid.tau, width: (hi - lo + 1) * 0.025, margin: 2, score: 1e6, pi: 999, mult: bm }; break;
    }
    if (res[0].ok && res[0].pi === minPi) {                // nominal hop: no air tap needed
      const sc = -minPi * 100 + 50 - d * 0.3;
      if (!best || sc > best.score) best = { delay: d, tau: null, width: 9, margin: res[0].mg, score: sc, pi: minPi };
      if (!movers || (opts.quick && res[0].mg > .35)) break; else continue;
    }
    let bi = -1, bl = 0;
    for (let i = 1; i < res.length;) {
      if (!(res[i].ok && res[i].pi === minPi)) { i++; continue; }
      let j = i; while (j + 1 < res.length && res[j + 1].ok && res[j + 1].pi === minPi && res[j + 1].tau !== null) j++;
      const len = j - i + 1; if (len > bl) { bl = len; bi = i; } i = j + 1;
    }
    if (bi < 0) continue;
    const mid = res[bi + (bl >> 1)];
    const width = bl * 0.025;
    const score = -minPi * 100 + bl + (res[bi].tau === null ? 0.5 : 0) - d * 0.3;
    if (!best || score > best.score) best = { delay: d, tau: mid.tau, width, margin: mid.mg, score, pi: minPi };
    if (!movers || (opts.quick && width >= .12 && mid.mg > .25)) break;
  }
  return best;
}
/* run a whole level with the bot. returns stats */
function botRun(W, maxSec) {
  const K = newKnife(W, 0, W.pl[0].land), dt = PHYS.DT; let hops = 0, minW = 9, failed = null, tauHops = 0;
  const widths = [];
  while (K.t < (maxSec || 240) && K.mode !== 'done' && K.mode !== 'dead') {
    if (K.mode === 'stuck') {
      const plan = planHop(K, W);
      if (!plan) { failed = { at: K.sp, x: K.sx, why: 'noplan' }; break; }
      hops++; if (plan.tau !== null) tauHops++; minW = Math.min(minW, plan.tau === null ? 9 : plan.width); widths.push(plan.width);
      // execute
      let tw = 0; while (tw < plan.delay - 1e-9) { stepKnife(K, dt, W, false); tw += dt; }
      stepKnife(K, dt, W, true); let tl = 0, tapped = false;
      while (K.mode === 'air' && tl < 4) { const tap = plan.tau !== null && !tapped && tl >= plan.tau; if (tap) tapped = true; stepKnife(K, dt, W, tap); tl += dt; }
      K.ev.length = 0;
    } else break;
  }
  return { done: K.mode === 'done', hops, minWindow: minW, tauHops, failed, mode: K.mode, time: K.t, why: K.why };
}
function nextHasMover(W, pi) { const q = padAt(W,pi + 1); return !!(q && (q.mv || q.crum)); }

/* ==== 06_scene.js ==== */
/* ============================================================
 *  06_scene.js — level → GPU batches (static terrain/decor, per-frame dynamic parts), camera helpers
 * ============================================================ */
const SC = {
  L: null, W: null, T: null, statB: null, shadeB: null, dynO: null, dynT: null, dynA: null, cloudB: null,
  objs: [], flyers: [], mvMesh: {}, cpMesh: [], chimneys: [], rn: null, ready: false,
  sections: [], solidLayers: [], shadeLayers: [],
};
const CAM = { dirx: -0.365, diry: 0.168, dirz: 0.913, fov: 0.92, wvis: 7.4, maxAspect: 0.62 };   // eye direction (unit) from the target, vertical FOV (rad)
const _I3 = new Float32Array([1, 0, 0, 0, 1, 0, 0, 0, 1]);

function scInit() {
  if (SC.dynO) return;
  SC.dynO = GFX.batch(8192, true, false,true); SC.dynT = GFX.batch(20000, true, false); SC.dynA = GFX.batch(12000, true, false); SC.cloudB = GFX.batch(2000, true, false);
}
const bakeAdd = (batch, polys) => { const m = bakeMesh([{ polys }]); batch.addMesh(m, 0, 0, 0, null, 1, null); return m; };

function landingMarker(p) {
  if (p.id === 0) return null;
  const x0 = Math.max(p.x0 + 0.3, p.land - PERFECT_RADIUS);
  const x1 = Math.min(p.x1 - 0.3, p.land + PERFECT_RADIUS);
  if (x0 >= x1 || (p.spikes && x0 < p.spikes.x1 && x1 > p.spikes.x0)) return null;
  const y = p.top + 0.014, z1 = p.chim ? (p.x1 - p.x0) / 2 - 0.02 : 1.76;
  const z0 = z1 - (p.chim ? 0.18 : 0.52);
  const corner = Math.min((x1 - x0) / 4, (z1 - z0) / 4, 0.1);
  return mkPoly([
    [x0 + corner, y, z0], [x0, y, z0 + corner], [x0, y, z1 - corner], [x0 + corner, y, z1],
    [x1 - corner, y, z1], [x1, y, z1 - corner], [x1, y, z0 + corner], [x1 - corner, y, z0],
  ], [0, 1, 0], hexc('#ffc35c'));
}

function scLoad(L) {
  scInit();GFX.pruneModels?.(true);
  for(const area of SC.sections){area.solid.dispose();area.shade.dispose();}
  SC.sections.length=SC.solidLayers.length=SC.shadeLayers.length=0;
  SC.L=L;SC.W=L.W;const T=SC.T=L.theme,W=L.W;
  const light=vnorm([-.38,.72,.68]);
  SC.env={skyTop:hexc(T.sky[0]),skyMid:hexc(T.sky[1]),skyBot:hexc(T.sky[2]),fog:hexc(T.fog),fogNear:40,fogFar:150,amb:T.amb,light};
  GFX.setEnv(SC.env);
  SC.mvMesh={};SC.cpMesh=[];SC.chimneys=[];SC.objs=[];SC.flyers=[];
  SC.rn=mulberry32(L.seed^0xabcdef);
  if(L.endless){
    for(const part of L.endless.sections)scAddEndlessSection(part);
  }else{
    if(!SC.statB)SC.statB=GFX.batch(60000,false,false);
    if(!SC.shadeB)SC.shadeB=GFX.batch(4000,false,false);
    SC.statB.clear();SC.shadeB.clear();
    scBakeTerrain(SC.statB,{pl:W.pl,spk:W.spk,cps:W.cps,bg:L.bg});
    scBakeTower(SC.statB,W.tower);
    scBakeProps(L.objs,SC.shadeB);
    SC.solidLayers.push(SC.statB);SC.shadeLayers.push(SC.shadeB);
  }
  SC.ready=true;
}
function scBakeTerrain(S,part){
  const T=SC.T,W=SC.W;
  /* The skyline shares the static geometry batch with the course. */
  for(const building of part.bg)bakeAdd(S,skylinePolys(building,T));
  /* platforms */
  for (const p of part.pl) {
    const marker = landingMarker(p);
    if (p.chim) {
      const cx = (p.x0 + p.x1) / 2, baseTop = p.top - 2.06;
      bakeAdd(S, platformPolys(cx - 1.5, cx + 1.5, baseTop, -45, -2.1, 2.1, T, 0.25));
      const ch = mkChimney({ x: cx, y: baseTop, hw: (p.x1 - p.x0) / 2 }); S.addMesh(ch.mesh, 0, 0, 0, null, 1, null); SC.chimneys.push({ cx, y: p.top, p });
      if (marker) bakeAdd(S, [marker]);
      continue;
    }
    const polys = platformPolys(p.x0, p.x1, p.top, -45, -2.1, 2.1, T);
    if (marker) polys.push(marker);
    if (p.mv || p.crum) SC.mvMesh[p.id] = bakeMesh([{ polys }]);
    else bakeAdd(S, polys);
  }
  /* spike mats */
  for (const s of part.spk) { const sp = mkSpikes({ x: (s.x0 + s.x1) / 2, y: s.y0, w: s.x1 - s.x0 }); S.addMesh(sp.mesh, 0, 0, 0, null, 1, null); }
  /* checkpoints */
  for (const c of part.cps) { const p = padAt(W,c.pi), cp = mkCheckpoint({ x: (p.x0 + p.x1) / 2, y: p.top }); S.addMesh(cp.mesh, 0, 0, 0, null, 1, null); SC.cpMesh.push({ pi: c.pi, flag: cp.flagMesh, x: cp.x, y: cp.y, on: false }); }
}
function scBakeTower(S,tw){
  const T=SC.T;
  const cap=hBox(tw.x0+FINISH.width/2,tw.topY+FINISH.cap/2,0,(FINISH.width+FINISH.lip)/2,FINISH.cap/2,1.15,hexc('#e9e9ee'));
  S.addMesh(bakeMesh([cap]),0,0,0,null,1,null);
  const x0 = tw.x0 - FINISH.lip, x1 = tw.x0 + FINISH.width + FINISH.lip;
  bakeAdd(S, platformPolys(x0, x1, tw.yb, -45, -2.1, 2.1, T, 0.0));
  { // show the x1 scoring band on both sides the player sees
    const y1 = tw.yb, y0 = y1 - FINISH.band, z = 2.105, x = x0 - 0.005, uv = atlUV('checker', 1);
    const tex = [[uv[0], uv[3]], [uv[2], uv[3]], [uv[2], uv[1]], [uv[0], uv[1]]], white = [1, 1, 1, 1];
    bakeAdd(S, [
      mkPoly([[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]], [0, 0, 1], white, tex),
      mkPoly([[x, y0, -2.1], [x, y0, 2.1], [x, y1, 2.1], [x, y1, -2.1]], [-1, 0, 0], white, tex),
    ]);

}

/* ---------- main update ---------- */
function gUpdate(dtReal) {
  if (!G.L || G.mode === 'idle') return;
  if (G.mode === 'pause' || G.mode === 'failed') return;
  let dt = Math.min(dtReal, 0.05);
  if (G.tsT > 0) { G.tsT -= dt; if (G.tsT <= 0) G.ts = 1; }
  dt *= G.ts;
  const K = G.K;
  G.time += dt;
  if (G.dead) {
    G.deadT -= dt; K.t += dt;
    if (G.deadT <= 0) {
      if (G.demo) gRespawn();
      else { G.mode = 'failed'; if (Game.onFail) Game.onFail(); }
    }
  } else {
    if(G.endless)streamEndless();
    if (G.mode === 'demo') botTick(dt);
    G.acc += dt; let n = 0;
    while (G.acc >= PHYS.DT && n < 16) {
      const tap = G.tapQ; G.tapQ = false;
      moveFlybys(K);settleStacks(PHYS.DT);
      stepKnife(K, PHYS.DT, G.W, tap && G.mode !== 'finish',true);
      if(G.W.tower)settleFinishBands(G.W.tower,K,G.W.pl[G.W.pl.length-1]);
      specialStep(PHYS.DT);fxProcessCuts(K.t);
      if(G.dailyChallenge?.id==='sprint'&&G.dailyStart!==null&&K.mode!=='done'&&K.mode!=='dead'&&dailyElapsed()>G.dailyChallenge.goal)knifeFell(K,'time');
      gEvents();
      G.acc -= PHYS.DT; n++;
      if (G.dead) break;
    }
    if (n >= 16) G.acc = 0;
  }
  fxStep(dt); fxPieces(dt);
  if (G.sliceComboT > 0) { G.sliceComboT -= dt; if (G.sliceComboT <= 0) G.sliceCombo = 0; }
  updateLandingWobble(dt); gAmbient(dt); gHints(dt); gCamera(dt);
  G.coinsShown += (G.coins - G.coinsShown) * Math.min(1, 10 * dt);
  if (Math.abs(G.coins - G.coinsShown) < 0.5) G.coinsShown = G.coins;
  G.progress = G.endless ? 0 : G.fin ? 1 : clamp((K.x - G.startX) / Math.max(1, G.endX - G.startX), 0, 0.99);
  if (G.fin) {
    G.fin.t += dt;
    const beats=FINISH_SHOWS[G.fin.m].beats;
    while(G.fin.nextBeat<beats.length && G.fin.t>=beats[G.fin.nextBeat]) finishBeat(G.fin,G.fin.nextBeat++);
    if(G.fin.t>G.fin.end && !G.res) gFinishResult();
  }
  if (G.nextDemo) { G.nextDemo = false; if (G.demo) gStart((G.idx + 1) % 10, { demo: true }); }
}

const M_CH = [[0,4,7,11],[9,12,16,19],[5,9,12,16],[7,11,14,17]];

function musicTick() {
  const c = AUD.ctx; if (!c || !AUD.music) return;
  const bench=UI.screen==='shop',beat=60/(bench?82:G.idx===9&&!G.demo?120:100+AUD.world*2)/2;                                   // eighth notes
  if (AUD.mNext < c.currentTime - 0.2) AUD.mNext = c.currentTime + 0.05;   // after a pause / toggle: don't replay the missed beats in one burst

    const t = Math.max(AUD.mNext, c.currentTime), s = AUD.mStep, ch = M_CH[(s >> 4) & 3], root = 55 + AUD.world * 2;

        tone('sine',pitch,pitch,t,beat*2.8,.20,AUD.musG);
        tone('triangle',pitch*2.01,pitch*2,t+.012,beat*.62,.052,AUD.musG);

    }

const SAVE_KEY = 'spinning-knife.public.v1'+(typeof location!=='undefined'&&new URLSearchParams(location.search).get('qa')==='1'?'.qa':'');

const progressCounters=['days','cuts','fruit','perfects','streak','finish','challengeWins'];

const freshSave=()=>({coins:0,unlocked:1,stars:new Array(NUM_LEVELS).fill(0),best:new Array(NUM_LEVELS).fill(0),owned:['chef'],
  knife:'chef',opts:{lang:'',sfx:true,music:true,vib:true,q:1},seen:{tap2:false},plays:0,stock:freshStock(),loadout:'',
  daily:{day:-1,count:0},endlessBest:0,pendingEndless:null,progression:freshProgression()});
const SAVE=freshSave();
let savedSnapshot;
function saveLoad(recover=true) {
  try {
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw||!recover&&raw===savedSnapshot)return;
    const j=JSON.parse(raw);if(!j||typeof j!=='object')return;
    savedSnapshot=raw;
    Object.assign(SAVE,freshSave());
    for (const k of ['coins', 'unlocked', 'knife', 'plays']) if (j[k] !== undefined) SAVE[k] = j[k];
    if (Array.isArray(j.stars)) j.stars.forEach((v, i) => { if (i < NUM_LEVELS) SAVE.stars[i] = v | 0; });
    if (Array.isArray(j.best)) j.best.forEach((v, i) => { if (i < NUM_LEVELS) SAVE.best[i] = v | 0; });
    if (Array.isArray(j.owned)) SAVE.owned = [...new Set(j.owned.filter(id=>KNIFE_BY_ID[id]))]; if (!SAVE.owned.includes('chef')) SAVE.owned.push('chef');
    if (!canEquip(SAVE.knife)) SAVE.knife = 'chef';
    SAVE.coins = natural(SAVE.coins); SAVE.unlocked = clamp(natural(SAVE.unlocked),1,NUM_LEVELS);
    for(const item of ALL_SUPPLIES)if(j.stock?.[item.id]!==undefined)SAVE.stock[item.id]=natural(j.stock[item.id]);
    SAVE.loadout = SUPPLIES.some(i => i.id === j.loadout) ? j.loadout : '';
    if (Number.isInteger(j.daily?.day)) SAVE.daily = { day:j.daily.day, count:natural(j.daily.count) };
    if (j.opts) Object.assign(SAVE.opts, j.opts); if (j.seen) Object.assign(SAVE.seen, j.seen);
    SAVE.endlessBest=natural(j.endlessBest);
    SAVE.progression=loadProgression(j.progression);
    if(j.pendingEndless&&typeof j.pendingEndless==='object'){
      SAVE.pendingEndless={coins:natural(j.pendingEndless.coins),pad:natural(j.pendingEndless.pad)};
      if(recover)bankEndlessReceipt();
    }
  } catch (e) { /* storage unavailable or corrupt: start fresh */ }
}
function saveWrite() {

}

function bankRunProgress(){
  if(G.demo||!G.records)return false;
  const p=SAVE.progression,r=G.records;
  const mult=!G.dailyChallenge&&G.fin?G.fin.m:0;
  const changed=G.cut!==r.bankedCuts||r.fruit!==r.bankedFruit||G.perfects!==r.bankedPerfects||r.streak>p.streak||mult>p.finish;
  p.cuts+=G.cut-r.bankedCuts;p.fruit+=r.fruit-r.bankedFruit;p.perfects+=G.perfects-r.bankedPerfects;
  p.streak=Math.max(p.streak,r.streak);

const dailyRecord=day=>SAVE.progression.challenges[day]||{paid:0,best:0,won:false};
function settleDailyChallenge(spec,result,today=calendarDay()){
  const entries=SAVE.progression.challenges,previous=dailyRecord(spec.day);
  const reward=result.won?spec.reward:DAILY_CONSOLATION;
  const earned=spec.day<today-1?0:Math.max(0,reward-previous.paid);
  if(spec.day>=today-1){
    if(result.won&&!previous.won)SAVE.progression.challengeWins++;
    const best=spec.id==='sprint'?
      (result.won?Math.min(previous.best||Infinity,result.score):previous.best):Math.max(previous.best,result.score);
    entries[spec.day]={paid:previous.paid+earned,best,won:previous.won||result.won};
  }
  for(const date of Object.keys(entries))if(+date<today-1)delete entries[date];
  SAVE.coins+=earned;saveWrite();
  return {...result,earned};
}

const WHEEL_PRIZES=[
  {weight:4100,coins:20,color:'#294673'}, {weight:3100,coins:45,color:'#355c87'},

function loadProgression(raw){
  const p=freshProgression();
  if(!raw||typeof raw!=='object')return p;
  for(const key of progressCounters)p[key]=natural(raw[key]);
  for(const key of ['lastPlayDay','freeSpinDay'])if(Number.isInteger(raw[key]))p[key]=raw[key];
  if(Array.isArray(raw.claimed))p.claimed=ACHIEVEMENTS.filter(a=>raw.claimed.includes(a.id)).map(a=>a.id);
  if(raw.challenges&&typeof raw.challenges==='object'){
    for(const [day,r] of Object.entries(raw.challenges)){
      if(/^\d+$/.test(day)&&r&&typeof r==='object')p.challenges[day]={paid:natural(r.paid),best:natural(r.best),won:r.won===true};
    }
  }
  const prev=raw.lastPrize,slot=WHEEL_PRIZES[prev?.slot];
  if(slot){
    if(slot.coins||slot.knife)p.lastPrize={slot:prev.slot,coins:slot.coins,knife:slot.knife};
    else if(ALL_SUPPLIES.some(item=>item.id===prev.item))p.lastPrize={slot:prev.slot,item:prev.item};
  }
  return p;
}

  if(!free&&!spendCoins(WHEEL_COST))return null;
  let roll=Math.floor(random()*10000),slot=0;
  while(slot<WHEEL_PRIZES.length-1&&roll>=WHEEL_PRIZES[slot].weight)roll-=WHEEL_PRIZES[slot++].weight;
  if(WHEEL_PRIZES[slot].knife&&(p.days<3||clearedCourses()<10||canEquip(WHEEL_PRIZES[slot].knife)))slot=0;
  const prize=WHEEL_PRIZES[slot];
  const item=prize.supply?ALL_SUPPLIES[Math.floor(random()*ALL_SUPPLIES.length)].id:undefined;
  if(prize.coins)SAVE.coins+=prize.coins;
  if(item)SAVE.stock[item]++;
  if(prize.knife)SAVE.owned.push(prize.knife);
  if(free)p.freeSpinDay=today;
  p.lastPrize={slot,coins:prize.coins,item,knife:prize.knife};
  saveWrite();return {...p.lastPrize,free};
}

const ENDLESS_DAILY_LIMIT=3;
const ENDLESS_SHARE_REWARD=2;
const ENDLESS_DAILY_SHARE_LIMIT=3;
const SHARE_GAME_URL='https://cxcboss.github.io/spinning-knife/';
const ENDLESS_QUOTA_KEY=SAVE_KEY+'.endless-quota';
let endlessQuotaCache=null;

function endlessQuota(today=calendarDay()){
  let quota=endlessQuotaCache;
  try{
    const raw=localStorage.getItem(ENDLESS_QUOTA_KEY);
    if(raw)quota=JSON.parse(raw);
  }catch{/* Local in-memory fallback when storage is unavailable. */}
  if(!Number.isInteger(quota?.day)||quota.day<today)return {day:today,started:0,shares:[]};
  const shares=Array.isArray(quota.shares)?[...new Set(quota.shares.filter(validShareId))].slice(0,ENDLESS_DAILY_SHARE_LIMIT):[];
  return {day:quota.day,started:natural(quota.started),shares};
}
const validShareId = id => typeof id==='string'&&/^[\w.-]{1,128}$/.test(id);
const endlessRemaining = (quota=endlessQuota()) => Math.max(0,ENDLESS_DAILY_LIMIT+ENDLESS_SHARE_REWARD*quota.shares.length-quota.started);
const endlessPosition = n => n?tr('endlessPad',{n}):tr('endlessOrigin');

function saveEndlessQuota(quota){
  endlessQuotaCache=quota;
  try{localStorage.setItem(ENDLESS_QUOTA_KEY,JSON.stringify(quota));}catch{/* The in-memory counter still applies to this tab. */}
}
function withEndlessQuota(update){
  const locks=globalThis.navigator?.locks;
  return locks?locks.request(ENDLESS_QUOTA_KEY,update):update();
}

// The mini-game host can replace this adapter with its own share flow and completion receipt.
const endlessSharePlatform={
  supports(data){
    const nav=globalThis.navigator;
    return typeof nav?.share==='function'&&(!nav.canShare||nav.canShare(data));
  },
  async share(data){
    await navigator.share(data);
    return {day:calendarDay(),id:globalThis.crypto?.randomUUID?.()??Date.now()+'-'+newEndlessSeed()};
  }
};
function grantEndlessShare(receipt,day=calendarDay()){
  if(receipt?.day!==day||!validShareId(receipt.id))return false;
  const quota=endlessQuota(day);
  if(quota.day!==day||quota.shares.length>=ENDLESS_DAILY_SHARE_LIMIT||quota.shares.includes(receipt.id))return false;
  quota.shares.push(receipt.id);
  saveEndlessQuota(quota);
  return true;
}

function newEndlessSeed(){
  const rng=globalThis.crypto;
  return rng?.getRandomValues?rng.getRandomValues(new Uint32Array(1))[0]:((Date.now()^Math.floor(rand()*4294967296))>>>0);
}

function bankEndlessReceipt(){
  const receipt=SAVE.pendingEndless;
  if(!receipt)return null;
  SAVE.coins+=receipt.coins;
  SAVE.endlessBest=Math.max(SAVE.endlessBest,receipt.pad);
  SAVE.pendingEndless=null;saveWrite();
  return receipt;
}

async function startEndless(){
  if(UI.screen!=='endless'||UI.endlessStarting)return false;
  UI.endlessStarting=true;
  const view=UI.view;
  try{
    return await withEndlessQuota(()=>{
      if(UI.screen!=='endless'||UI.view!==view)return false;
      const quota=endlessQuota();
      if(!endlessRemaining(quota)){renderEndless();return false;}
      stats?.close();
      Game.start(0,{endlessSeed:newEndlessSeed()});
      quota.started++;saveEndlessQuota(quota);
      enterRun('endless');
      return true;
    });
  }finally{UI.endlessStarting=false;}
}
async function shareEndless(){
  if(UI.screen!=='endless'||UI.endlessSharing||endlessQuota().shares.length>=ENDLESS_DAILY_SHARE_LIMIT)return false;
  const data=endlessShareData();
  if(!endlessSharePlatform.supports(data)){renderEndless();return false;}
  UI.endlessSharing=true;
  const button=$('#scr-endless [data-act=shareEndless]');
  button?.setAttribute?.('aria-busy','true');
  let rewarded=false,message='';
  try{
    // Launch the system sheet from the click before awaiting any lock or storage work.
    const receipt=await endlessSharePlatform.share(data);
    if(receipt){
      rewarded=await withEndlessQuota(()=>grantEndlessShare(receipt));
      message=rewarded?tr('shareSuccess',{n:ENDLESS_SHARE_REWARD}):tr('shareLimit');
    }
  }catch(error){
    if(error?.name!=='AbortError')message=tr('shareFailed');

    refreshEndlessEntry();
    if(message&&UI.screen==='endless')toast(message);

}

const kitMeshes={},pickupProfiles={};
function pickupCollider(o,y,t){
  if(!pickupProfiles[o.id])kitModelMesh(o.id);
  const a=.10*Math.sin(t+o.phase),c=Math.cos(a),s=Math.sin(a);
  if(!o.collider)o.collider={pc:{x:o.x,y,z:0,bb:[-.8,-.8,.8,.8],sections:[]}};
  const pc=o.collider.pc;pc.x=o.x;pc.y=y;
  if(pc.angle===a)return o.collider;pc.angle=a;
  pc.sections=pickupProfiles[o.id].map(poly=>poly.map(([x,v])=>[c*x-s*v,s*x+c*v]));
  return o.collider;
}
function kitModelMesh(id){
  if(kitMeshes[id])return kitMeshes[id];
  const hulls=[],gold=hexc('#edb258'),jade=hexc('#5cc4b3'),r=(a,b,r0,r1,col,seg)=>hPrism({axis:'y',a,b,r0,r1,col,seg});
  if(id==='revival'){
    const glass=hexc('#ed8eb2',1.18),top=hexc('#ffd8e7'),cap=hexc('#b77455');
    hulls.push(r(-.45,-.34,.25,.36,hexc('#a8417d'),14),r(-.34,.02,.36,.38,glass,14),
      r(.02,.22,.38,.16,top,14),r(.22,.36,.16,.16,glass,12),r(.34,.53,.117,.138,cap,12));
    hulls.push(...ringHulls('y',[[.158,.24],[.185,.24],[.185,.31],[.158,.31]],12,hexc('#f9cc7d'),top,0,0,0));
    hulls.push(chamferBlock(0,-.13,.34,.225,.145,.042,.022,hexc('#fff0d2')));
    const rose=hexc('#c64778');
    hulls.push(hBox(0,-.13,.386,.042,.091,.014,rose),hBox(0,-.13,.389,.093,.040,.014,rose));
  }else if(id==='goldrush'){
    for(const [x,y,z,radius] of [[-.35,.10,-.07,.31],[.32,.21,-.12,.30],[0,-.10,.05,.43]]){
      const rim=hexc('#ffe080'),face=hexc('#f7ad39'),polys=[];
      const circle=(radius,depth,n=14)=>Array.from({length:n},(_,j)=>[x+radius*Math.cos(j*TAU/n),y+radius*Math.sin(j*TAU/n),z+depth]);
      const rear=circle(radius,-.09),front=circle(radius,.06),inset=circle(radius*.80,.085);
      for(let i=0;i<front.length;i++){
        const n=(i+1)%front.length;
        polys.push(mkPoly([rear[i],rear[n],front[n],front[i]],null,gold),mkPoly([front[i],front[n],inset[n],inset[i]],null,rim));
      }
      polys.push(mkPoly(rear.slice().reverse(),[0,0,-1],gold),mkPoly(inset,[0,0,1],face));
      const stamp=circle(radius*.57,.091,8);
      for(let j=0;j<8;j++){
        if(j%2){stamp[j][0]=lerp(x,stamp[j][0],.40);stamp[j][1]=lerp(y,stamp[j][1],.40);}
      }
      for(let j=0;j<8;j++)polys.push(mkPoly([stamp[j],stamp[(j+1)%8],[x,y,z+.115]],[0,0,1],hexc(j%2?'#ffe290':'#fff6c4')));
      hulls.push({polys});
    }
    // Raised beading catches the light as the coins turn.
    for(let j=0;j<12;j++){const a=j*TAU/12;

function drawModelCards(root,knives=false){
  const canvases=document.querySelectorAll?.(root+(knives?' canvas[data-knife]':' canvas[data-model]'));if(!canvases)return;
  for(const cv of canvases){
    const id=knives?cv.dataset.knife:cv.dataset.model,mesh=knives?knifeMesh(id):kitModelMesh(id),ctx=cv.getContext('2d'),w=cv.width,h=cv.height;
    const yaw=-.34, pitch=id==='feather'?.25:.40,roll=knives?.27:id==='feather'?.55:-.12, sy=Math.sin(yaw),cy=Math.cos(yaw),sp=Math.sin(pitch),cp=Math.cos(pitch),sr=Math.sin(roll),cr=Math.cos(roll);
    const turn=(x,y,z)=>{const X=x*cy+z*sy,Z=-x*sy+z*cy,Y=y*cp-Z*sp;return [cr*X-sr*Y,sr*X+cr*Y,y*sp+Z*cp];};
    const faces=[],f=mesh.f,scale=POWER_BY_ID[id]?72:52;
    for(let k=0;k<f.length;k+=PS*3){
      const v=[0,PS,PS*2].map(i=>turn(f[k+i],f[k+i+1],f[k+i+2]));
      const n=turn(f[k+3],f[k+4],f[k+5]),lit=.80+.20*Math.max(0,-.38*n[0]+.72*n[1]+.58*n[2]);
      faces.push({v,z:v[0][2]+v[1][2]+v[2][2],c:css([f[k+6]*lit,f[k+7]*lit,f[k+8]*lit,1])});
    }
    ctx.clearRect(0,0,w,h);ctx.fillStyle='#485a7d24';ctx.beginPath();ctx.ellipse(w*.5,h*.84,w*.22,h*.055,0,0,TAU);ctx.fill();
    for(const f of faces.sort((a,b)=>a.z-b.z)){
      ctx.fillStyle=f.c;ctx.strokeStyle=f.c;ctx.lineWidth=.65;ctx.beginPath();
      f.v.forEach(([x,y],i)=>{const X=w*.49+x*scale,Y=h*.51-y*scale;i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);});ctx.closePath();ctx.fill();ctx.stroke();
    }
  }
}

/* ---------------- flow ---------------- */
function showScreen(name,weaponIndex,achievementId) {
  if(name==='home'||name==='endless'||EVENT_PAGES.includes(name))stats?.close();
  if(name!==UI.screen)$('#toast').classList.remove('show');
  UI.screen = name; UI.view++;
  for (const id of SCREENS) $('#scr-' + id).classList.toggle('hidden', id !== name);
  const paused=name==='pause'||name==='powers'||(name==='settings'&&UI.settingsReturn==='pause');
  $('#hud').classList.toggle('hidden', !(name==='play'||paused));
  $('#hud').inert=paused;
  UI.stage.dataset.screen=name;
  if (name==='home'||name==='levels'||name==='endless'||EVENT_PAGES.includes(name)|| (name === 'settings' && UI.settingsReturn==='home')) {
    if (G.mode !== 'demo') { Game.start(UI.demoIdx, { demo: true }); } applyTheme();
  }
  if (name !== 'shop') shopDraw.theme = -1;
  UI.stage.dataset.run=G.dailyChallenge?'daily':G.endless?'endless':'course';
  if(name==='home')renderHome();
  if(name==='endless')renderEndless();
  if (name === 'levels') renderLevels();
  if (name === 'shop') {
    UI.shopGrid=false;UI.shopFromGrid=false;UI.shopScroll=0;UI.sampleIndex=-1;
    selectWeapon(weaponIndex??Math.max(0,KNIVES.findIndex(k=>k.id===SAVE.knife)),false);
  }
  if(name==='achievements')renderAchievements(achievementId);
  if(name==='daily-challenge')renderDailyChallenge();
  if(name==='daily-result')renderDailyResult();
  if(name==='wheel')renderWheel();
  if (name === 'settings') renderSettings();
  if (name === 'supplies') { UI.supplySpecial=true; UI.supplyIndex=0; renderSupplies(); $('.supply-scroll').scrollTop=0; }
  if (name === 'pause') renderPause();
}

/* ---------------- actions ---------------- */
function act(a, d = {}) {
  audInit();
  switch (a) {
    case 'play': sfx('ui'); startLevel(nextLevelIdx()); break;
    case 'endless': sfx('ui');showScreen('endless');break;
    case 'startEndless': return startEndless();
    case 'shareEndless': return shareEndless();

/* Equipment workbench. Targets and fragments use the same meshes as the course. */
const BENCH = { top:-.27, socket:.86, flight:.97, pause:.73, sink:.115 };
let benchMesh, horizonMesh;
function buildWorkbench() {
  const n=24, wood=hexc('#e5b294'), bark=hexc('#ad7967'), iron=hexc('#596577');
  const cyl=(a,b,r0,r1,c)=>hPrism({axis:'y',a,b,r0,r1,seg:n,col:c});
  const top=BENCH.top, h=[cyl(-7,top-.08,1.63,1.98,bark),cyl(top-.09,top,1.98,1.91,wood)];
  const face=h[0].polys;
  for(let i=0;i<n;i++){
    const q=face[i]; for(let j=0;j<4;j++){
      q[j*PS+10]=(130+(j<2?0:60))/1024;q[j*PS+11]=(962+(j===0||j===3?0:60))/1024;
    }
  }
  for(let i=0;i<n;i++) {
    const shade=.89+.065*Math.sin(i*2.8)+.052*Math.cos(i);
    bandShade(face[i],shade*1.13,shade*.63);
  }
  h.push(cyl(top-.61,top-.49,1.982,1.982,iron),cyl(top-.495,top-.475,1.984,1.984,hexc('#9ba9b2')));
  for (let i=0;i<n;i+=3) {
    const a=TAU*i/n;
    h.push(hSphere(.041,4,7,hexc('#c5cdd5'),null,iron,1.978*Math.cos(a),top-.55,1.978*Math.sin(a)));
  }
  const grain=[];
  for(let j=1;j<=10;j++) {
    const r=j*.165;
    for(let i=0;i<48;i++){
      const p=(k,dr)=>{const a=k*TAU/48, rad=r*(1+.03*Math.sin(3*a+j*.06)+.025*Math.sin(5*a))+dr;
        return [-.13+rad*Math.cos(a),top+.004,.06+rad*Math.sin(a)*.94];};
      grain.push(mkPoly([p(i,0),p(i+1,0),p(i+1,.011),p(i,.011)],[0,1,0],hexc(j%3?'#cd9c85':'#be8d79')));
    }
  }
  for(const side of [-1,1]) {
    const x=side*BENCH.socket;
    grain.push(mkPoly([[x-.15,top+.008,-.016],[x+.18,top+.008,-.036],[x+.06,top+.008,.020],[x-.10,top+.008,.028]],[0,1,0],hexc('#74503b')));
  }

}
function newSample(side=-1,placing=false) {
  const count=MATERIAL_ORDER.length,last=UI.sampleIndex;
  let i=Math.floor(rand()*(last<0?count:count-1)); if(last>=0&&i>=last)i++;
  UI.sampleIndex=i;
  const type=MATERIAL_ORDER[i], x=-side*BENCH.socket, n=({stack:4,pencils:4,rings:2,lego:1})[type]||1;
  const prop=SLICEABLE[type]({t:type,x,y:BENCH.top,n,w:1.31,length:.70,shift:Math.floor(rand()*8)},rand);
  UI.sample={type,prop,side,phase:'ready',t:0,hit:false,halves:[],hold:0,arrival:placing?.16:0};

}
function previewCut() {
  const s=UI.sample||newSample();
  if(s.phase!=='ready')return;
  s.phase='flight';s.t=0;
  sfx('launch',{knife:KNIVES[UI.shopIdx]});
}
function benchPose(s) {
  const dir=-s.side, u=s.phase==='ready'?0:s.phase==='flight'?clamp(s.t/BENCH.flight,0,1):1;
  const lean=.23, start=-Math.PI/2+dir*lean, end=-Math.PI/2-dir*lean;
  const spin=sstep(.03,.71,u), a=lerp(start,end,spin)+dir*TAU*spin;
  // The tip ends in the new socket. Horizontal travel is complete before contact.
  const sx=lerp(s.side*BENCH.socket,dir*BENCH.socket,sstep(.035,.64,u));
  const restAngle=lerp(start,end,sstep(.04,.65,u));
  const restX=sx-KNIFE_TIP*Math.cos(restAngle),baseY=BENCH.top-BENCH.sink-KNIFE_TIP*Math.sin(restAngle);
  const wobble=s.phase==='landed'?dir*Math.sin(s.t*35)*Math.exp(-s.t*13)*.055:s.phase==='ready'?-dir*.045*UI.pressBlend:0;
  return {a:a+wobble,x:restX+KNIFE_TIP*(Math.cos(a)-Math.cos(a+wobble)),y:baseY+8.0*u*(1-u)+KNIFE_TIP*(Math.sin(a)-Math.sin(a+wobble))};
}
function contactOnDescent(s,old,pose) {
  if(pose.y>=old.y)return;
  const weapon=KNIVES[UI.shopIdx],skin=contactSkin(weapon),nx=-Math.sin(pose.a),ny=Math.cos(pose.a);
  // This guided throw is already blade-down when it reaches the workpiece.
  for(const q of s.prop.pcs){
    if(q.state)continue;
    const p=q.pc,target={o:s.prop,q,by:0,dx:0,dy:0};
    sweepContacts(skin,pose,old,[target]);const hit=target.hit;if(!hit)continue;
    const x=p.x+hit.hx,y=p.y+hit.hy;
    const pair=slicePiece(p,nx,ny,0,nx*x+ny*y);if(!pair[0]||!pair[1])continue;
    if(!s.hit){
      s.hit=true;s.hold=CUT_TIME[s.type]*.35;materialImpact(UI.sampleFX,s.type,weapon,x,y,pose.a);
      sfx('slice',{knife:weapon});materialSound(s.type,weapon);vib(8);
    }
    q.state=1;
    pair.forEach((pc,j)=>{
      const sign=j?-1:1;setCutMotion(pc,s.type,sign,nx,ny,0,-3);

}
function updateSample(dt) {
  const s=UI.sample||newSample();
  s.arrival=Math.max(0,s.arrival-dt);
  if(s.phase==='ready')return;
  // Fixed substeps protect the contact crossing and the pile at low frame rates.
  for(let left=Math.min(dt,.25);left>1e-7;){
    const step=Math.min(1/120,left);left-=step;
    if(s.hold>0){s.hold-=step;continue;}
    if(s.phase==='flight'){
      const old=benchPose(s);
      s.t=Math.min(s.t+step,BENCH.flight);
      if(s.t/BENCH.flight>=.65)contactOnDescent(s,old,benchPose(s));
      if(s.t>=BENCH.flight){s.phase='landed';s.t=0;sfx('stick',{knife:KNIVES[UI.shopIdx]});}
    } else if((s.t+=step)>=BENCH.pause){
      newSample(-s.side,true);return;
    }
    for(const p of s.halves){
      advanceFragment(p,step,14);
      const R=p.R, pts=p.pts;
      let pen=0;
      for(let i=0;i<pts.length;i+=3){
        const x=pts[i],y=pts[i+1],z=pts[i+2];
        const wx=p.x+R[0]*x+R[1]*y+R[2]*z,wz=p.z+R[6]*x+R[7]*y+R[8]*z;
        if(wx*wx+wz*wz<1.91*1.91)pen=Math.max(pen,BENCH.top-p.y-R[3]*x-R[4]*y-R[5]*z);
      }
      if(pen>0&&p.vy<0&&p.y>BENCH.top-.2){p.y+=pen;p.vy*=-CUT_RESPONSE[s.type].bounce;p.vx*=.97;p.wz*=.96;}
    }

  }
}

const PARAMS = (() => { try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(''); } })();
const MAIN = {
  cv: null, fx: null, fctx: null, fd: 1, last: 0, qScale: 1, lowN: 0, accT: 0, accN: 0, errs: 0, errT: 0, clearedFx: false, lastL: null, dead: false,

/* ---------------- layout: a centred portrait stage; canvases scale with devicePixelRatio and the quality setting ---------------- */
function layout() {
  MAIN.frozenView=-1;
  const iw = window.innerWidth || document.documentElement.clientWidth || 360, ih = window.innerHeight || document.documentElement.clientHeight || 640;
  const sw = Math.round(Math.max(180, Math.min(iw, ih * 0.62))), sh = Math.max(240, ih);
  const st = UI.stage; st.style.width = sw + 'px'; st.style.height = sh + 'px';
  document.documentElement.style.setProperty('--u', (sw / 100) + 'px');
  UI.w = sw; UI.h = sh;
  if (!MAIN.cv) return;
  const nat = window.devicePixelRatio || 1, q = SAVE.opts.q | 0;
  let dpr = (q === 2 ? 0.75 : Math.min(nat, 2)) * (q === 0 ? MAIN.qScale : 1);
  const maxPix = q === 1 ? 4.5e6 : 3.2e6;
  if (sw * sh * dpr * dpr > maxPix) dpr = Math.sqrt(maxPix / (sw * sh));
  dpr = Math.max(0.5, dpr);
  GFX.resize(sw, sh, dpr);
  MAIN.fd = Math.min(dpr, 1.5);
  MAIN.fx.width = Math.round(sw * MAIN.fd); MAIN.fx.height = Math.round(sh * MAIN.fd);
  MAIN.fctx.setTransform(MAIN.fd, 0, 0, MAIN.fd, 0, 0);
  UI.q = dpr;
}

/* ---------------- input ---------------- */
function bindInput() {
  const st = UI.stage;
  // A short tap must show its down state before an action replaces the whole screen.
  const minimumPress = 75, held = new Map(), states = new WeakMap();

    if (!el || held.has(id)) return;
    let state = states.get(el);
    if (!state) { state = { until:0, release:0, pending:false, down:0 }; states.set(el,state); }
    clearTimeout(state.release); state.swiped=false; state.until = performance.now() + minimumPress; state.down++;

    if(el.dataset.act==='sampleRandom') UI.modelPressed=true;

  }
  function release(id, cancel = false) {
    const el = held.get(id); if (!el) return;
    held.delete(id);
    const state = states.get(el); if (--state.down > 0) return;
    clearTimeout(state.release);
    const lift=()=>{el.classList.remove('is-pressed'); if(el.dataset.act==='sampleRandom') UI.modelPressed=false;};
    if (cancel) { state.until=0; lift(); return; }
    state.release=setTimeout(lift, Math.max(0,state.until-performance.now()));
  }
  function activate(el) {
    if (!el) return;
    if (!states.has(el) || (!el.classList.contains('is-pressed') && !el.matches(':active'))) { press(el,'activation'); release('activation'); }
    const state = states.get(el);
    if (el.getAttribute('aria-disabled') === 'true' || el.disabled || state.pending) return;
    state.pending = true;
    const view = UI.view;
    const run = () => {
      state.pending = false;
      if (UI.view === view && el.isConnected && !el.closest('.screen.hidden') && el.getAttribute('aria-disabled') !== 'true') act(el.dataset.act,el.dataset);
    };
    const remaining = state.until - performance.now();
    const needsActivation=['shareEndless','copyEndlessLink','shareAchievement','shareDailyScore'].includes(el.dataset.act);
    if(remaining>0&&!needsActivation)setTimeout(run,remaining);else run();
  }
  const shortcut = action => activate(st.querySelector('.screen:not(.hidden) button[data-act="'+action+'"]'));
  st.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    audInit(); kickMusic();
    const button = e.target.closest?.('button[data-act]');
    if (button) {
      press(button,e.pointerId);
      if (button.dataset.act==='sampleRandom') MAIN.swipe={x:e.clientX,y:e.clientY,id:e.pointerId,button,done:false};
      return;
    }
    if (UI.screen === 'play') { e.preventDefault(); Game.tap(); }
    else if (UI.screen === 'shop' && !UI.shopGrid) MAIN.swipe = { x:e.clientX,y:e.clientY,id:e.pointerId,done:false };
  }, { passive:false });
  st.addEventListener('pointerout', e => {
    const el = held.get(e.pointerId);
    if (el && !el.contains(e.relatedTarget)) release(e.pointerId,true);
  });
  window.addEventListener('pointerup', e => release(e.pointerId));
  window.addEventListener('pointercancel', e => release(e.pointerId,true));
  window.addEventListener('blur', () => { for (const id of held.keys()) release(id,true); });
  st.addEventListener('pointermove', (e) => {
    const s = MAIN.swipe; if (!s || s.done || e.pointerId !== s.id) return;
    const dx = e.clientX - s.x;
    if (Math.abs(dx)>UI.w*.12 && Math.abs(dx)>Math.abs(e.clientY-s.y)) {
      s.done=true;
      if(s.button) { const state=states.get(s.button); if(state) state.swiped=true; release(e.pointerId,true); }
      shortcut(dx<0?'knext':'kprev');
    }
  });
  const endSwipe = () => { MAIN.swipe = null; };
  st.addEventListener('pointerup', endSwipe); st.addEventListener('pointercancel', endSwipe);
  st.addEventListener('click', (e) => {
    const el = e.target.closest?.('button[data-act]');
    if (!el) return;
    e.preventDefault(); if(!states.get(el)?.swiped) activate(el);
  });
  window.addEventListener('keyup', e => release(e.code || e.key));
  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key, scr = UI.screen;
    audInit(); kickMusic();
    const focused = e.target.closest?.('button[data-act]');
    if (focused && !focused.closest('.screen.hidden') && (k === 'Enter' || k === ' ')) {
      if (e.repeat) e.preventDefault(); else press(focused,e.code || k);
      return;
    }
    const tapKey = k === ' ' || k === 'Spacebar' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'Enter';
    if (tapKey) {
      if (scr === 'play') { e.preventDefault(); if (!e.repeat) Game.tap(); return; }
      if (e.repeat) return;
      if (k === 'Enter' || k === ' ') {
        if (scr === 'home') { e.preventDefault(); shortcut('play'); }
        else if (scr === 'pause') { e.preventDefault(); shortcut('resume'); }
        else if(scr==='fail'){e.preventDefault();shortcut(G.endless?'cashOutEndless':'retry');}
        else if(scr==='endless'){e.preventDefault();shortcut('startEndless');}
        else if(scr==='endless-result'){e.preventDefault();shortcut('endless');}
        else if(scr==='daily-challenge'||scr==='daily-result'){e.preventDefault();shortcut('startDailyChallenge');}
        else if(scr==='wheel'){e.preventDefault();shortcut('spinWheel');}
        else if (scr === 'result') { e.preventDefault(); shortcut($('#scr-result [data-act="next"]') ? 'next' : 'retry'); }
        else if (scr === 'shop') { e.preventDefault(); shortcut('sampleRandom'); }
      }
      return;
    }
    if (k === 'p' || k === 'P') { if (scr === 'play') shortcut('pause'); else if (scr === 'pause') shortcut('resume'); return; }
    if (k === 'Escape') {
      if (scr === 'play') shortcut('pause'); else if (scr === 'pause') shortcut('resume'); else if(scr==='powers')shortcut('powerBack');
      else if (scr === 'shop') shortcut('shopBack'); else if(scr==='settings')shortcut('settingsBack');
      else if(scr==='fail'&&G.endless)shortcut('cashOutEndless');
      else if((scr==='achievements'&&UI.achievementReturn==='shop')||(scr==='wheel'&&UI.wheelReturn==='shop'))shortcut('backToPrize');
      else if(['levels','supplies','fail','result','endless','endless-result','daily-result',...EVENT_PAGES].includes(scr))shortcut('home');
      return;
    }
    if (scr === 'shop') { if (k === 'ArrowLeft') shortcut('kprev'); else if (k === 'ArrowRight') shortcut('knext'); }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { autoPause(); try { if (AUD.ctx) AUD.ctx.suspend(); } catch (e) { /* ignore */ } }
    else { audResume(); MAIN.last = performance.now(); }
  });
  window.addEventListener('blur', autoPause);
  window.addEventListener('pagehide', autoPause);
  window.addEventListener('storage',e=>{
    if(e.key===ENDLESS_QUOTA_KEY||e.key===null){endlessQuotaCache=null;refreshEndlessEntry();}
    if(e.key===SAVE_KEY&&e.newValue){
      saveLoad(false);
      if(UI.screen==='home')renderHome();
      else if(UI.screen==='achievements')renderAchievements();
      else if(UI.screen==='daily-challenge')renderDailyChallenge();
      else if(UI.screen==='wheel'&&!UI.wheelBusy)renderWheel();
      else if(UI.screen==='shop')renderShop();
    }
  });
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 250));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);

  /* keep the page itself still: no rubber-band scrolling, pinch zoom, long-press menus */
  document.addEventListener('touchmove', (e) => { if (!(e.target.closest && e.target.closest('.scroll, .modal'))) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('contextmenu',e=>{if(!e.target.closest?.('.share-url'))e.preventDefault();});
  MAIN.cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); MAIN.dead = true; });
  MAIN.cv.addEventListener('webglcontextrestored', () => { try { location.reload(); } catch (e) { /* ignore */ } });
}

/* ---------------- frame loop ---------------- */
function onFrameError(e) {
  try { console.error(e); } catch (_) { /* ignore */ }
  const now = performance.now(); if (now - MAIN.errT > 2000) MAIN.errs = 0; MAIN.errT = now; MAIN.errs++;
  if (MAIN.errs === 4 && UI.screen === 'play') { try { act('home'); } catch (_) { /* ignore */ } }
  if (MAIN.errs > 60) showFatal(LANG === 'zh' ? '出错了，请刷新页面重试。' : 'Something went wrong. Please reload the page.');
}
function adaptQuality(dt) {
  if (MAIN.noadapt || (SAVE.opts.q | 0) !== 0 || document.hidden) return;
  MAIN.accT += dt; MAIN.accN++;
  if (MAIN.accT < 1.6) return;
  const fps = MAIN.accN / MAIN.accT; MAIN.accT = 0; MAIN.accN = 0; UI.fps = fps;
  const capped = Math.abs(fps - 30) < 1.2;                        // a steady 30 means the display / power mode caps us, not the GPU
  if (fps < 38 && !capped) {
    if (++MAIN.lowN >= 2 && MAIN.qScale > 0.56) { MAIN.qScale = Math.max(0.55, MAIN.qScale * 0.82); MAIN.lowN = 0; layout(); }
  } else MAIN.lowN = 0;
}
function frame(now) {
  requestAnimationFrame(frame);
  if (MAIN.dead || document.hidden) return;
  let dt = (now - MAIN.last) / 1000; MAIN.last = now;
  if(G.mode==='play'&&!G.dead&&!G.fin&&!G.demo)stats?.tick(dt*1000);
  if (!(dt > 0) || dt > 0.25) dt = 1 / 60;
  try {
    if (UI.screen === 'shop') {
      MAIN.frozenView=-1;
      if(!UI.shopGrid)shopDraw(dt);
      if (!MAIN.clearedFx) { MAIN.fctx.clearRect(0, 0, UI.w, UI.h); MAIN.clearedFx = true; }
    } else {
      if (G.L !== MAIN.lastL) { MAIN.lastL = G.L; applyTheme(); }
      const eventPage=EVENT_PAGES.includes(UI.screen)||UI.screen==='daily-result';
      if(!eventPage)for (let i = 0; i < MAIN.steps; i++) { if (MAIN.bot && G.mode === 'play') botTick(Math.min(dt, 0.05)); Game.update(dt); }
      const frozen=eventPage||G.mode==='pause'||G.mode==='failed';
      if(!frozen||MAIN.frozenView!==UI.view){
        Game.draw();fxOverlay(MAIN.fctx, UI.w, UI.h);MAIN.clearedFx=false;
      }
      MAIN.frozenView=frozen?UI.view:-1;
    }
    uiFrame();
  } catch (e) { onFrameError(e); }
  adaptQuality(dt);
}

/* ---------------- boot ---------------- */
function boot() {
  if(!document.fonts) { startGameApp(); return; }
  document.fonts.load('900 72px "Slice Han UI"','终点记录点通关×0123456789').catch(()=>{}).then(startGameApp).catch(e=>showFatal(String(e.message||e)));
}
function startGameApp() {
  saveLoad();
  LANG = SAVE.opts.lang === 'en' ? 'en' : 'zh';
  AUD.on = SAVE.opts.sfx !== false; AUD.music = SAVE.opts.music !== false;
  UI.stage = $('#stage'); MAIN.cv = $('#gl'); MAIN.fx = $('#fx'); MAIN.fctx = MAIN.fx.getContext('2d');
  let ok = false;
  try { ok = GFX.init(MAIN.cv, { pdb: PARAMS.has('pdb') }); } catch (e) { try { console.error(e); } catch (_) { /* ignore */ } }
  if (!ok) { layout(); showFatal(LANG === 'zh' ? '你的浏览器不支持 WebGL，请换用最新版 Chrome / Safari / Edge / Firefox。' : 'Your browser does not support WebGL. Please use a recent Chrome, Safari, Edge or Firefox.'); return; }
  layout();
  uiBuild();
  Game.onFinish = showResult; Game.onFail = showFail;
  bindInput();
  UI.demoIdx = 0;
  showScreen('home');
  const lvl = PARAMS.get('lvl');
  if (lvl !== null && lvl !== '' && Number.isInteger(+lvl) && isOpen(+lvl)) startLevel(+lvl);
  const scr = PARAMS.get('screen');
  if (scr && ['levels', 'shop', 'settings', 'supplies', 'endless',...EVENT_PAGES].includes(scr)) showScreen(scr);
  MAIN.last = performance.now();
  requestAnimationFrame(frame);
}
try { boot(); } catch (e) { try { console.error(e); } catch (_) { /* ignore */ } showFatal(String(e && e.message || e)); }

</script>
