:root{--u:4px;--sky1:#bf5f57;--sky2:#cf6f4a;--sky3:#ee9c4c;--ac:#ff9a3d;
  --font:"Slice Han UI","Arial Rounded MT Bold","Hiragino Maru Gothic ProN","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ts:0 calc(var(--u)*.45) 0 rgba(40,16,30,.38)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);font-weight:800;color:#fff;touch-action:none;overscroll-behavior:none;background:#1b1020}
body{background:radial-gradient(130% 80% at 50% 0%,var(--sky2),transparent 70%),linear-gradient(var(--sky1),var(--sky3));transition:background .6s}
body::before{content:"";position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(90% 90% at 50% 50%,transparent 40%,rgba(20,6,30,.55));pointer-events:none}
#stage{position:absolute;left:50%;top:0;transform:translateX(-50%);overflow:hidden;background:#000;box-shadow:0 0 70px rgba(10,0,20,.55)}
#stage>canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#stage.flash::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:#fff;animation:flash .4s ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.75}to{opacity:0}}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;pointer-events:none}
.screen.hidden{display:none}
#scr-levels,#scr-settings{background:rgba(30,12,44,.5);-webkit-backdrop-filter:blur(calc(var(--u)*.8));backdrop-filter:blur(calc(var(--u)*.8))}
#stage[data-screen=levels] #fx,#stage[data-screen=settings] #fx,#stage[data-screen=shop] #fx{display:none}
.screen>*{pointer-events:none}
button,.panel,.scroll,.setrow,.ver,.screen button,.screen .panel,.screen .scroll,.screen .setrow,.screen .ver{pointer-events:auto}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;outline:none}
svg{fill:currentColor;display:block}
.hidden{display:none!important}
/* pills */
.pill{display:inline-flex;align-items:center;gap:calc(var(--u)*1.6);height:calc(var(--u)*8.6);padding:0 calc(var(--u)*3.6);border-radius:99px;background:rgba(36,18,44,.46);box-shadow:inset 0 0 0 calc(var(--u)*.35) rgba(255,255,255,.16);font-size:calc(var(--u)*4.8);text-shadow:var(--ts);transition:transform .12s}
.pill b{font-weight:900;letter-spacing:.02em;min-width:calc(var(--u)*6);text-align:right}
.pill.bump,.bump{animation:bump .22s ease-out}
@keyframes bump{40%{transform:scale(1.14)}}
.cn{color:#ffd23f;font-weight:900}
/* top bars */
.toprow,.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--u)*3.4) calc(var(--u)*3.6) 0;gap:calc(var(--u)*2)}
.topbar .ttl{flex:1;text-align:center;font-size:calc(var(--u)*6.6);text-shadow:var(--ts)}
.spacer{width:calc(var(--u)*10)}
/* round buttons */
.round{width:calc(var(--u)*10.4);height:calc(var(--u)*10.4);border-radius:50%;display:grid;place-items:center;color:#5c3f78;background:linear-gradient(#fff,#dcd8ee);box-shadow:0 calc(var(--u)*.9) 0 #9a92bd,0 calc(var(--u)*1.8) calc(var(--u)*2.4) rgba(0,0,0,.3);transition:transform .08s}

.round svg{width:calc(var(--u)*5.4);height:calc(var(--u)*5.4)}
.round.sm{width:calc(var(--u)*9.2);height:calc(var(--u)*9.2);font-size:calc(var(--u)*3.6)}
.pausebtn{position:absolute;left:calc(var(--u)*3.6);top:calc(var(--u)*3.4);background:rgba(36,18,44,.5);color:#fff;box-shadow:inset 0 0 0 calc(var(--u)*.35) rgba(255,255,255,.2);width:calc(var(--u)*9.4);height:calc(var(--u)*9.4)}

/* big buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:calc(var(--u)*2.4);height:calc(var(--u)*14);padding:0 calc(var(--u)*7);border-radius:calc(var(--u)*5.4);font-size:calc(var(--u)*6.2);font-weight:900;color:#fff;text-shadow:0 calc(var(--u)*.5) 0 rgba(0,0,0,.28);
  background:linear-gradient(#7ae86e,#2dbd4b);box-shadow:0 calc(var(--u)*1.4) 0 #1b8a35,0 calc(var(--u)*2.6) calc(var(--u)*3) rgba(0,0,0,.38),inset 0 calc(var(--u)*.7) 0 rgba(255,255,255,.5);transition:transform .08s,filter .15s}
.btn{white-space:nowrap}

.btn .pi svg{width:calc(var(--u)*6);height:calc(var(--u)*6)}
.btn.blue{background:linear-gradient(#69c3ff,#2f84ea);box-shadow:0 calc(var(--u)*1.4) 0 #1c5db8,0 calc(var(--u)*2.6) calc(var(--u)*3) rgba(0,0,0,.38),inset 0 calc(var(--u)*.7) 0 rgba(255,255,255,.5)}
.btn.gold{background:linear-gradient(#ffe066,#ffa51c);box-shadow:0 calc(var(--u)*1.4) 0 #c26e00,0 calc(var(--u)*2.6) calc(var(--u)*3) rgba(0,0,0,.38),inset 0 calc(var(--u)*.7) 0 rgba(255,255,255,.55)}
.btn.gold .cn{color:#fff}
.btn.gold.poor{filter:saturate(.4) brightness(.85)}
.btn.grey{background:linear-gradient(#b9b6c8,#8e8aa6);box-shadow:0 calc(var(--u)*1.4) 0 #625e7a,0 calc(var(--u)*2.6) calc(var(--u)*3) rgba(0,0,0,.3);color:#f2f0fa}
.btn.grey svg{width:calc(var(--u)*5.6);height:calc(var(--u)*5.6)}
.btn.big{height:calc(var(--u)*19);width:calc(var(--u)*76);border-radius:calc(var(--u)*7);font-size:calc(var(--u)*8.2);animation:pulse 1.5s ease-in-out infinite}
.btn.big .pt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
.btn.big small{font-size:calc(var(--u)*3.6);opacity:.92;font-weight:800}
.btn.big .pi svg{width:calc(var(--u)*9);height:calc(var(--u)*9)}
@keyframes pulse{50%{transform:scale(1.045)}}
/* home */
.logo{text-align:center;margin-top:calc(var(--u)*10);line-height:.98;animation:floaty 3.2s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(calc(var(--u)*-1.6))}}
.l1,.l2{font-weight:900;letter-spacing:.02em;text-shadow:0 calc(var(--u)*1.2) 0 #a23623,0 calc(var(--u)*2.4) 0 #6f2216,0 calc(var(--u)*3.6) calc(var(--u)*4) rgba(0,0,0,.45);-webkit-text-stroke:calc(var(--u)*1) #6f2216;paint-order:stroke fill}
.l1{font-size:calc(var(--u)*19);color:#fff}
.l2{font-size:calc(var(--u)*24);color:#ffe14d;text-shadow:0 calc(var(--u)*1.2) 0 #d9851a,0 calc(var(--u)*2.4) 0 #8a4a00,0 calc(var(--u)*3.6) calc(var(--u)*4) rgba(0,0,0,.45);-webkit-text-stroke-color:#8a4a00}
.l3{font-size:calc(var(--u)*3.8);letter-spacing:calc(var(--u)*1.1);margin-top:calc(var(--u)*3.6);text-shadow:var(--ts);opacity:.96}
.homebot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*5);padding-bottom:calc(var(--u)*9)}
.row3{display:flex;gap:calc(var(--u)*4)}
.sq{width:calc(var(--u)*22);height:calc(var(--u)*23);border-radius:calc(var(--u)*5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.2);color:#5c3f78;background:linear-gradient(#fff,#e3def2);box-shadow:0 calc(var(--u)*1.2) 0 #9a92bd,0 calc(var(--u)*2.4) calc(var(--u)*3) rgba(0,0,0,.3);font-size:calc(var(--u)*3.5);transition:transform .08s}

.sq i{display:block;width:calc(var(--u)*8.6);height:calc(var(--u)*8.6)}
.sq svg{width:100%;height:100%}
/* levels */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(var(--u)*3) calc(var(--u)*3.6) calc(var(--u)*8);margin-top:calc(var(--u)*2);touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.world{background:rgba(30,14,40,.5);border-radius:calc(var(--u)*5);padding:calc(var(--u)*3) calc(var(--u)*3) calc(var(--u)*3.4);margin-bottom:calc(var(--u)*3.4);box-shadow:inset 0 0 0 calc(var(--u)*.4) rgba(255,255,255,.12)}
.whead{display:flex;align-items:center;gap:calc(var(--u)*2.4);font-size:calc(var(--u)*4.6);margin-bottom:calc(var(--u)*2.4);text-shadow:var(--ts)}
.wn{display:grid;place-items:center;width:calc(var(--u)*7.4);height:calc(var(--u)*7.4);border-radius:50%;background:var(--ac);font-size:calc(var(--u)*4.4);box-shadow:0 calc(var(--u)*.7) 0 rgba(0,0,0,.28)}

/* ============================================================
 *  04_sim.js — knife physics + world queries (pure: no DOM, runs in Node for the bot / level checks)
 *  World W: { pl:[platform], zones:[{x0,x1,y0,y1}], spk:[{x0,x1,y0,y1}], tower, voidY, cps:[{pi}] }

 * ============================================================ */

const PERFECT_RADIUS = 0.32;

const crumbled = (K, p) => p.crum && K.cr[p.id] !== undefined && K.t - K.cr[p.id] > PHYS.CRUMB;

function newKnife(W, pi, tipx) {

    outline: KNIFE_OUTLINES.chef, depth: -PHYS.SINK, lean: 0, grip: 0, steady: 0, feather: 0, flightLean: 0, tapPhase: 0 };

function placeStuck(K, W) {

/* ---- music: slow pentatonic arpeggio over a 4-chord loop, root depends on the world ---- */
const M_CH = [[0,4,7,11],[9,12,16,19],[5,9,12,16],[7,11,14,17]];
const MELODY = [2,-1,1,-1,3,2,-1,-1,1,-1,0,2,-1,1,-1,-1];
function musicTick() {
  const c = AUD.ctx; if (!c || !AUD.music) return;
  const bench=UI.screen==='shop',beat=60/(bench?82:G.idx===9&&!G.demo?120:100+AUD.world*2)/2;                                   // eighth notes
  if (AUD.mNext < c.currentTime - 0.2) AUD.mNext = c.currentTime + 0.05;   // after a pause / toggle: don't replay the missed beats in one burst
  while (AUD.mNext < c.currentTime + 0.25) {
    const t = Math.max(AUD.mNext, c.currentTime), s = AUD.mStep, ch = M_CH[(s >> 4) & 3], root = 55 + AUD.world * 2;
    const phase = s & 15, offset = (s & 1) * beat * 0.065;
    const pitch = NOTE(root + 12 + ch[[0,1,2,1,3,2,1,2][s & 7]]);
    if(bench){
      if(phase%4===0){
        tone('sine',pitch,pitch,t,beat*2.8,.20,AUD.musG);
        tone('triangle',pitch*2.01,pitch*2,t+.012,beat*.62,.052,AUD.musG);
        tone('sine',pitch*1.5,pitch*1.5,t+beat*.72,beat*1.8,.065,AUD.musG);
      }
      AUD.mNext+=beat;AUD.mStep++;continue;
    }
    if(phase%4!==3){
      tone('triangle',pitch,pitch,t+offset,beat*1.45,phase%4?.095:.15,AUD.musG);
      tone('sine',pitch*2.005,pitch*2,t+offset+.009,beat*.65,.038,AUD.musG);
    }
    if (phase % 4 === 0) {
      const bass = NOTE(root - 12 + ch[phase === 12 ? 2 : 0]);
      tone('sine',bass,bass,t,beat*2.7,.33,AUD.musG);
      tone('sine',78,41,t,.11,.18,AUD.musG);
    }
    if (phase % 4 === 2) noiseBurst(t+offset,.052,.047,3000,1600,.65,'bandpass',AUD.musG);
    const note = MELODY[(phase + ((s >> 4) & 1)*4) % 16];
    if (note >= 0 && ((s >> 4) & 1 || phase < 9)) {
      const lead = NOTE(root+24+ch[note]);
      tone('sine',lead,lead,t+offset,beat*1.9,.115,AUD.musG);
      tone('sine',lead*2,lead*2,t+offset+.055,beat*.7,.022,AUD.musG);
    }
    AUD.mNext += beat; AUD.mStep++;
  }
}
function musicStart(world) {
  AUD.world = world || 0; if (!AUD.ctx || AUD.mTimer) return;

}

function drawModelCards(root,knives=false){

    const faces=[],f=mesh.f,scale=POWER_BY_ID[id]?72:52;
    for(let k=0;k<f.length;k+=PS*3){
      const v=[0,PS,PS*2].map(i=>turn(f[k+i],f[k+i+1],f[k+i+2]));
      const n=turn(f[k+3],f[k+4],f[k+5]),lit=.72+.28*Math.max(0,-.45*n[0]+.72*n[1]+.55*n[2]);

    case 'lvl': { const i = +d.i; if (isOpen(i)) { sfx('ui'); startLevel(i,'choose'); } else { sfx('no'); toast(tr('locked')); } break; }

    case 'sfx': AUD.on = SAVE.opts.sfx = !SAVE.opts.sfx; audApply(); saveWrite(); renderSettings(); sfx('ui'); break;
    case 'music': AUD.music = SAVE.opts.music = !SAVE.opts.music; audApply(); saveWrite(); renderSettings(); break;

      else { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignore */ } const keep = SAVE.opts; Object.assign(SAVE, { coins: 0, unlocked: 1, stars: new Array(NUM_LEVELS).fill(0), best: new Array(NUM_LEVELS).fill(0), owned: ['chef'], knife: 'chef', seen: { tap2: false }, plays: 0, stock: freshStock(), loadout: '', daily: { day: -1, count: 0 } }); SAVE.opts = keep; saveWrite(); UI.resetArm = 0; uiRenderAll(); sfx('back'); }

/* ---------------- shop preview (3D) ---------------- */
/* Equipment workbench. Targets and fragments use the same meshes as the course. */
const BENCH = { top:-.27, socket:.86, flight:.97, pause:.73, sink:.115 };
let benchMesh, horizonMesh;
function buildWorkbench() {
  const n=24, wood=hexc('#d99c60'), bark=hexc('#a36942'), iron=hexc('#4e494a');
  const cyl=(a,b,r0,r1,c)=>hPrism({axis:'y',a,b,r0,r1,seg:n,col:c});
  const top=BENCH.top, h=[cyl(-7,top-.08,1.63,1.98,bark),cyl(top-.09,top,1.98,1.91,wood)];
  const face=h[0].polys;
  for(let i=0;i<n;i++){
    const q=face[i]; for(let j=0;j<4;j++){
      q[j*PS+10]=(130+(j<2?0:60))/1024;q[j*PS+11]=(962+(j===0||j===3?0:60))/1024;
    }
  }
  for(let i=0;i<n;i++) {
    const shade=.89+.065*Math.sin(i*2.8)+.052*Math.cos(i);
    bandShade(face[i],shade*1.13,shade*.63);
  }
  h.push(cyl(top-.61,top-.49,1.982,1.982,iron),cyl(top-.495,top-.475,1.984,1.984,hexc('#c49462')));
  for (let i=0;i<n;i+=3) {
    const a=TAU*i/n;
    h.push(hSphere(.041,4,7,hexc('#d8b381'),null,iron,1.978*Math.cos(a),top-.55,1.978*Math.sin(a)));
  }
  const grain=[];
  for(let j=1;j<=10;j++) {
    const r=j*.165;
    for(let i=0;i<48;i++){
      const p=(k,dr)=>{const a=k*TAU/48, rad=r*(1+.03*Math.sin(3*a+j*.06)+.025*Math.sin(5*a))+dr;
        return [-.13+rad*Math.cos(a),top+.004,.06+rad*Math.sin(a)*.94];};
      grain.push(mkPoly([p(i,0),p(i+1,0),p(i+1,.011),p(i,.011)],[0,1,0],hexc(j%3?'#c48b55':'#b97c4c')));
    }
  }
  for(const side of [-1,1]) {
    const x=side*BENCH.socket;
    grain.push(mkPoly([[x-.15,top+.008,-.016],[x+.18,top+.008,-.036],[x+.06,top+.008,.020],[x-.10,top+.008,.028]],[0,1,0],hexc('#74503b')));
  }
  h.push({polys:grain}); return bakeMesh(h);
}
function newSample(side=-1,placing=false) {
  const count=MATERIAL_ORDER.length,last=UI.sampleIndex;
  let i=Math.floor(rand()*(last<0?count:count-1)); if(last>=0&&i>=last)i++;
  UI.sampleIndex=i;
  const type=MATERIAL_ORDER[i], x=-side*BENCH.socket, n=({stack:4,pencils:4,rings:2,lego:1})[type]||1;
  const prop=SLICEABLE[type]({t:type,x,y:BENCH.top,n,w:1.31,length:.70,shift:Math.floor(rand()*8)},rand);
  UI.sample={type,prop,side,phase:'ready',t:0,hit:false,halves:[],hold:0,arrival:placing?.16:0};
  return UI.sample;
}
function previewCut() {
  const s=UI.sample||newSample();
  if(s.phase!=='ready')return;
  s.phase='flight';s.t=0;
  sfx('launch',{knife:KNIVES[UI.shopIdx]});
}
function benchPose(s) {
  const dir=-s.side, u=s.phase==='ready'?0:s.phase==='flight'?clamp(s.t/BENCH.flight,0,1):1;
  const lean=.23, start=-Math.PI/2+dir*lean, end=-Math.PI/2-dir*lean;
  const spin=sstep(.03,.71,u), a=lerp(start,end,spin)+dir*TAU*spin;
  // The tip ends in the new socket. Horizontal travel is complete before contact.
  const sx=lerp(s.side*BENCH.socket,dir*BENCH.socket,sstep(.035,.64,u));
  const restAngle=lerp(start,end,sstep(.04,.65,u));
  const restX=sx-KNIFE_TIP*Math.cos(restAngle),baseY=BENCH.top-BENCH.sink-KNIFE_TIP*Math.sin(restAngle);
  const wobble=s.phase==='landed'?dir*Math.sin(s.t*35)*Math.exp(-s.t*13)*.055:s.phase==='ready'?-dir*.045*UI.pressBlend:0;
  return {a:a+wobble,x:restX+KNIFE_TIP*(Math.cos(a)-Math.cos(a+wobble)),y:baseY+8.0*u*(1-u)+KNIFE_TIP*(Math.sin(a)-Math.sin(a+wobble))};
}
function contactOnDescent(s,old,pose) {
  if(pose.y>=old.y)return;
  const weapon=KNIVES[UI.shopIdx],skin=contactSkin(weapon),nx=-Math.sin(pose.a),ny=Math.cos(pose.a);
  // This guided throw is already blade-down when it reaches the workpiece.
  for(const q of s.prop.pcs){
    if(q.state)continue;
    const p=q.pc,target={o:s.prop,q,by:0,dx:0,dy:0};
    sweepContacts(skin,pose,old,[target]);const hit=target.hit;if(!hit)continue;
    const x=p.x+hit.hx,y=p.y+hit.hy;
    const pair=slicePiece(p,nx,ny,0,nx*x+ny*y);if(!pair[0]||!pair[1])continue;
    if(!s.hit){
      s.hit=true;s.hold=CUT_TIME[s.type]*.35;materialImpact(UI.sampleFX,s.type,weapon,x,y,pose.a);
      sfx('slice',{knife:weapon});materialSound(s.type,weapon);vib(8);
    }
    q.state=1;
    pair.forEach((pc,j)=>{
      const sign=j?-1:1;setCutMotion(pc,s.type,sign,nx,ny,0,-3);
      pc.wy+=sign*1.8;pc.vz+=sign*.18;s.halves.push(pc);
    });
  }
}
function updateSample(dt) {
  const s=UI.sample||newSample();
  s.arrival=Math.max(0,s.arrival-dt);
  if(s.phase==='ready')return;
  // Fixed substeps protect the contact crossing and the pile at low frame rates.
  for(let left=Math.min(dt,.25);left>1e-7;){
    const step=Math.min(1/120,left);left-=step;
    if(s.hold>0){s.hold-=step;continue;}
    if(s.phase==='flight'){
      const old=benchPose(s);
      s.t=Math.min(s.t+step,BENCH.flight);
      if(s.t/BENCH.flight>=.65)contactOnDescent(s,old,benchPose(s));
      if(s.t>=BENCH.flight){s.phase='landed';s.t=0;sfx('stick',{knife:KNIVES[UI.shopIdx]});}
    } else if((s.t+=step)>=BENCH.pause){
      newSample(-s.side,true);return;
    }
    for(const p of s.halves){
      advanceFragment(p,step,14);
      const R=p.R, pts=p.pts;
      let pen=0;
      for(let i=0;i<pts.length;i+=3){
        const x=pts[i],y=pts[i+1],z=pts[i+2];
        const wx=p.x+R[0]*x+R[1]*y+R[2]*z,wz=p.z+R[6]*x+R[7]*y+R[8]*z;
        if(wx*wx+wz*wz<1.91*1.91)pen=Math.max(pen,BENCH.top-p.y-R[3]*x-R[4]*y-R[5]*z);
      }
      if(pen>0&&p.vy<0&&p.y>BENCH.top-.2){p.y+=pen;p.vy*=-CUT_RESPONSE[s.type].bounce;p.vx*=.97;p.wz*=.96;}
    }
    tickImpacts(UI.sampleFX,step);
  }
}

  SC.cloudB.sprite(2.3,3.6,-11,2.5,2.5,0,[1,.89,.65,.8],atlUV('sun',2));
  for(const [x,y,z,w] of [[-5,2.4,-8,4],[4.6,1.9,-10,4.6]])SC.cloudB.sprite(x,y,z,w,w*.27,0,[1,.94,.85,.65],atlUV('cloud0',4));
  o.addMesh(horizonMesh,0,0,0,null,1,null);o.addMesh(benchMesh,0,0,0,null,1,null);
  const sx=-s.side*BENCH.socket;
  t.flat(sx,BENCH.top+.012,0,.82,.62,[.21,.12,.08,s.hit?.09:.36],soft);
  for(const q of s.prop.pcs)if(!q.state){
    const p=q.pc,arrival=.18*(s.arrival/.16)**2;
    o.addMesh(p.mesh,p.x,p.y+arrival,p.z,null,1,null);
  }
  for(const p of s.halves){
    const size=s.phase==='landed'?1-sstep(.45,BENCH.pause,s.t):1;
    if(size<=.01)continue;
    o.addMesh(p.mesh,p.x,p.y,p.z,p.R,size,null);
    if(Math.hypot(p.x,p.z)<1.6)t.flat(p.x,BENCH.top+.012,p.z,.55*size,.43*size,[.22,.12,.06,.22*size],soft);
  }
  const tipX=pose.x+KNIFE_TIP*Math.cos(pose.a);
  t.flat(tipX,BENCH.top+.013,0,.43,.28,[.18,.1,.07,.28],soft);
  o.addMesh(knifeMesh(k.id),pose.x,pose.y,0,matZX(pose.a,.16,R3),1,k.rainbow?hsvc(UI.shopT*.12,.22,1):null);
  if(s.phase==='flight'&&!s.hit){
    const prev=benchPose({...s,t:Math.max(0,s.t-.008)});
    drawSpinCast(k,pose.x,pose.y,pose.a,(pose.a-prev.a)/.008,s.t>.06);
  }
  drawImpacts(UI.sampleFX,o,a);
  GFX.render({clouds:SC.cloudB,stat:[],opaque:o,trans:t,add:a});
}

/* ==== 10_main.js ==== */
/* ============================================================
 *  10_main.js — boot, layout, input, main loop
 * ============================================================ */
const PARAMS = (() => { try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(''); } })();
const MAIN = {
  cv: null, fx: null, fctx: null, fd: 1, last: 0, qScale: 1, lowN: 0, accT: 0, accN: 0, errs: 0, errT: 0, clearedFx: false, lastL: null, dead: false,
  bot: false, steps: 1, noadapt: PARAMS.has('noadapt'), swipe: null,
};

/* ---------------- layout: a centred portrait stage; canvases scale with devicePixelRatio and the quality setting ---------------- */
function layout() {
  MAIN.frozenView=-1;
  const iw = window.innerWidth || document.documentElement.clientWidth || 360, ih = window.innerHeight || document.documentElement.clientHeight || 640;
  const sw = Math.round(Math.max(180, Math.min(iw, ih * 0.62))), sh = Math.max(240, ih);
  const st = UI.stage; st.style.width = sw + 'px'; st.style.height = sh + 'px';
  document.documentElement.style.setProperty('--u', (sw / 100) + 'px');
  UI.w = sw; UI.h = sh;
  if (!MAIN.cv) return;
  const nat = window.devicePixelRatio || 1, q = SAVE.opts.q | 0;
  let dpr = (q === 2 ? 0.75 : Math.min(nat, 2)) * (q === 0 ? MAIN.qScale : 1);
  const maxPix = q === 1 ? 4.5e6 : 3.2e6;
  if (sw * sh * dpr * dpr > maxPix) dpr = Math.sqrt(maxPix / (sw * sh));
  dpr = Math.max(0.5, dpr);
  GFX.resize(sw, sh, dpr);
  MAIN.fd = Math.min(dpr, 1.5);
  MAIN.fx.width = Math.round(sw * MAIN.fd); MAIN.fx.height = Math.round(sh * MAIN.fd);
  MAIN.fctx.setTransform(MAIN.fd, 0, 0, MAIN.fd, 0, 0);
  UI.q = dpr;
}

function showFatal(msg) {
  MAIN.dead = true;
  const d = document.createElement('div'); d.id = 'nogl'; d.textContent = msg;
  (UI.stage || document.body).appendChild(d);
}

/* pause when the player leaves the page / window */
function autoPause() {
  if (UI.screen === 'play' && G.mode === 'play') { Game.pause(); showScreen('pause'); $('#hud').classList.remove('hidden'); }
}
function kickMusic() { if (AUD.ctx && !AUD.mTimer) musicStart(G.L ? G.L.world : 0); }

/* ---------------- input ---------------- */
function bindInput() {
  const st = UI.stage;
  // A short tap must show its down state before an action replaces the whole screen.
  const minimumPress = 75, held = new Map(), states = new WeakMap();
  function press(el, id) {
    if (!el || held.has(id)) return;
    let state = states.get(el);
    if (!state) { state = { until:0, release:0, pending:false, down:0 }; states.set(el,state); }
    clearTimeout(state.release); state.swiped=false; state.until = performance.now() + minimumPress; state.down++;
    held.set(id,el); el.classList.add('is-pressed');
    if(el.dataset.act==='sampleRandom') UI.modelPressed=true;
    if (SAVE.opts.vib && navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(8);
  }
  function release(id, cancel = false) {
    const el = held.get(id); if (!el) return;
    held.delete(id);
    const state = states.get(el); if (--state.down > 0) return;
    clearTimeout(state.release);
    const lift=()=>{el.classList.remove('is-pressed'); if(el.dataset.act==='sampleRandom') UI.modelPressed=false;};
    if (cancel) { state.until=0; lift(); return; }
    state.release=setTimeout(lift, Math.max(0,state.until-performance.now()));
  }
  function activate(el) {
    if (!el) return;
    if (!states.has(el) || (!el.classList.contains('is-pressed') && !el.matches(':active'))) { press(el,'activation'); release('activation'); }
    const state = states.get(el);
    if (el.getAttribute('aria-disabled') === 'true' || el.disabled || state.pending) return;
    state.pending = true;
    const view = UI.view;
    const run = () => {
      state.pending = false;
      if (UI.view === view && el.isConnected && !el.closest('.screen.hidden') && el.getAttribute('aria-disabled') !== 'true') act(el.dataset.act,el.dataset);
    };
    const remaining = state.until - performance.now();
    if (remaining > 0) setTimeout(run,remaining); else run();
  }
  const shortcut = action => activate(st.querySelector('.screen:not(.hidden) button[data-act="'+action+'"]'));
  st.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    audInit(); kickMusic();
    const button = e.target.closest?.('button[data-act]');
    if (button) {
      press(button,e.pointerId);
      if (button.dataset.act==='sampleRandom') MAIN.swipe={x:e.clientX,y:e.clientY,id:e.pointerId,button,done:false};
      return;
    }
    if (UI.screen === 'play') { e.preventDefault(); Game.tap(); }
    else if (UI.screen === 'shop' && !UI.shopGrid) MAIN.swipe = { x:e.clientX,y:e.clientY,id:e.pointerId,done:false };
  }, { passive:false });
  st.addEventListener('pointerout', e => {
    const el = held.get(e.pointerId);
    if (el && !el.contains(e.relatedTarget)) release(e.pointerId,true);
  });
  window.addEventListener('pointerup', e => release(e.pointerId));
  window.addEventListener('pointercancel', e => release(e.pointerId,true));
  window.addEventListener('blur', () => { for (const id of held.keys()) release(id,true); });
  st.addEventListener('pointermove', (e) => {
    const s = MAIN.swipe; if (!s || s.done || e.pointerId !== s.id) return;
    const dx = e.clientX - s.x;
    if (Math.abs(dx)>UI.w*.12 && Math.abs(dx)>Math.abs(e.clientY-s.y)) {
      s.done=true;
      if(s.button) { const state=states.get(s.button); if(state) state.swiped=true; release(e.pointerId,true); }
      shortcut(dx<0?'knext':'kprev');
    }
  });
  const endSwipe = () => { MAIN.swipe = null; };
  st.addEventListener('pointerup', endSwipe); st.addEventListener('pointercancel', endSwipe);
  st.addEventListener('click', (e) => {
    const el = e.target.closest?.('button[data-act]');
    if (!el) return;
    e.preventDefault(); if(!states.get(el)?.swiped) activate(el);
  });
  window.addEventListener('keyup', e => release(e.code || e.key));
  window.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key, scr = UI.screen;
    audInit(); kickMusic();
    const focused = e.target.closest?.('button[data-act]');
    if (focused && !focused.closest('.screen.hidden') && (k === 'Enter' || k === ' ')) {
      if (e.repeat) e.preventDefault(); else press(focused,e.code || k);
      return;
    }
    const tapKey = k === ' ' || k === 'Spacebar' || k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'Enter';
    if (tapKey) {
      if (scr === 'play') { e.preventDefault(); if (!e.repeat) Game.tap(); return; }
      if (e.repeat) return;
      if (k === 'Enter' || k === ' ') {
        if (scr === 'home') { e.preventDefault(); shortcut('play'); }
        else if (scr === 'pause') { e.preventDefault(); shortcut('resume'); }
        else if (scr === 'fail') { e.preventDefault(); shortcut('retry'); }
        else if (scr === 'result') { e.preventDefault(); shortcut($('#scr-result [data-act="next"]') ? 'next' : 'retry'); }
        else if (scr === 'shop') { e.preventDefault(); shortcut('sampleRandom'); }
      }
      return;
    }
    if (k === 'p' || k === 'P') { if (scr === 'play') shortcut('pause'); else if (scr === 'pause') shortcut('resume'); return; }
    if (k === 'Escape') {
      if (scr === 'play') shortcut('pause'); else if (scr === 'pause') shortcut('resume'); else if(scr==='powers')shortcut('powerBack');
      else if (scr === 'shop') shortcut('shopBack'); else if (['levels','settings','supplies','fail','result'].includes(scr)) shortcut('home');
      return;
    }
    if (scr === 'shop') { if (k === 'ArrowLeft') shortcut('kprev'); else if (k === 'ArrowRight') shortcut('knext'); }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { autoPause(); try { if (AUD.ctx) AUD.ctx.suspend(); } catch (e) { /* ignore */ } }
    else { audResume(); MAIN.last = performance.now(); }
  });
  window.addEventListener('blur', autoPause);
  window.addEventListener('pagehide', autoPause);
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 250));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);

  /* keep the page itself still: no rubber-band scrolling, pinch zoom, long-press menus */
  document.addEventListener('touchmove', (e) => { if (!(e.target.closest && e.target.closest('.scroll, .modal'))) e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  MAIN.cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); MAIN.dead = true; });
  MAIN.cv.addEventListener('webglcontextrestored', () => { try { location.reload(); } catch (e) { /* ignore */ } });
}

/* ---------------- frame loop ---------------- */
function onFrameError(e) {
  try { console.error(e); } catch (_) { /* ignore */ }
  const now = performance.now(); if (now - MAIN.errT > 2000) MAIN.errs = 0; MAIN.errT = now; MAIN.errs++;
  if (MAIN.errs === 4 && UI.screen === 'play') { try { act('home'); } catch (_) { /* ignore */ } }
  if (MAIN.errs > 60) showFatal(LANG === 'zh' ? '出错了，请刷新页面重试。' : 'Something went wrong. Please reload the page.');
}
function adaptQuality(dt) {
  if (MAIN.noadapt || (SAVE.opts.q | 0) !== 0 || document.hidden) return;
  MAIN.accT += dt; MAIN.accN++;
  if (MAIN.accT < 1.6) return;
  const fps = MAIN.accN / MAIN.accT; MAIN.accT = 0; MAIN.accN = 0; UI.fps = fps;
  const capped = Math.abs(fps - 30) < 1.2;                        // a steady 30 means the display / power mode caps us, not the GPU
  if (fps < 38 && !capped) {
    if (++MAIN.lowN >= 2 && MAIN.qScale > 0.56) { MAIN.qScale = Math.max(0.55, MAIN.qScale * 0.82); MAIN.lowN = 0; layout(); }
  } else MAIN.lowN = 0;
}
function frame(now) {
  requestAnimationFrame(frame);
  if (MAIN.dead || document.hidden) return;
  let dt = (now - MAIN.last) / 1000; MAIN.last = now;
  if(G.mode==='play'&&!G.dead&&!G.fin&&!G.demo)stats?.tick(dt*1000);
  if (!(dt > 0) || dt > 0.25) dt = 1 / 60;
  try {
    if (UI.screen === 'shop') {
      MAIN.frozenView=-1;
      if(!UI.shopGrid)shopDraw(dt);
      if (!MAIN.clearedFx) { MAIN.fctx.clearRect(0, 0, UI.w, UI.h); MAIN.clearedFx = true; }
    } else {
      if (G.L !== MAIN.lastL) { MAIN.lastL = G.L; applyTheme(); }
      for (let i = 0; i < MAIN.steps; i++) { if (MAIN.bot && G.mode === 'play') botTick(Math.min(dt, 0.05)); Game.update(dt); }
      const frozen=G.mode==='pause'||G.mode==='failed';
      if(!frozen||MAIN.frozenView!==UI.view){
        Game.draw();fxOverlay(MAIN.fctx, UI.w, UI.h);MAIN.clearedFx=false;
      }
      MAIN.frozenView=frozen?UI.view:-1;
    }
    uiFrame();
  } catch (e) { onFrameError(e); }
  adaptQuality(dt);
}

/* ---------------- boot ---------------- */
function boot() {
  if(!document.fonts) { startGameApp(); return; }
  document.fonts.load('900 72px "Slice Han UI"','终点记录点通关×0123456789').catch(()=>{}).then(startGameApp).catch(e=>showFatal(String(e.message||e)));
}
function startGameApp() {
  saveLoad();
  LANG = SAVE.opts.lang === 'en' ? 'en' : 'zh';
  AUD.on = SAVE.opts.sfx !== false; AUD.music = SAVE.opts.music !== false;
  UI.stage = $('#stage'); MAIN.cv = $('#gl'); MAIN.fx = $('#fx'); MAIN.fctx = MAIN.fx.getContext('2d');
  let ok = false;
  try { ok = GFX.init(MAIN.cv, { pdb: PARAMS.has('pdb') }); } catch (e) { try { console.error(e); } catch (_) { /* ignore */ } }
  if (!ok) { layout(); showFatal(LANG === 'zh' ? '你的浏览器不支持 WebGL，请换用最新版 Chrome / Safari / Edge / Firefox。' : 'Your browser does not support WebGL. Please use a recent Chrome, Safari, Edge or Firefox.'); return; }
  layout();
  uiBuild();
  Game.onFinish = showResult; Game.onFail = showFail;
  bindInput();
  UI.demoIdx = 0;
  showScreen('home');
  const lvl = PARAMS.get('lvl');
  if (lvl !== null && lvl !== '' && Number.isInteger(+lvl) && isOpen(+lvl)) startLevel(+lvl);
  const scr = PARAMS.get('screen');
  if (scr && ['levels', 'shop', 'settings', 'supplies'].includes(scr)) showScreen(scr);
  MAIN.last = performance.now();
  requestAnimationFrame(frame);
}
try { boot(); } catch (e) { try { console.error(e); } catch (_) { /* ignore */ } showFatal(String(e && e.message || e)); }

</script>
